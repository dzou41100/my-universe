// ==================== 项目完成度计算（新规则） ====================
// 规则：有子项目 → 取所有子项目进度的平均值（递归到最底层）；无子项目 → 设了次数看是否达标，无限则打卡1次即100%
function getProjPercent(p){
  if(p.children&&p.children.length){
    const sum=p.children.reduce((s,c)=>s+getProjPercent(c),0);
    return Math.round(sum/p.children.length);
  }
  if(p.total>0){
    return Math.min(100,Math.round((p.done/p.total)*100));
  }
  // 无限次数：只要打卡过一次就算完成
  return p.done>0?100:0;
}
function isProjDone(p){return getProjPercent(p)>=100;}
// 子项目里完成的下沉到底部，未完成的留在上面（组内原有顺序不变）
function sortChildrenByCompletion(arr){
  if(!arr||arr.length<2)return;
  arr.sort((a,b)=>(isProjDone(a)?1:0)-(isProjDone(b)?1:0));
}

// 项目树
function renderProjects(){
  const el=document.getElementById('growProj');if(!el)return;
  el.innerHTML=`<div id="projTree"></div><button class="fab-btn" id="addRootProjBtn">➕ 创建项目</button>`;
  document.getElementById('addRootProjBtn').onclick=openRootProj;renderProjTree();
}
function toggleProjCollapse(id){if(collapsedProjs.has(id)){collapsedProjs.delete(id);}else{collapsedProjs.add(id);}renderProjTree();}
function renderProjTree(){
  const listDiv=document.getElementById('projTree');if(!listDiv)return;
  if(!S.projs.length){listDiv.innerHTML='<div class="empty" data-icon="📂">还没有项目</div>';return;}
  // 默认收起所有有子项目的节点
  function autoCollapse(nodes){
    nodes.forEach(p=>{
      if(p.children&&p.children.length>0){
        if(!collapsedProjs.has(p.id))collapsedProjs.add(p.id);
        autoCollapse(p.children);
      }
    });
  }
  // 只在第一次渲染时自动收起（之后用户手动展开的不再重置）
  if(!renderProjTree._inited){autoCollapse(S.projs);renderProjTree._inited=true;}

  let _colorIdx=0;
  function renderNode(p,level,idx,siblings){
    const hasChildren=p.children&&p.children.length>0;
    const percent=getProjPercent(p);
    const isCollapsed=collapsedProjs.has(p.id);
    const toggleIcon=hasChildren?(isCollapsed?'▶':'▼'):'';
    const hasNotes=p.notes && p.notes.length > 0;
    const countLabel=hasChildren
      ?`(${p.children.filter(c=>getProjPercent(c)>=100).length}/${p.children.length})`
      :`(${p.done}/${p.total||'∞'})`;

    let cardClass, colorClass='';
    if(level===0){
      cardClass='project-card-root';
    } else {
      cardClass=level===1?'project-card-child':'project-card-grandchild';
      colorClass='pc-'+(_colorIdx%5);
      _colorIdx++;
    }

    const movebtns=siblings>1?`
      ${idx>1?`<button class="tree-action-btn" onclick="pinProjToTop('${p.id}')" title="置顶">📌</button>`:''}
      <button class="tree-action-btn" onclick="moveProjNode('${p.id}',-1)" style="${idx===0?'opacity:.3;pointer-events:none;':''}">↑</button>
      <button class="tree-action-btn" onclick="moveProjNode('${p.id}',1)" style="${idx===siblings-1?'opacity:.3;pointer-events:none;':''}">↓</button>`:'';

    return`<div class="${cardClass} ${colorClass}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        ${hasChildren?`<span onclick="toggleProjCollapse('${p.id}')" style="font-size:11px;color:var(--ink3);cursor:pointer;width:16px;flex-shrink:0;user-select:none">${toggleIcon}</span>`:'<span style="width:16px;flex-shrink:0"></span>'}
        <span style="flex:1;font-weight:${level===0?'700':'600'};font-size:${level===0?'16px':'15px'};cursor:${hasChildren?'pointer':'default'}" onclick="${hasChildren?`toggleProjCollapse('${p.id}')`:''}">${level===0?'📁 ':''}${esc(p.name)} <span style="font-size:12px;font-weight:400;color:var(--ink3)">${countLabel}</span></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div><div style="font-size:11px;color:var(--ink3)">完成 ${percent}%</div>
      <div style="display:flex;gap:2px;margin:6px 0 0;flex-wrap:wrap;align-items:center;">
        ${movebtns}
        ${hasChildren?'':`<button class="tree-action-btn accent" onclick="checkInProj('${p.id}')">✅ 打卡</button>`}
        ${(!hasChildren&&p.done>0)?`<button class="tree-action-btn" onclick="undoCheckInProj('${p.id}')">↩️ 撤销</button>`:''}
        <button class="tree-action-btn" onclick="openSubProj('${p.id}')">➕ 子项目</button>
        ${hasNotes?`<button class="tree-action-btn" onclick="viewProjHistory('${p.id}')">📜 历史</button>`:''}
        <button class="tree-action-btn" onclick="editProjItem('${p.id}')">✏️ 编辑</button>
        <button class="tree-action-btn danger" onclick="delProjConfirm('${p.id}')">🗑️</button>
      </div>
      ${!isCollapsed&&hasChildren?(()=>{sortChildrenByCompletion(p.children);return`<div>${p.children.map((c,ci)=>renderNode(c,level+1,ci,p.children.length)).join('')}</div>`;})():(hasChildren?`<div style="font-size:11px;color:var(--ink3);padding:4px 0 2px">▶ ${p.children.length} 个子项目（已折叠）</div>`:'')}
    </div>`;
  }
  listDiv.innerHTML=S.projs.map((p,i)=>renderNode(p,0,i,S.projs.length)).join('');
}
// 通用上下移动：按id在树里找到它所在的那一层数组，和同级的兄弟节点交换位置
function findProjSiblings(id,list){
  list=list||S.projs;
  for(let i=0;i<list.length;i++){
    if(list[i].id===id)return{siblings:list,index:i};
    if(list[i].children&&list[i].children.length){
      const r=findProjSiblings(id,list[i].children);if(r)return r;
    }
  }
  return null;
}
function moveProjNode(id,dir){
  const r=findProjSiblings(id);if(!r)return;
  const{siblings,index}=r;const ni=index+dir;
  if(ni<0||ni>=siblings.length)return;
  [siblings[index],siblings[ni]]=[siblings[ni],siblings[index]];
  save();renderProjTree();
}
function pinProjToTop(id){
  const r=findProjSiblings(id);if(!r)return;
  const{siblings,index}=r;if(index<=0)return;
  const[node]=siblings.splice(index,1);
  siblings.unshift(node);
  save();renderProjTree();toast('已置顶 ✓');
}

function viewProjHistory(id){

      ${n.note?`<span style="display:block;margin-top:3px;color:var(--ink2)">${esc(n.note)}</span>`:''}
    </div>`).join('')}
  </div>`;
  showModal(`📜 ${proj.name} - 打卡记录`, body, null, null, {hideConfirm:true, cancelText:'关闭'});
}

function openSubProj(parentId){

function findProj(id,list){for(const p of list){if(p.id===id)return p;if(p.children){const found=findProj(id,p.children);if(found)return found;}}return null;}
function checkInProj(id){
  const proj=findProj(id,S.projs);if(!proj)return;
  if(proj.children&&proj.children.length){toast('该项目有子项目，请去子项目打卡');return;}
  if(proj.total>0&&proj.done>=proj.total){toast('已完成全部目标！');return;}
  proj.done++;
  if(!proj.notes)proj.notes=[];
  const entryId=uid();
  proj.notes.push({id:entryId,date:nowStr(),note:''});
  save();renderProjects();toast(`+1 ${proj.name}`);
  openCheckInNotePopup(id,entryId);
}
function openCheckInNotePopup(projId,entryId){
  const mask=document.createElement('div');
  mask.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s;';
  const card=document.createElement('div');
  card.style.cssText='background:var(--card);border-radius:18px 18px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));width:100%;max-width:500px;box-shadow:0 -4px 24px rgba(0,0,0,.25);';
  card.innerHTML=`
    <div style="font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:2px;">✅ 打卡成功！</div>
    <div style="font-size:11px;color:var(--ink3);margin-bottom:10px;">写点感想也行，不想写就点卡片外面直接关掉</div>
    <textarea id="checkinNoteTA" rows="3" placeholder="随手记两句…" style="width:100%;"></textarea>
    <button class="pbtn" id="checkinNoteSaveBtn" style="width:100%;margin-top:10px;">保存并关闭</button>`;
  mask.appendChild(card);
  document.body.appendChild(mask);
  const ta=card.querySelector('#checkinNoteTA');
  setTimeout(()=>ta.focus(),50);
  const saveAndClose=()=>{
    const val=ta.value.trim();
    if(val){
      const proj=findProj(projId,S.projs);
      const entry=proj?.notes?.find(n=>n.id===entryId);
      if(entry){entry.note=val;save();}
    }
    mask.remove();
  };
  mask.addEventListener('click',(e)=>{if(e.target===mask)saveAndClose();});
  card.querySelector('#checkinNoteSaveBtn').onclick=saveAndClose;
}
function undoCheckInProj(id){
  const proj=findProj(id,S.projs);if(!proj)return;
  if(!proj.done||proj.done<=0){toast('还没有打卡记录');return;}
  showModal('撤销上一次打卡','<p style="color:var(--ink2);font-size:14px;line-height:1.6">会去掉最近一次打卡记录（含备注），确定吗？</p>',()=>{
    proj.done=Math.max(0,proj.done-1);
    if(proj.notes&&proj.notes.length)proj.notes.pop();
    save();closeModal();renderProjects();toast('已撤销上一次打卡');
  },null,{showCancel:true});
}
function editProjItem(id){
  const p=findProj(id,S.projs);if(!p)return;

let _statsRange='week'; // 'week'=近7天, 'month'=近30天
function renderStats(){
  const el=document.getElementById('recStats');if(!el)return;
  el.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <div class="plan-outer-tab${_statsRange==='week'?' on':''}" data-sr="week" style="flex:1;text-align:center;">近7天</div>

    </div>

      <div id="statsBody"></div>

  el.querySelectorAll('[data-sr]').forEach(t=>{t.onclick=()=>{_statsRange=t.dataset.sr;renderStats();};});

// 递归统计"日计划"里已完成条目（按完成日期）
function countDonePlanItemsForDate(list,dateKey){
  let c=0;
  (list||[]).forEach(item=>{
    if(item.children&&item.children.length){
      c+=countDonePlanItemsForDate(item.children,dateKey);
    }else if(item.done&&item.completedAt&&formatDate(new Date(item.completedAt))===dateKey){
      c++;
    }
  });
  return c;
}
function renderStatsBody(){
  const wrap=document.getElementById('statsBody');if(!wrap)return;
  const days=_statsRange==='week'?7:30;
  const today=td();
  const dateKeys=[];
  for(let i=0;i<days;i++)dateKeys.push(addDaysStr(today,-i));
  const dateSet=new Set(dateKeys);

  // ---- 今日任务 / 日计划完成情况（合并统计） ----
  const taskCountByDay=dateKeys.map(dk=>
    (S.tasks||[]).filter(t=>t.done&&t.completedAt&&formatDate(new Date(t.completedAt))===dk).length
    +countDonePlanItemsForDate(S.plans&&S.plans.day,dk)
  );
  const taskTotal=taskCountByDay.reduce((a,b)=>a+b,0);

  // ---- 写日记 ----
  const diaryCountByDay=dateKeys.map(dk=>(S.diaries||[]).filter(d=>{const p=parseNowStr(d.date);return p&&p.dateKey===dk;}).length);
  const diaryTotal=diaryCountByDay.reduce((a,b)=>a+b,0);

  // ---- 阶段日程打卡率 ----
  const habitStats=(S.goodH||[]).map(h=>{
    const doneCount=dateKeys.filter(dk=>h.log&&h.log[dk]&&h.log[dk].status==='done').length;
    return{name:h.name,emoji:h.emoji,doneCount,rate:Math.round(doneCount/days*100)};
  }).sort((a,b)=>b.doneCount-a.doneCount);

  // ---- 项目打卡次数 ----
  const projStats=[];
  const walkProj=(list)=>{
    (list||[]).forEach(p=>{
      const cnt=(p.notes||[]).filter(n=>{const parsed=parseNowStr(n.date);return parsed&&dateSet.has(parsed.dateKey);}).length;
      if(cnt>0)projStats.push({name:p.name,cnt});
      if(p.children)walkProj(p.children);
    });
  };
  walkProj(S.projs);
  projStats.sort((a,b)=>b.cnt-a.cnt);

  // ---- 笔记 ----
  const noteCountByDay=dateKeys.map(dk=>(S.notes||[]).filter(n=>n.createdAt&&formatDate(new Date(n.createdAt))===dk).length);
  const noteTotal=noteCountByDay.reduce((a,b)=>a+b,0);

  wrap.innerHTML=`
    <div class="section-divider"><div class="stl">☑️ 今日任务 / 日计划</div></div>
    ${taskTotal?`
      <div style="font-size:12px;color:var(--ink2);margin-bottom:8px;">这段时间共完成 <b style="font-size:15px;color:var(--g)">${taskTotal}</b> 项</div>
      <div style="position:relative;height:160px;margin-bottom:8px;"><canvas id="chartTask"></canvas></div>
    `:'<div class="empty" data-icon="☑️">这段时间还没有完成的任务</div>'}

    <div class="section-divider"><div class="stl">📔 写日记</div></div>
    ${diaryTotal?`
      <div style="font-size:12px;color:var(--ink2);margin-bottom:8px;">这段时间共写了 <b style="font-size:15px;color:var(--g)">${diaryTotal}</b> 篇日记</div>
      <div style="position:relative;height:160px;margin-bottom:8px;"><canvas id="chartDiary"></canvas></div>
    `:'<div class="empty" data-icon="📔">这段时间还没有写日记</div>'}

    <div class="section-divider"><div class="stl">📅 阶段日程打卡</div></div>
    ${habitStats.length?`<div style="position:relative;height:${Math.max(120,habitStats.length*36)}px;margin-bottom:8px;"><canvas id="chartHabit"></canvas></div>`:'<div class="empty" data-icon="📅">还没有习惯</div>'}

    <div class="section-divider"><div class="stl">📂 项目打卡</div></div>
    ${projStats.length?`<div style="position:relative;height:${Math.max(120,projStats.length*36)}px;margin-bottom:8px;"><canvas id="chartProj"></canvas></div>`:'<div class="empty" data-icon="📂">这段时间没有项目打卡</div>'}

    <div class="section-divider"><div class="stl">📝 笔记</div></div>
    ${noteTotal?`
      <div style="font-size:12px;color:var(--ink2);margin-bottom:8px;">这段时间新建了 <b style="font-size:15px;color:var(--g)">${noteTotal}</b> 条笔记</div>
      <div style="position:relative;height:160px;margin-bottom:8px;"><canvas id="chartNote"></canvas></div>
    `:'<div class="empty" data-icon="📝">这段时间还没有新笔记</div>'}
  `;

  renderStatsCharts({habitStats,projStats,dateKeys,taskCountByDay,diaryCountByDay,noteCountByDay});
}

// Chart.js 是从 CDN 异步加载的（加了 defer，避免像之前 Firebase 那次一样卡住整个页面）。
// 万一网络问题导致它没加载成功，这里直接跳过画图，不会报错、不会影响页面其他部分。
let _statsCharts={};
function destroyStatsCharts(){
  Object.values(_statsCharts).forEach(c=>{if(c)c.destroy();});
  _statsCharts={};
}
function renderStatsCharts({habitStats,projStats,dateKeys,taskCountByDay,diaryCountByDay,noteCountByDay}){
  destroyStatsCharts();
  if(typeof Chart==='undefined')return; // 图表库没加载成功，静默跳过

  const gColor=getComputedStyle(document.body).getPropertyValue('--g').trim()||'#3d8b5e';
  const inkColor=getComputedStyle(document.body).getPropertyValue('--ink3').trim()||'#888';

  // 任务/日计划完成数：按天条形图（正序，从早到近）
  const taskCanvas=document.getElementById('chartTask');
  if(taskCanvas&&taskCountByDay){
    const ordered=[...dateKeys].reverse();
    const counts=[...taskCountByDay].reverse();
    _statsCharts.task=new Chart(taskCanvas,{
      type:'bar',
      data:{labels:ordered.map(dk=>dk.slice(5)),datasets:[{label:'完成数',data:counts,backgroundColor:gColor,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:inkColor,maxRotation:0}},y:{ticks:{color:inkColor,stepSize:1}}}}
    });
  }

  // 日记：按天条形图
  const diaryCanvas=document.getElementById('chartDiary');
  if(diaryCanvas&&diaryCountByDay){
    const ordered=[...dateKeys].reverse();
    const counts=[...diaryCountByDay].reverse();
    _statsCharts.diary=new Chart(diaryCanvas,{
      type:'bar',
      data:{labels:ordered.map(dk=>dk.slice(5)),datasets:[{label:'日记篇数',data:counts,backgroundColor:gColor,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:inkColor,maxRotation:0}},y:{ticks:{color:inkColor,stepSize:1}}}}
    });
  }

  // 习惯打卡率：横向条形图
  const habitCanvas=document.getElementById('chartHabit');
  if(habitCanvas&&habitStats.length){
    _statsCharts.habit=new Chart(habitCanvas,{
      type:'bar',
      data:{labels:habitStats.map(h=>h.emoji+' '+h.name),datasets:[{label:'打卡率%',data:habitStats.map(h=>h.rate),backgroundColor:gColor,borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{min:0,max:100,ticks:{color:inkColor}},y:{ticks:{color:inkColor}}}}
    });
  }

  // 项目打卡：横向条形图
  const projCanvas=document.getElementById('chartProj');
  if(projCanvas&&projStats.length){
    _statsCharts.proj=new Chart(projCanvas,{
      type:'bar',
      data:{labels:projStats.map(p=>p.name),datasets:[{label:'打卡次数',data:projStats.map(p=>p.cnt),backgroundColor:gColor,borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:inkColor,stepSize:1}},y:{ticks:{color:inkColor}}}}
    });
  }

  // 笔记：按天条形图
  const noteCanvas=document.getElementById('chartNote');
  if(noteCanvas&&noteCountByDay){
    const ordered=[...dateKeys].reverse();
    const counts=[...noteCountByDay].reverse();
    _statsCharts.note=new Chart(noteCanvas,{
      type:'bar',
      data:{labels:ordered.map(dk=>dk.slice(5)),datasets:[{label:'新建笔记数',data:counts,backgroundColor:gColor,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:inkColor,maxRotation:0}},y:{ticks:{color:inkColor,stepSize:1}}}}
    });
  }
}

// ==================== 笔记板块 ====================
let currentNoteType='all',noteSearchKeyword='';
function scrollNoteTabIntoCenter(activeBtn,tabBar){if(!activeBtn||!tabBar)return;const targetLeft=activeBtn.offsetLeft-(tabBar.clientWidth/2)+(activeBtn.offsetWidth/2);tabBar.scrollTo({left:Math.max(0,targetLeft),behavior:'smooth'});}

function renderNoteList(){
  const container=document.getElementById('noteListPage');if(!container)return;
  let filtered=S.notes.filter(n=>currentNoteType==='all'?true:n.type===currentNoteType);
  if(noteSearchKeyword){filtered=filtered.filter(n=>(n.title||'').toLowerCase().includes(noteSearchKeyword)||(n.fields&&Object.values(n.fields).some(v=>(v||'').toLowerCase().includes(noteSearchKeyword))));}
  filtered.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const tabHtml=`<button class="note-tab-btn ${currentNoteType==='all'?'on':''}" data-type="all">📋 全部</button>`
    +S.noteTypes.map(t=>`<button class="note-tab-btn ${currentNoteType===t?'on':''}" data-type="${esc(t)}">${esc(t)}</button>`).join('')
    +`<button class="note-tab-btn custom-manage" data-type="__manage">⚙️ 管理</button>`;
  container.innerHTML=`<div class="search-wrapper"><input id="noteSearch" class="search-bar" placeholder="搜索笔记…" value="${esc(noteSearchKeyword)}"><button class="search-btn" id="searchBtn">🔍</button></div><div class="note-tab-bar" id="noteTabBar">${tabHtml}</div><div class="list-header"><span class="list-count">${filtered.length} 条笔记</span><button class="new-note-btn" id="newNoteBtn">+ 新建</button></div><div id="noteItemsList"></div>`;
  const tabBar=document.getElementById('noteTabBar');
  document.getElementById('searchBtn').onclick=()=>{noteSearchKeyword=document.getElementById('noteSearch').value.toLowerCase();renderNoteList();};
  document.getElementById('noteSearch').onkeypress=e=>{if(e.key==='Enter'){noteSearchKeyword=e.target.value.toLowerCase();renderNoteList();}};
  document.querySelectorAll('.note-tab-btn').forEach(btn=>{btn.onclick=()=>{
    if(btn.dataset.type==='__manage'){manageNoteTypes();return;}
    currentNoteType=btn.dataset.type;renderNoteList();
    setTimeout(()=>{const activeBtn=document.querySelector('.note-tab-btn.on');const bar=document.getElementById('noteTabBar');scrollNoteTabIntoCenter(activeBtn,bar);},30);
  };});
  setTimeout(()=>{const activeBtn=tabBar.querySelector('.note-tab-btn.on');scrollNoteTabIntoCenter(activeBtn,tabBar);},60);
  document.getElementById('newNoteBtn').onclick=()=>openNoteEditor();
  
  const listDiv=document.getElementById('noteItemsList');
  if(!filtered.length){listDiv.innerHTML='<div class="empty" data-icon="📭">暂无笔记<br>点击右上角新建</div>';return;}
  
  listDiv.innerHTML=filtered.map(n=>{
    const mode=n.fields?.['_mode'];
    let preview;
    if(mode==='checklist'){
      const items=n.fields?.['_checklist']||[];const doneCt=items.filter(i=>i.done).length;
      preview=items.length?`☑️ ${doneCt}/${items.length} 已完成`:'☑️ 清单（暂无事项）';
    }else if(mode==='quadrant'){
      const q=n.fields?.['_quadrant']||{};const total=Object.values(q).reduce((s,arr)=>s+(arr?.length||0),0);
      preview=total?`🧭 四象限（共${total}项）`:'🧭 四象限（暂无事项）';
    }else if(mode==='numlist'){
      const items=(n.fields?.['_numlist']?.items||[]).filter(i=>i.text&&i.text.trim());
      preview=items.length?`🔢 自动编号（共${items.length}条）`:'🔢 自动编号（暂无内容）';
    }else{
      preview=n.fields?.['我的笔记']||n.fields?.['素材内容']||n.fields?.['名称']||'';
    }
    let attachmentCount = (n.images?.length || 0) + (n.files?.length || 0);
    let attachmentBadge = attachmentCount > 0 ? `<span style="font-size:11px;color:var(--g);background:var(--g-light);padding:1px 6px;border-radius:8px;margin-left:6px">📎 ${attachmentCount}</span>` : '';
    const createdText=n.createdAt?formatNoteTime(n.createdAt):'';
    
    return`<div class="note-card" data-id="${n.id}">
      <div class="note-card-header">
        <span>
          <strong style="font-size:14px">${esc(n.title||'无标题')}</strong>
          <span class="note-type-badge">${esc(n.type||'笔记')}</span>
          ${attachmentBadge}
        </span>
        <button class="note-del-btn delbtn" data-id="${n.id}">🗑️</button>
      </div>
      ${createdText?`<div style="font-size:11px;color:var(--ink3);margin-top:3px;">🕐 创建于 ${createdText}</div>`:''}
      ${n.tags&&n.tags.length?`<div class="note-tags">${n.tags.map(t=>`<span class="note-tag">#${esc(t)}</span>`).join('')}</div>`:''}
      ${preview?`<div class="note-preview">${esc(preview.substring(0,80))}</div>`:''}
    </div>`;
  }).join('');
  
  document.querySelectorAll('.note-card').forEach(c=>{c.onclick=(e)=>{if(!e.target.classList.contains('note-del-btn'))openNoteEditor(c.dataset.id);};});
  document.querySelectorAll('.note-del-btn').forEach(btn=>{btn.onclick=(e)=>{e.stopPropagation();confirmDel(()=>{S.notes=S.notes.filter(n=>n.id!==btn.dataset.id);save();renderNoteList();});};});
}

function manageNoteTypes(){
  const body=(container)=>{
    const render=()=>{
      container.innerHTML=`
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input id="newNoteTypeInput" placeholder="新分类名称（可加emoji）" style="flex:1">
          <button class="pbtn" id="addNoteTypeBtn">添加</button>
        </div>
        <div id="noteTypeManageList"></div>`;
      let html='';
      S.noteTypes.forEach((t,i)=>{
        html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(61,139,94,.06)">
          <span style="font-size:13px">${esc(t)}</span>
          <div style="display:flex;gap:6px"><button class="sbtn" data-ednt="${i}">✏️</button><button class="delbtn" data-dnt="${i}">🗑️</button></div>
        </div>`;
      });
      if(!html)html='<div style="color:var(--ink3);font-size:12px;padding:4px 0">还没有笔记分类</div>';
      container.querySelector('#noteTypeManageList').innerHTML=html;
      container.querySelector('#addNoteTypeBtn').onclick=()=>{
        const v=container.querySelector('#newNoteTypeInput').value.trim();
        if(!v)return;
        if(S.noteTypes.includes(v)){toast('该分类已存在');return;}
        S.noteTypes.push(v);save();toast('已添加');render();
      };
      container.querySelectorAll('[data-dnt]').forEach(btn=>{
        btn.onclick=()=>{const i=parseInt(btn.dataset.dnt);confirmDel(()=>{S.noteTypes.splice(i,1);save();render();});};
      });
      container.querySelectorAll('[data-ednt]').forEach(btn=>{
        btn.onclick=()=>{
          const i=parseInt(btn.dataset.ednt);
          prompt1('编辑分类','分类名称',S.noteTypes[i],(val)=>{
            const oldType=S.noteTypes[i];
            S.noteTypes[i]=val;
            S.notes.forEach(n=>{if(n.type===oldType)n.type=val;});
            save();render();
          });
        };
      });
    };
    render();
  };
  showModal('管理笔记分类',body,null,null,{hideConfirm:true});
}

function renderEditorAttachments() {
  const imgPreview = document.getElementById('editorImgPreview');
  const filePreview = document.getElementById('editorFilePreview');
  if(!imgPreview || !filePreview) return;
  
  imgPreview.innerHTML = currentEditorImages.map((img, idx) => `
    <div class="image-item">
      <img src="${img}">
      <button class="image-del" onclick="removeEditorImg(${idx})">✕</button>
    </div>
  `).join('');
  
  filePreview.innerHTML = currentEditorFiles.map((f, idx) => `
    <div class="file-item">
      <span class="file-name">📄 ${esc(f.name)}</span>
      <button class="file-del" onclick="removeEditorFile(${idx})">🗑️</button>
    </div>
  `).join('');
}

function removeEditorImg(idx) { currentEditorImages.splice(idx, 1); renderEditorAttachments(); }
function removeEditorFile(idx) { currentEditorFiles.splice(idx, 1); renderEditorAttachments(); }

let _noteDraft=null; // 暂存"基本信息"步骤填的内容：{title,type,fields,tags}
let _currentEditingNoteId=null;
let _noteDraftSaveTimer=null;
function persistNoteDraft(){
  if(!_noteDraft)return;
  const mode=_noteDraft.fields?.['_mode']||'text';
  const fields={...(_noteDraft.fields||{})};
  if(mode==='quadrant')fields['_quadrant']=_quadState;
  else if(mode==='checklist')fields['_checklist']=_checklistState;
  else if(mode==='numlist')fields['_numlist']=_numlistState;
  else{
    const bodyEl=document.getElementById('note_body');
    if(bodyEl)fields['我的笔记']=bodyEl.value;
  }
  S.noteEditDraft={noteId:_currentEditingNoteId,title:_noteDraft.title,type:_noteDraft.type,fields,tags:_noteDraft.tags,images:currentEditorImages,files:currentEditorFiles,ts:Date.now()};
  save();
}
function persistNoteDraftDebounced(){
  if(_noteDraftSaveTimer)clearTimeout(_noteDraftSaveTimer);
  _noteDraftSaveTimer=setTimeout(persistNoteDraft,1200);
}
function getFieldsForType(typeName){
  if(typeName.includes('收藏'))return['来源链接','原文摘要'];
  if(typeName.includes('书影')||typeName.includes('影'))return['名称','作者/导演'];
  if(typeName.includes('素材'))return['素材内容'];
  return[];
}
function renderBasicInfoFields(typeName,draft,isNewNote){
  const metaFields=getFieldsForType(typeName);
  const metaHtml=metaFields.map(f=>`<div class="note-field-group"><div class="note-field-label">${f}</div><input type="text" id="basic_meta_${f.replace(/\s/g,'_').replace(/\//g,'_')}" class="note-input" value="${esc(draft?.fields?.[f]||'')}"></div>`).join('');
  const tagsHtml=typeName.includes('素材')?`<div class="note-field-group"><div class="note-field-label">自定义标签（逗号分隔）</div><input type="text" id="basic_note_tags" class="note-input" value="${esc((draft?.tags||[]).join(', '))}"></div>`:'';
  const curMode=draft?.fields?.['_mode']||'text';
  const modeHtml=(isNewNote&&typeName.includes('通用'))?`<div class="note-field-group"><div class="note-field-label">内容形式</div><select id="basic_note_mode" class="note-select">
      <option value="text" ${curMode==='text'?'selected':''}>📝 普通文本</option>
      <option value="quadrant" ${curMode==='quadrant'?'selected':''}>🧭 四象限（轻重缓急）</option>
      <option value="checklist" ${curMode==='checklist'?'selected':''}>☑️ 清单（打勾）</option>
      <option value="numlist" ${curMode==='numlist'?'selected':''}>🔢 自动编号（按回车自动出下一条）</option>
    </select></div>`:'';
  return modeHtml+metaHtml+tagsHtml;
}
function openNoteBasicInfoModal(initType,onDone,confirmText,isNewNote){
  const draft=_noteDraft||{title:'',type:initType,fields:{},tags:[]};
  const body=`
    <div class="note-field-group"><div class="note-field-label">标题 <span style="color:var(--red)">*</span></div><input type="text" id="basic_note_title" class="note-input" placeholder="给这篇笔记起个名字" value="${esc(draft.title||'')}"></div>
    <div class="note-field-group"><div class="note-field-label">类型</div><select id="basic_note_type" class="note-select">${S.noteTypes.map(t=>`<option value="${esc(t)}" ${initType===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div id="basicDynamicFields">${renderBasicInfoFields(initType,draft,isNewNote)}</div>
    <div style="font-size:11px;color:var(--ink3);margin-top:8px;">📝 填好基本信息后，下一步专心写正文</div>`;
  showModal('📋 基本信息',body,()=>{
    const title=document.getElementById('basic_note_title').value.trim();if(!title){toast('请输入标题');return;}
    const newType=document.getElementById('basic_note_type').value;
    const fields={};getFieldsForType(newType).forEach(f=>{const el=document.getElementById(`basic_meta_${f.replace(/\s/g,'_').replace(/\//g,'_')}`);if(el)fields[f]=el.value;});
    const modeSel=document.getElementById('basic_note_mode');
    if(modeSel)fields['_mode']=modeSel.value;else if(!isNewNote&&draft.fields?.['_mode'])fields['_mode']=draft.fields['_mode'];
    let tags=[];if(newType.includes('素材')){const tagsStr=document.getElementById('basic_note_tags')?.value||'';tags=tagsStr.split(/[,，]/).map(t=>t.trim()).filter(t=>t);}
    _noteDraft={title,type:newType,fields,tags};
    closeModal();onDone();
  },null,{confirmText:confirmText||'下一步'});
  setTimeout(()=>{
    const typeSel=document.getElementById('basic_note_type');
    if(typeSel)typeSel.onchange=()=>{document.getElementById('basicDynamicFields').innerHTML=renderBasicInfoFields(typeSel.value,draft,isNewNote);};
    document.getElementById('basic_note_title')?.focus();
  },80);
}
function openNoteEditor(noteId=null){
  const note=noteId?S.notes.find(n=>n.id===noteId):null;const isEdit=!!note;
  const type=note?note.type:(currentNoteType==='all'||currentNoteType==='__manage'?(S.noteTypes[S.noteTypes.length-1]||'笔记'):currentNoteType);
  _currentEditingNoteId=noteId;
  const draft=S.noteEditDraft;
  const hasNewerDraft=!!(draft&&draft.noteId===(noteId||null)&&draft.ts&&draft.ts>(note?.updatedAt||0)&&draft.ts>Date.now()-24*60*60*1000&&draft.title);
  if(isEdit){
    if(hasNewerDraft){
      _noteDraft={title:draft.title,type:draft.type,fields:{...draft.fields},tags:[...(draft.tags||[])]};
      currentEditorImages=[...(draft.images||[])];
      currentEditorFiles=[...(draft.files||[])];
    }else{
      _noteDraft={title:note.title,type:note.type,fields:{...(note.fields||{})},tags:[...(note.tags||[])]};
      currentEditorImages=[...(note.images||[])];
      currentEditorFiles=[...(note.files||[])];
    }
    openNoteContentPage(noteId);
    if(hasNewerDraft)toast('已恢复上次未保存的内容 ✓');
  }else if(hasNewerDraft){
    _noteDraft={title:draft.title,type:draft.type,fields:{...draft.fields},tags:[...(draft.tags||[])]};
    currentEditorImages=[...(draft.images||[])];
    currentEditorFiles=[...(draft.files||[])];
    openNoteContentPage(null);
    toast('已恢复上次未保存的内容 ✓');
  }else{
    currentEditorImages=[];
    currentEditorFiles=[];
    _noteDraft=null;
    openNoteBasicInfoModal(type,()=>openNoteContentPage(null),null,true);
  }
}
const QUAD_LABELS={q1:'🔥 重要且紧急',q2:'🎯 重要不紧急',q3:'⏰ 紧急不重要',q4:'🌿 不重要不紧急'};
let _quadState=null,_checklistState=null;
function quadGridInnerHtml(){
  return `<div class="quad-grid">${Object.keys(QUAD_LABELS).map(k=>`
    <div class="quad-cell">
      <div class="quad-cell-title">${QUAD_LABELS[k]}</div>
      <div>${(_quadState[k]||[]).map((it,i)=>`
        <div class="quad-item ${it.done?'done':''}">
          <input type="checkbox" ${it.done?'checked':''} onchange="toggleQuadItem('${k}',${i})">
          <span class="qi-text">${esc(it.text)}</span>
          <span class="qi-del" onclick="delQuadItem('${k}',${i})">✕</span>
        </div>`).join('')}</div>
      <div class="quad-add-row"><input type="text" id="quadInput_${k}" placeholder="+ 添加"><button onclick="addQuadItem('${k}')">添加</button></div>
    </div>`).join('')}</div>`;
}
function bindQuadGridEvents(){
  Object.keys(QUAD_LABELS).forEach(k=>{
    const inp=document.getElementById('quadInput_'+k);
    if(inp)inp.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();addQuadItem(k);}};
  });
}
function renderQuadGrid(){
  const wrap=document.getElementById('quadGridWrap');if(!wrap)return;
  wrap.innerHTML=quadGridInnerHtml();
  bindQuadGridEvents();
}
function addQuadItem(k){const inp=document.getElementById('quadInput_'+k);const v=inp.value.trim();if(!v)return;if(!_quadState[k])_quadState[k]=[];_quadState[k].push({text:v,done:false});renderQuadGrid();persistNoteDraft();}
function toggleQuadItem(k,i){_quadState[k][i].done=!_quadState[k][i].done;renderQuadGrid();persistNoteDraft();}
function delQuadItem(k,i){_quadState[k].splice(i,1);renderQuadGrid();persistNoteDraft();}

function checklistInnerHtml(){
  return `<div>${_checklistState.map((it,i)=>`
      <div class="checklist-item ${it.done?'done':''}">
        <input type="checkbox" ${it.done?'checked':''} onchange="toggleChecklistItem(${i})">
        <span class="ci-text">${esc(it.text)}</span>
        <span class="ci-del" onclick="delChecklistItem(${i})">🗑️</span>
      </div>`).join('')}</div>
    <div class="checklist-add-row"><input type="text" id="checklistInput" placeholder="+ 添加一项，回车快速添加"><button onclick="addChecklistItem()">添加</button></div>`;
}
function bindChecklistEvents(){
  const inp=document.getElementById('checklistInput');
  if(inp)inp.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();addChecklistItem();}};
}
function renderChecklist(){
  const wrap=document.getElementById('checklistWrap');if(!wrap)return;
  wrap.innerHTML=checklistInnerHtml();
  bindChecklistEvents();
}
function addChecklistItem(){const inp=document.getElementById('checklistInput');const v=inp.value.trim();if(!v)return;_checklistState.push({text:v,done:false});renderChecklist();document.getElementById('checklistInput')?.focus();persistNoteDraft();}
function toggleChecklistItem(i){_checklistState[i].done=!_checklistState[i].done;renderChecklist();persistNoteDraft();}
function delChecklistItem(i){_checklistState.splice(i,1);renderChecklist();persistNoteDraft();}

const NUMLIST_STYLES={
  arabic:{label:'1. 2. 3.',fn:i=>(i+1)+'.'},
  circled:{label:'① ② ③',fn:i=>{const C=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];return i<20?C[i]:'('+(i+1)+')';}},
  bullet:{label:'• 圆点',fn:()=>'•'},
};
let _numlistState=null;
function numListInnerHtml(){
  const st=_numlistState;
  const styleBtns=Object.keys(NUMLIST_STYLES).map(k=>`<div class="numlist-style-opt${st.style===k?' on':''}" data-nstyle="${k}">${NUMLIST_STYLES[k].label}</div>`).join('');
  const rowsHtml=st.items.map((it,i)=>`
    <div class="numlist-row">
      <div class="numlist-marker">${NUMLIST_STYLES[st.style].fn(i)}</div>
      <textarea class="numlist-input" data-nidx="${i}" rows="1" placeholder="${i===0?'写下第一条，按回车换下一条…':''}">${esc(it.text)}</textarea>
      <div class="numlist-del" onclick="delNumListItem(${i})">✕</div>
    </div>`).join('');
  return `<div class="numlist-style-row">${styleBtns}</div><div id="numlistRows">${rowsHtml}</div>`;
}
function bindNumListEvents(){
  const wrap=document.getElementById('numlistWrap');if(!wrap)return;
  const st=_numlistState;
  wrap.querySelectorAll('[data-nstyle]').forEach(btn=>{btn.onclick=()=>{st.style=btn.dataset.nstyle;renderNumList();};});
  wrap.querySelectorAll('.numlist-input').forEach(ta=>{
    bindAutoGrow(ta);
    ta.oninput=()=>{st.items[parseInt(ta.dataset.nidx)].text=ta.value;autoGrow(ta);persistNoteDraftDebounced();};
    ta.onkeydown=(e)=>{
      // 正常打字换行（文字太长自动折行）不会走到这里；只有真正按下回车键才会触发——
      // 拦截默认的换行行为，改成"新增一条编号"
      if(e.key==='Enter'&&!e.shiftKey){
        e.preventDefault();
        const idx=parseInt(ta.dataset.nidx);
        st.items.splice(idx+1,0,{text:''});
        renderNumList();
        requestAnimationFrame(()=>{
          const rows=wrap.querySelectorAll('.numlist-input');
          if(rows[idx+1])rows[idx+1].focus();
        });
      }
    };
  });
}
function renderNumList(){
  const wrap=document.getElementById('numlistWrap');if(!wrap)return;
  wrap.innerHTML=numListInnerHtml();
  bindNumListEvents();
}
function delNumListItem(i){
  if(_numlistState.items.length<=1){_numlistState.items[0].text='';renderNumList();persistNoteDraft();return;}
  _numlistState.items.splice(i,1);renderNumList();persistNoteDraft();
}

function openNoteContentPage(noteId){
  const editorPage=document.getElementById('note-editor-page');
  const editorContainer=document.getElementById('editorContent');
  const isEdit=!!noteId;
  document.getElementById('editorTitle').innerText=isEdit?'编辑笔记':'新建笔记';
  const draft=_noteDraft;
  const mode=draft.fields?.['_mode']||'text';
  const bodyContent=draft.fields?.['我的笔记']??draft.fields?.['素材内容']??draft.fields?.['原文摘要']??'';

  let bodyAreaHtml;
  if(mode==='quadrant'){
    _quadState=draft.fields?.['_quadrant']?JSON.parse(JSON.stringify(draft.fields['_quadrant'])):{q1:[],q2:[],q3:[],q4:[]};
    bodyAreaHtml=`<div id="quadGridWrap">${quadGridInnerHtml()}</div>`;
  }else if(mode==='checklist'){
    _checklistState=draft.fields?.['_checklist']?JSON.parse(JSON.stringify(draft.fields['_checklist'])):[];
    bodyAreaHtml=`<div class="attachment-area" id="checklistWrap" style="border-style:solid;">${checklistInnerHtml()}</div>`;
  }else if(mode==='numlist'){
    _numlistState=draft.fields?.['_numlist']?JSON.parse(JSON.stringify(draft.fields['_numlist'])):{style:'arabic',items:[{text:''}]};
    bodyAreaHtml=`<div class="attachment-area" id="numlistWrap" style="border-style:solid;">${numListInnerHtml()}</div>`;
  }else{
    bodyAreaHtml=`<div class="notebook-wrap-grow">
      <div class="notebook-rings">${Array(12).fill('<div class="notebook-ring"></div>').join('')}</div>
      <div class="notebook-body"><textarea id="note_body" class="diary-style-textarea" placeholder="写下你的详细笔记、感悟或摘录…">${esc(bodyContent)}</textarea></div>
    </div>`;
  }

  editorContainer.innerHTML=`
    <div class="note-basic-summary">
      <div class="note-basic-summary-text" id="noteBasicSummaryText"><b>${esc(draft.title)}</b> · ${esc(draft.type)}</div>
      <button class="note-basic-edit-btn" id="editBasicInfoBtn">✏️ 修改</button>
    </div>
    ${bodyAreaHtml}
    <div class="attachment-area">
      <div class="note-field-label">📎 附件管理（持久化保存在本地）</div>
      <div class="attachment-buttons">
        <label class="attach-btn">📷 上传图片 <input type="file" accept="image/*" multiple id="note_img_input" style="display:none"></label>
        <label class="attach-btn" style="background:var(--bg);color:var(--ink2);">📄 上传文件 <input type="file" accept="*/*" multiple id="note_file_input" style="display:none"></label>
      </div>
      <div class="image-preview" id="editorImgPreview"></div>
      <div id="editorFilePreview"></div>
    </div>`;
  editorPage.classList.add('active');
  if(mode==='quadrant')bindQuadGridEvents();
  else if(mode==='checklist')bindChecklistEvents();
  else if(mode==='numlist')bindNumListEvents();
  else bindAutoGrow(document.getElementById('note_body'));
  if(mode==='text'||!mode)bindDraftAutosave(document.getElementById('note_body'),()=>persistNoteDraft());

  document.getElementById('note_img_input').onchange=(e)=>{
    Array.from(e.target.files).forEach(file=>{const r=new FileReader();r.onload=(ev)=>{currentEditorImages.push(ev.target.result);renderEditorAttachments();};r.readAsDataURL(file);});
  };
  document.getElementById('note_file_input').onchange=(e)=>{
    Array.from(e.target.files).forEach(file=>{const r=new FileReader();r.onload=(ev)=>{currentEditorFiles.push({name:file.name,data:ev.target.result});renderEditorAttachments();};r.readAsDataURL(file);});
  };
  renderEditorAttachments();

  document.getElementById('editBasicInfoBtn').onclick=()=>{
    openNoteBasicInfoModal(draft.type,()=>{
      document.getElementById('noteBasicSummaryText').innerHTML=`<b>${esc(_noteDraft.title)}</b> · ${esc(_noteDraft.type)}`;
    },'保存',false);
  };

  document.getElementById('editorCloseBtn').onclick=()=>{S.noteEditDraft=null;save();editorPage.classList.remove('active');renderNoteList();};

  document.getElementById('editorSaveBtn').onclick=()=>{
    const fields={...(_noteDraft.fields||{})};
    if(mode==='quadrant'){
      fields['_quadrant']=_quadState;
    }else if(mode==='checklist'){
      fields['_checklist']=_checklistState;
    }else if(mode==='numlist'){
      fields['_numlist']=_numlistState;
    }else{
      const bodyText=document.getElementById('note_body').value;
      fields['我的笔记']=bodyText;
      if(_noteDraft.type.includes('收藏'))fields['原文摘要']=fields['原文摘要']||'';
      if(_noteDraft.type.includes('素材'))fields['素材内容']=bodyText;
    }
    const{title,type,tags}=_noteDraft;
    if(isEdit){
      const idx=S.notes.findIndex(n=>n.id===noteId);
      if(idx!==-1)S.notes[idx]={...S.notes[idx],title,type,fields,tags,images:currentEditorImages,files:currentEditorFiles,updatedAt:Date.now()};
      toast('笔记已更新 ✓');
    }else{
      S.notes.push({id:uid(),title,type,fields,tags,images:currentEditorImages,files:currentEditorFiles,createdAt:Date.now(),updatedAt:Date.now()});
      toast('笔记已创建 ✓');
    }
    S.noteEditDraft=null;
    save();editorPage.classList.remove('active');renderNoteList();
  };
}

// ==================== 旧版迁移 ====================
function migrateOldData(){
  try{
    const raw=localStorage.getItem('myu6');if(!raw){toast('没有找到旧版数据');return;}
    const old=JSON.parse(raw);let count=0;
    if(Array.isArray(old.tasks))old.tasks.forEach(t=>{if(!S.tasks.find(x=>x.id===t.id)){S.tasks.push({id:t.id,date:t.date||td(),name:t.name||'',priority:'green',done:!!t.done});count++;}});
    if(Array.isArray(old.wishes))old.wishes.forEach(w=>{if(!S.wishes.find(x=>x.id===w.id)){S.wishes.push({id:w.id,t:w.t||'',date:w.date||''});count++;}});
    if(Array.isArray(old.diaries))old.diaries.forEach(d=>{if(!S.diaries.find(x=>x.id===d.id)){S.diaries.push({id:d.id,t:d.t||'',date:d.date||''});count++;}});
    if(Array.isArray(old.emotions))old.emotions.forEach(e=>{if(!S.emotions.find(x=>x.id===e.id)){S.emotions.push({id:e.id,t:e.t||'',date:e.date||''});count++;}});
    if(Array.isArray(old.goodH))old.goodH.forEach(h=>{if(!S.goodH.find(x=>x.id===h.id)){const r={};Object.keys(h.records||{}).forEach(dk=>{if(h.records[dk]==='on'){const day=parseInt((dk||'').split('-')[2]);if(day>=1&&day<=31)r[day]='on';}});S.goodH.push({id:h.id,name:h.name||'',emoji:h.emoji||'💪',records:r,notes:{}});count++;}});
    if(Array.isArray(old.projs))old.projs.forEach(p=>{if(!S.projs.find(x=>x.id===p.id)){S.projs.push({id:p.id,name:p.name||'',total:p.total||0,done:p.done||0,children:[],parentId:null,notes:[]});count++;}});
    if(Array.isArray(old.whois))old.whois.forEach(w=>{if(!S.whois.find(x=>x.id===w.id)){S.whois.push({id:w.id,t:w.t||'',date:w.date||''});count++;}});
    if(Array.isArray(old.selfNotes))old.selfNotes.forEach(n=>{if(!S.selfNotes.find(x=>x.id===n.id)){S.selfNotes.push({id:n.id,t:n.t||'',cat:n.cat||'其他',date:n.date||''});count++;}});
    if(Array.isArray(old.achievements))old.achievements.forEach(a=>{if(!S.achievements.find(x=>x.id===a.id)){S.achievements.push({id:a.id,title:a.title||'',type:a.type||'完成了',emoji:a.emoji||'🏆',note:a.note||'',date:a.date||''});count++;}});
    if(old.plans&&typeof old.plans==='object'){['day','week','month','year'].forEach(type=>{const txt=old.plans[type];if(txt&&typeof txt==='string'&&txt.trim()){if(!S.plans[type])S.plans[type]=[];txt.split('\n').filter(line=>line.trim()).forEach(line=>{S.plans[type].push({text:line.trim(),done:false});});count++;}});}
    if(Array.isArray(old.planArchives))old.planArchives.forEach(a=>{if(!S.planArchives.find(x=>x.id===a.id)){S.planArchives.push({id:a.id,type:a.type||'day',content:a.t||a.content||'',date:a.date||''});count++;}});
    if(old.quotes&&Array.isArray(old.quotes))old.quotes.forEach(q=>{if(!S.userQuotes.includes(q))S.userQuotes.push(q);});
    if(old.clarityQs&&Array.isArray(old.clarityQs))old.clarityQs.forEach(q=>{if(!S.userClarityQs.includes(q))S.userClarityQs.push(q);});
    save();toast(`迁移完成！共迁移 ${count} 条数据 ✅`);setTimeout(()=>location.reload(),1500);
  }catch(e){toast('迁移出错：'+e.message);}
}
