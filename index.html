<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的小宇宙">
<meta name="theme-color" content="#3d8b5e">
<title>我的小宇宙</title>
<style>
*:focus { outline: none !important; }
* { -webkit-tap-highlight-color: transparent; }
:root{
  --bg:#f0f4f1;--white:#ffffff;--card:#ffffff;--ink:#1e2d22;--ink2:#4a6350;--ink3:#8baa94;
  --g:#3d8b5e;--g-light:#e8f5ee;--g-mid:#b8ddc8;--g-dark:#2a6642;--sky:#5b9fb8;
  --red:#d96b55;--orange:#d4904a;--green:#3d8b5e;
  --shadow-sm:0 1px 4px rgba(30,45,34,.07);--shadow-md:0 4px 16px rgba(30,45,34,.10);
  --shadow-lg:0 8px 32px rgba(30,45,34,.13);--radius-sm:10px;--radius-md:16px;--radius-lg:22px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;max-width:500px;margin:0 auto;padding-bottom:84px;min-height:100vh;font-size:15px;line-height:1.55;}
.hdr{background:var(--white);padding:14px 18px 12px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(61,139,94,.08);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm);}
.hdr h1{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.3px;}
.hdr-date{font-size:11px;color:var(--ink3);margin-top:1px;}
.export-btn{background:var(--g-light);border:none;border-radius:20px;padding:5px 14px;font-size:12px;color:var(--g);cursor:pointer;font-weight:500;transition:background .15s;}
.export-btn:active{background:var(--g-mid);}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(61,139,94,.08);display:flex;z-index:200;padding:6px 0 max(12px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(30,45,34,.07);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 0;position:relative;transition:transform .12s;}
.ni:active{transform:scale(.92);}
.ni .ico{font-size:21px;transition:transform .15s;}
.ni .lbl{font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.2px;}
.ni.on .lbl{color:var(--g);font-weight:700;}
.ni.on .ico{transform:scale(1.15);}
.ni.on::after{content:'';position:absolute;bottom:-5px;left:28%;right:28%;height:2.5px;background:var(--g);border-radius:3px;}
.pg{display:none;padding:16px;}
.pg.active{display:block;}
.top-tabs{display:flex;justify-content:flex-start;gap:6px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid rgba(61,139,94,.10);overflow-x:auto;scrollbar-width:none;}
.top-tabs::-webkit-scrollbar{display:none;}
.tab-main{background:none;border:none;font-size:14px;font-family:inherit;cursor:pointer;padding:7px 14px;border-radius:30px;color:var(--ink3);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all .15s;font-weight:500;}
.tab-main.on{color:var(--g);font-weight:600;background:var(--g-light);}
.quote-box{background:linear-gradient(135deg,#fffef7 0%,#f9f5e8 100%);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-md);border:1px solid #ede8d4;position:relative;overflow:hidden;}
.quote-box::before{content:'"';position:absolute;top:-10px;left:10px;font-size:72px;color:rgba(180,160,100,.12);font-family:serif;line-height:1;pointer-events:none;}
.quote-txt{font-size:14px;color:#5a4a2a;line-height:1.7;font-style:italic;padding-right:40px;}
.quote-edit-btn{position:absolute;bottom:10px;right:12px;background:rgba(180,150,80,.12);border:none;border-radius:16px;padding:3px 11px;font-size:11px;color:#8a6d30;cursor:pointer;}
.ti{background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid rgba(61,139,94,.08);box-shadow:var(--shadow-sm);transition:opacity .2s,background .2s;}
.ti.done{opacity:.55;background:var(--g-light);}
.chk{width:24px;height:24px;border:2px solid var(--g-mid);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all .15s;}
.chk.on{background:var(--g);border-color:var(--g);color:#fff;}
.tn{flex:1;font-size:14px;font-weight:500;}
.priority-red{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;}
.priority-orange{width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;}
.priority-green{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.si{background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--g-mid);box-shadow:var(--shadow-sm);}
.si-text{font-size:14px;line-height:1.65;color:var(--ink);}
.si-date{font-size:10px;color:var(--ink3);margin-top:4px;letter-spacing:.3px;}
.si-acts{display:flex;gap:8px;margin-top:7px;}
.habit-card{background:var(--card);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid rgba(61,139,94,.08);}
.habit-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.habit-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.habit-day{width:34px;height:34px;border-radius:9px;background:var(--bg);border:1px solid rgba(61,139,94,.15);cursor:pointer;font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;color:var(--ink2);}
.habit-day.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 2px 6px rgba(61,139,94,.3);}
.project-card-root{background:var(--card);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;border-left:4px solid var(--g);box-shadow:var(--shadow-sm);}
.project-card-child{background:var(--g-light);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;margin-left:20px;border-left:2px solid var(--g-mid);}
.project-card-grandchild{background:rgba(61,139,94,.04);border-radius:8px;padding:8px 10px;margin-bottom:6px;margin-left:28px;border-left:1px dashed var(--g-mid);}
.progress-bar{height:5px;background:var(--g-light);border-radius:3px;margin:8px 0 4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--g),#5db87a);width:0%;border-radius:3px;transition:width .3s;}
.plan-tabs{display:flex;gap:0;justify-content:stretch;margin-bottom:18px;background:var(--g-light);border-radius:var(--radius-sm);padding:3px;}
.plan-tab{flex:1;background:none;border:none;font-size:13px;padding:8px 4px;color:var(--ink3);cursor:pointer;position:relative;font-weight:500;border-radius:8px;transition:all .15s;}
.plan-tab.on{color:var(--g-dark);font-weight:700;background:var(--white);box-shadow:var(--shadow-sm);}
.plan-add-btn{width:100%;padding:11px;margin-bottom:12px;background:transparent;border:1.5px dashed var(--g-mid);border-radius:var(--radius-sm);color:var(--g);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;}
.plan-add-btn:active{background:var(--g-light);}
.plan-check-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(61,139,94,.08);}
.plan-check{width:22px;height:22px;border:2px solid var(--g-mid);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--white);flex-shrink:0;transition:all .15s;}
.plan-check.done{background:var(--g);border-color:var(--g);color:#fff;}
.plan-text{flex:1;font-size:14px;word-break:break-all;}
.plan-text.done{text-decoration:line-through;color:var(--ink3);}
.plan-del{background:transparent;border:none;color:#c97c5a;font-size:16px;cursor:pointer;padding:4px;}
.plan-archive-item{background:var(--card);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:7px;cursor:pointer;border-left:2px solid var(--g-mid);box-shadow:var(--shadow-sm);}
.ach-header{text-align:center;padding:20px 16px 16px;background:linear-gradient(135deg,var(--g-light),var(--white));border-radius:var(--radius-md);margin-bottom:16px;box-shadow:var(--shadow-sm);}
.ach-icon{font-size:40px;}
.ach-slogan{font-size:14px;color:var(--g);font-weight:600;margin-top:6px;cursor:pointer;letter-spacing:.5px;}
.achi-card{background:linear-gradient(135deg,var(--white),var(--g-light));border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow-sm);}
.addbtn{width:100%;padding:10px;background:transparent;border:1.5px dashed var(--g-mid);border-radius:var(--radius-sm);color:var(--g);font-size:13px;cursor:pointer;transition:background .15s;}
.addbtn:active{background:var(--g-light);}
.pbtn{padding:8px 16px;background:var(--g);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-size:13px;transition:background .15s;box-shadow:0 2px 8px rgba(61,139,94,.25);}
.pbtn:active{background:var(--g-dark);}
.gbtn{background:transparent;border:1px solid rgba(61,139,94,.25);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer;font-size:12px;}
.sbtn{padding:4px 11px;background:var(--g-light);color:var(--g);border:none;border-radius:10px;font-size:11px;cursor:pointer;font-weight:500;}
.delbtn{background:transparent;border:none;color:#c97c5a;font-size:17px;cursor:pointer;padding:4px;}
.empty{text-align:center;padding:28px 12px;color:var(--ink3);font-size:13px;line-height:1.8;}
.empty::before{display:block;font-size:28px;margin-bottom:8px;content:attr(data-icon);}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(30,45,34,.88);color:#fff;padding:7px 20px;border-radius:40px;font-size:12px;opacity:0;transition:opacity .2s;z-index:500;white-space:nowrap;backdrop-filter:blur(8px);}
.toast.on{opacity:1;}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,30,22,.55);z-index:300;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:.2s;backdrop-filter:blur(4px);}
.modal-mask.on{visibility:visible;opacity:1;}
.modal-container{background:var(--white);border-radius:var(--radius-lg);width:88%;max-width:360px;padding:22px 20px 18px;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-title{font-weight:700;margin-bottom:14px;font-size:16px;color:var(--ink);letter-spacing:-.2px;}
.modal-buttons{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
.modal-buttons button{padding:9px 20px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;}
.modal-cancel{background:var(--bg);border:1px solid rgba(61,139,94,.15);color:var(--ink2);}
.modal-confirm{background:var(--g);border:none;color:#fff;box-shadow:0 2px 8px rgba(61,139,94,.25);}
.priority-selector{display:flex;gap:8px;margin-top:6px;}
.priority-option{flex:1;padding:9px 6px;border-radius:var(--radius-sm);border:2px solid transparent;cursor:pointer;text-align:center;font-size:12px;background:var(--bg);transition:all .15s;font-weight:500;}
.priority-option.selected{border-color:var(--g);background:var(--g-light);}
.priority-option.p-red.selected{border-color:var(--red);background:#fff3f1;}
.priority-option.p-orange.selected{border-color:var(--orange);background:#fff8f2;}
.priority-option.p-green.selected{border-color:var(--green);background:var(--g-light);}
input,textarea,select{background:var(--bg);border:1.5px solid rgba(61,139,94,.15);border-radius:var(--radius-sm);padding:10px 12px;width:100%;font-family:inherit;font-size:14px;color:var(--ink);transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--g);background:var(--white);}
.right-btn{display:flex;justify-content:flex-end;margin-top:8px;}
.task-section{margin-bottom:20px;}
.timer-section{margin-top:20px;}
.stl{font-weight:700;margin-bottom:10px;color:var(--ink2);font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
.fortune-trigger{background:linear-gradient(145deg,#1e1030,#120820);border-radius:var(--radius-md);padding:18px 16px;text-align:center;position:relative;margin:18px 0 4px;border:2px solid #e8c940;box-shadow:0 0 0 2px rgba(0,0,0,.2),0 0 0 3.5px #a07820,0 8px 24px rgba(0,0,0,.3),0 0 18px rgba(232,201,64,.4);}
.fortune-trigger-title{font-size:16px;font-weight:700;color:#e8c940;margin-bottom:12px;text-shadow:0 0 8px rgba(232,201,64,.5);letter-spacing:2px;}
.fortune-trigger-btn{background:linear-gradient(135deg,#e8c940,#f0a020);border:none;padding:9px 28px;border-radius:40px;font-size:13px;font-weight:700;color:#1e1030;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:transform .1s;}
.fortune-trigger-btn:active{transform:scale(.96);}
.fortune-edit-icon{position:absolute;top:-14px;right:-14px;background:var(--white);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);font-size:16px;z-index:10;border:1.5px solid #e8c940;}
.floating-card-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,5,20,.8);z-index:1000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity .3s;}
.floating-card-mask.active{visibility:visible;opacity:1;}
.floating-card{width:82%;max-width:360px;height:60%;max-height:460px;background:linear-gradient(145deg,#2a1a4a,#150a2a);border-radius:26px;border:2px solid #e8c940;box-shadow:0 0 0 3px rgba(0,0,0,.2),0 24px 48px rgba(0,0,0,.5),0 0 24px rgba(232,201,64,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;}
.floating-card.rotating{animation:card3DRotate 1.2s ease-in-out 2;}
@keyframes card3DRotate{0%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
.floating-card .card-back{font-size:52px;color:#e8c940;text-shadow:0 0 12px rgba(232,201,64,.6);}
.floating-card .card-front{font-size:18px;font-weight:500;color:#f5e8b0;line-height:1.7;word-break:break-word;}
.floating-card .card-front.hide,.floating-card .card-back.hide{display:none;}
#note-editor-page{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:400;overflow-y:auto;display:none;padding:16px;max-width:500px;margin:0 auto;}
#note-editor-page.active{display:block;}
.note-editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(61,139,94,.12);position:sticky;top:0;background:var(--bg);z-index:5;}
.note-editor-title{font-size:17px;font-weight:700;}
.note-editor-close,.note-editor-save{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
.note-editor-close{background:var(--g-light);color:var(--g);border:none;}
.note-editor-save{background:var(--g);color:white;border:none;margin-left:8px;box-shadow:0 2px 8px rgba(61,139,94,.25);}
.note-field-group{margin-bottom:14px;}
.note-field-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.3px;}
.note-input,.note-select{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid rgba(61,139,94,.15);border-radius:var(--radius-sm);font-size:14px;}
.note-textarea{width:100%;padding:12px;background:var(--white);border:1.5px solid rgba(61,139,94,.15);border-radius:var(--radius-md);font-size:14px;font-family:inherit;resize:vertical;min-height:280px;line-height:1.7;}
.attachment-area{background:var(--card);border-radius:var(--radius-md);padding:12px;margin-top:12px;}
.attachment-buttons{display:flex;gap:10px;margin-bottom:10px;}
.attach-btn{background:var(--g-light);border:none;padding:7px 16px;border-radius:24px;font-size:12px;cursor:pointer;color:var(--g);font-weight:500;}
.image-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.image-item{position:relative;width:68px;height:68px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg);}
.image-item img{width:100%;height:100%;object-fit:cover;}
.image-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;}
.file-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:6px;}
.file-name{font-size:12px;flex:1;}
.file-del{background:none;border:none;color:var(--red);cursor:pointer;}
.note-card{background:var(--card);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;border:1px solid rgba(61,139,94,.08);cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .1s;}
.note-card:active{transform:scale(.99);box-shadow:var(--shadow-md);}
.note-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.note-type-badge{background:var(--g-light);color:var(--g);font-size:10px;padding:2px 9px;border-radius:20px;margin-left:6px;font-weight:500;}
.note-tags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0;}
.note-tag{background:var(--g-light);padding:2px 9px;border-radius:16px;font-size:10px;color:var(--g);}
.note-preview{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.search-wrapper{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
.search-bar{flex:1;padding:10px 16px;background:var(--white);border:1.5px solid rgba(61,139,94,.12);border-radius:30px;font-size:14px;}
.search-btn{background:var(--g);border:none;border-radius:30px;padding:9px 16px;font-size:14px;cursor:pointer;color:white;}
.note-tab-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.note-tab-bar::-webkit-scrollbar{display:none;}
.note-tab-btn{padding:7px 16px;background:var(--bg);border:none;border-radius:30px;font-size:13px;color:var(--ink3);white-space:nowrap;cursor:pointer;font-weight:500;flex-shrink:0;transition:all .15s;}
.note-tab-btn.on{background:var(--g);color:white;box-shadow:0 2px 8px rgba(61,139,94,.3);}
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.list-count{font-size:12px;color:var(--ink3);}
.new-note-btn{background:var(--g);border:none;padding:7px 16px;border-radius:24px;font-size:12px;color:white;cursor:pointer;font-weight:500;}
.section-divider{display:flex;align-items:center;gap:10px;margin:20px 0 12px;}
.section-divider .stl{margin:0;}
.section-divider::after{content:'';flex:1;height:1px;background:rgba(61,139,94,.1);}
.timer-btns{display:flex;gap:10px;}
.timer-btn{flex:1;padding:12px 8px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s,box-shadow .1s;}
.timer-btn:active{transform:scale(.96);}
.timer-btn-1{background:var(--g);color:#fff;box-shadow:0 3px 10px rgba(61,139,94,.3);}
.timer-btn-3{background:var(--sky);color:#fff;box-shadow:0 3px 10px rgba(91,159,184,.3);}
.timer-btn-5{background:var(--g-dark);color:#fff;box-shadow:0 3px 10px rgba(42,102,66,.3);}

/* 安装引导横幅 */
.install-banner{background:linear-gradient(135deg,#e8f5ee,#d4eddf);border:1.5px solid var(--g-mid);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px;}
.install-banner-icon{font-size:28px;flex-shrink:0;}
.install-banner-text{flex:1;}
.install-banner-title{font-size:14px;font-weight:700;color:var(--g-dark);margin-bottom:4px;}
.install-banner-desc{font-size:12px;color:var(--ink2);line-height:1.6;}
.install-banner-close{background:none;border:none;color:var(--ink3);font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}

/* 备份提醒 */
.backup-reminder{background:linear-gradient(135deg,#fff8f0,#ffeedd);border:1.5px solid #f0c080;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.backup-reminder-text{flex:1;font-size:13px;color:#7a4a10;}
.backup-now-btn{background:#e8a030;border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap;}
</style>
</head>
<body>

<script>
// ==================== 数据存储 ====================
let collapsedProjs = new Set();
let S = {
  tasks:[],wishes:[],diaries:[],goodH:[],projs:[],
  whois:[],selfNotes:[],emotions:[],achievements:[],
  userQuotes:[],defaultQuotes:['这是我的课题，那是别人的课题。'],
  userClarityQs:[],defaultClarityQs:['这是我的课题，那是别人的课题。'],
  plans:{day:[],week:[],month:[],year:[]},
  planArchives:[],notes:[],fortuneMessages:[],
  lastBackupReminder: 0,
  installBannerDismissed: false
};
const ALL_EMOJIS=['💪','🏃','📚','🎨','✍️','🧘','💤','🥗','💧','🎯','🌸','🎵','🌿','🔥','💡','🌟','🍀','🦋','🌈','☀️','🌙','⭐','💎','📖','💃','✈️','👗','🍜','📱','💻','🎵','🏠','🧹','🍳','🎓','📝','🎬','🏊','🎨','🏸','☕','🎧','🏛️','👪','🛒','💰','⚽','🤖'];

function load(){
  try{let d=localStorage.getItem('myu_final_v10');if(d){let p=JSON.parse(d);Object.assign(S,p);}}catch(e){}
  if(!S.userQuotes)S.userQuotes=[];
  if(!S.userClarityQs)S.userClarityQs=[];
  if(!S.planArchives)S.planArchives=[];
  if(!S.notes)S.notes=[];
  if(!S.fortuneMessages)S.fortuneMessages=[];
  if(!S.tasks)S.tasks=[];
  if(!S.plans||typeof S.plans!=='object'||Array.isArray(S.plans)){
    S.plans={day:[],week:[],month:[],year:[]};
  }else{
    if(!Array.isArray(S.plans.day))S.plans.day=[];
    if(!Array.isArray(S.plans.week))S.plans.week=[];
    if(!Array.isArray(S.plans.month))S.plans.month=[];
    if(!Array.isArray(S.plans.year))S.plans.year=[];
  }
  if(!S.lastBackupReminder)S.lastBackupReminder=0;
  if(S.installBannerDismissed===undefined)S.installBannerDismissed=false;
}
function save(){localStorage.setItem('myu_final_v10',JSON.stringify(S));}
function uid(){return Date.now()+'-'+Math.random().toString(36).substr(2,6);}
function formatDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function td(){return formatDate(new Date());}
function nowStr(){let d=new Date();return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

// ==================== 安装引导（Android Chrome） ====================
function showInstallBanner(){
  if(S.installBannerDismissed)return;
  // 检测是否已经在独立模式（已安装）
  if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone)return;
  const banner=document.createElement('div');
  banner.className='install-banner';
  banner.id='installBanner';
  banner.innerHTML=`
    <div class="install-banner-icon">📲</div>
    <div class="install-banner-text">
      <div class="install-banner-title">添加到手机桌面，用起来更像APP！</div>
      <div class="install-banner-desc">Chrome浏览器：点右上角 ⋮ → <b>添加到主屏幕</b><br>数据保存在手机本地，离线也能用 ✅</div>
    </div>
    <button class="install-banner-close" onclick="dismissInstallBanner()">✕</button>`;
  const todayContent=document.getElementById('todayContent');
  if(todayContent)todayContent.insertBefore(banner,todayContent.firstChild);
}
function dismissInstallBanner(){
  S.installBannerDismissed=true;save();
  const b=document.getElementById('installBanner');if(b)b.remove();
}

// ==================== 自动备份提醒（每7天） ====================
function checkBackupReminder(){
  const now=Date.now();
  const sevenDays=7*24*60*60*1000;
  if(now-S.lastBackupReminder<sevenDays)return;
  // 有数据才提醒
  const hasData=S.tasks.length||S.wishes.length||S.diaries.length||S.notes.length||S.achievements.length;
  if(!hasData)return;
  const reminder=document.createElement('div');
  reminder.className='backup-reminder';
  reminder.id='backupReminder';
  reminder.innerHTML=`
    <span style="font-size:22px">💾</span>
    <span class="backup-reminder-text">距上次备份已超过7天，建议导出一份备份保存到手机相册或文件夹</span>
    <button class="backup-now-btn" onclick="quickBackup()">立即备份</button>`;
  const todayContent=document.getElementById('todayContent');
  if(todayContent)todayContent.insertBefore(reminder,todayContent.firstChild);
}
function quickBackup(){
  const a=document.createElement('a');
  const dateStr=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download=`我的小宇宙备份_${dateStr}.json`;
  a.click();
  S.lastBackupReminder=Date.now();save();
  const r=document.getElementById('backupReminder');if(r)r.remove();
  toast('备份已保存 ✓ 请存到手机文件夹');
}

// ==================== 弹窗系统 ====================
let modalStack=[];
function openModal(){document.getElementById('globalModal').classList.add('on');}
function closeModal(){
  modalStack.pop();
  if(modalStack.length>0){
    let prev=modalStack[modalStack.length-1];
    _renderModal(prev.title,prev.body,prev.onConfirm,prev.onCancel,prev.confirmText,prev.cancelText,prev.hideConfirm);
    openModal();
  }else{document.getElementById('globalModal').classList.remove('on');}
}
function _renderModal(title,body,onConfirm,onCancel,confirmText,cancelText,hideConfirm){
  document.getElementById('modalTitle').innerText=title;
  document.getElementById('modalBody').innerHTML=typeof body==='string'?body:'';
  if(typeof body==='function')body(document.getElementById('modalBody'));
  const btnsDiv=document.getElementById('modalButtons');btnsDiv.innerHTML='';
  const cancelBtn=document.createElement('button');
  cancelBtn.innerText=cancelText||'取消';cancelBtn.className='modal-cancel';
  cancelBtn.onclick=()=>{if(onCancel)onCancel();closeModal();};
  btnsDiv.appendChild(cancelBtn);
  if(!hideConfirm){
    const confirmBtn=document.createElement('button');
    confirmBtn.innerText=confirmText||'确认';confirmBtn.className='modal-confirm';
    confirmBtn.onclick=()=>{if(onConfirm)onConfirm();};
    btnsDiv.appendChild(confirmBtn);
  }
}
function showModal(title,body,onConfirm,onCancel,opts={}){
  const config={title,body,onConfirm,onCancel,confirmText:opts.confirmText,cancelText:opts.cancelText,hideConfirm:opts.hideConfirm};
  modalStack.push(config);
  _renderModal(title,body,onConfirm,onCancel,opts.confirmText,opts.cancelText,opts.hideConfirm);
  openModal();
}
function prompt1(title,placeholder,defaultVal,callback){
  const body=`<input type="text" id="p1input" placeholder="${esc(placeholder)}" value="${esc(defaultVal||'')}" style="width:100%">`;
  showModal(title,body,()=>{
    const val=document.getElementById('p1input').value.trim();
    if(val){closeModal();callback(val);}else toast('内容不能为空');
  });
  setTimeout(()=>{const el=document.getElementById('p1input');if(el){el.focus();el.select();}},100);
}
function confirmDel(callback){
  showModal('确认删除','<p style="color:var(--ink2);font-size:14px;line-height:1.6">确定要删除吗？此操作不可撤销。</p>',
    ()=>{closeModal();callback();});
}
document.getElementById('globalModal').onclick=(e)=>{if(e.target===document.getElementById('globalModal'))closeModal();};

// ==================== 修复计划数据 ====================
function fixPlansData(){
  try{
    let raw=localStorage.getItem('myu_final_v10');let d=raw?JSON.parse(raw):{};
    if(!d.plans||typeof d.plans!=='object'||Array.isArray(d.plans)){d.plans={day:[],week:[],month:[],year:[]};}
    else{['day','week','month','year'].forEach(k=>{if(!Array.isArray(d.plans[k]))d.plans[k]=[];});}
    localStorage.setItem('myu_final_v10',JSON.stringify(d));Object.assign(S,d);
    closeModal();toast('修复完成！正在刷新…');setTimeout(()=>location.reload(),1500);
  }catch(e){toast('修复失败：'+e.message);}
}

// ==================== 备份 ====================
document.getElementById('exportBtn').onclick=()=>{
  const oldExists=!!localStorage.getItem('myu6');
  const body=`<div style="display:flex;flex-direction:column;gap:12px;">
    <button class="pbtn" id="exportDataBtn">📤 导出备份（保存到手机）</button>
    <label class="pbtn" style="text-align:center;cursor:pointer;">📥 导入备份<input type="file" accept=".json" style="display:none" id="importFileInput"></label>
    <button class="pbtn" style="background:#9b87d4;" id="fixPlansBtn">🔧 修复计划无法添加</button>
    ${oldExists?`<button class="pbtn" style="background:var(--sky);" id="migrateOldBtn">🔄 读取旧版数据</button>`:''}
    <div style="background:var(--g-light);border-radius:10px;padding:12px;font-size:12px;color:var(--ink2);line-height:1.8">
      💡 <b>防数据丢失小贴士</b><br>
      • 定期点"导出备份"存到手机<br>
      • 用Chrome浏览器打开此文件<br>
      • 点右上角⋮→"添加到主屏幕"变成APP<br>
      • 数据存在手机本地，不依赖网络
    </div>
  </div>`;
  showModal('备份与恢复',body,null,null,{hideConfirm:true,cancelText:'关闭'});
  setTimeout(()=>{
    const fixBtn=document.getElementById('fixPlansBtn');if(fixBtn)fixBtn.onclick=()=>fixPlansData();
    const migrateBtn=document.getElementById('migrateOldBtn');
    if(migrateBtn)migrateBtn.onclick=()=>{if(confirm('将把旧版数据迁移到新版？')){migrateOldData();closeModal();}};
    const expBtn=document.getElementById('exportDataBtn');
    if(expBtn)expBtn.onclick=()=>{
      const dateStr=new Date().toISOString().slice(0,10);
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
      a.download=`我的小宇宙备份_${dateStr}.json`;a.click();
      S.lastBackupReminder=Date.now();save();
      toast('已导出，请保存到手机文件夹');closeModal();
    };
    const importInput=document.getElementById('importFileInput');
    if(importInput)importInput.onchange=(e)=>{
      const file=e.target.files[0];if(!file)return;
      const r=new FileReader();
      r.onload=ev=>{
        try{
          const d=JSON.parse(ev.target.result);
          if(confirm('导入会覆盖当前数据，确定吗？')){Object.assign(S,d);save();toast('导入成功');location.reload();}
        }catch(err){toast('文件错误');}
      };
      r.readAsText(file);importInput.value='';closeModal();
    };
  },50);
};

// ==================== 页面切换 ====================
const _pageInited={};
function switchPage(pageId){
  document.querySelectorAll('.pg').forEach(pg=>pg.classList.remove('active'));
  document.getElementById('pg-'+pageId).classList.add('active');
  document.querySelectorAll('.ni').forEach(nav=>{nav.classList.toggle('on',nav.dataset.page===pageId);});
  if(!_pageInited[pageId]){
    _pageInited[pageId]=true;
    if(pageId==='grow')renderGrow();
    if(pageId==='record')renderRecord();
    if(pageId==='plan')renderPlan();
    if(pageId==='note')renderNoteList();
  }
}
document.querySelectorAll('.ni').forEach(nav=>{nav.onclick=()=>switchPage(nav.dataset.page);});

// ==================== 今日页面 ====================
let quoteRotateInterval=null;
function getDisplayQuotes(){return[...S.defaultQuotes,...S.userQuotes];}
function startQuoteRotate(){
  if(quoteRotateInterval)clearInterval(quoteRotateInterval);
  quoteRotateInterval=setInterval(()=>{
    const qs=getDisplayQuotes();
    if(qs.length>=2){const idx=Math.floor(Date.now()/1800000)%qs.length;const q=document.getElementById('quoteEl');if(q)q.innerHTML=`"${esc(qs[idx])}"` ;}
  },30000);
}

function editFortuneMessages(){
  const body=(container)=>{
    const renderList=()=>{
      let html=`<div style="margin-bottom:12px;"><div style="font-size:12px;color:var(--ink3);margin-bottom:10px;">每条卡牌内容</div><div id="fortuneList">`;
      (S.fortuneMessages||[]).forEach((msg,idx)=>{html+=`<div style="display:flex;gap:8px;margin-bottom:8px;"><input type="text" style="flex:1;padding:8px;" value="${esc(msg)}" data-idx="${idx}" class="fortune-edit-input"><button class="delbtn" data-idx="${idx}">🗑️</button></div>`;});
      html+=`</div><button class="addbtn" id="addFortuneBtn">+ 添加新卡牌</button></div>`;
      container.innerHTML=html;
      container.querySelectorAll('.delbtn').forEach(btn=>{btn.onclick=()=>{S.fortuneMessages.splice(parseInt(btn.dataset.idx),1);save();renderList();};});
      container.querySelectorAll('.fortune-edit-input').forEach(inp=>{inp.onchange=()=>{S.fortuneMessages[parseInt(inp.dataset.idx)]=inp.value;save();};});
      container.querySelector('#addFortuneBtn').onclick=()=>{S.fortuneMessages.push('新的天意任务');save();renderList();};
    };
    renderList();
  };
  showModal('✨ 编辑天意卡牌内容',body,null,null,{hideConfirm:true,cancelText:'关闭'});
}

function drawFortuneCard(){
  const messages=S.fortuneMessages||[];
  if(messages.length===0){toast('请先编辑天意卡牌内容 ✨');return;}
  const randomMsg=messages[Math.floor(Math.random()*messages.length)];
  const mask=document.getElementById('floatingCardMask');
  const card=document.getElementById('floatingCard');
  const backDiv=card.querySelector('.card-back');
  const frontDiv=card.querySelector('.card-front');
  frontDiv.innerHTML=`✨ ${esc(randomMsg)} ✨`;
  frontDiv.classList.add('hide');backDiv.classList.remove('hide');
  card.classList.remove('rotating');mask.classList.add('active');
  setTimeout(()=>{card.classList.add('rotating');},10);
  const timer=setTimeout(()=>{card.classList.remove('rotating');backDiv.classList.add('hide');frontDiv.classList.remove('hide');},1200);
  const closeHandler=()=>{clearTimeout(timer);mask.classList.remove('active');card.classList.remove('rotating');backDiv.classList.remove('hide');frontDiv.classList.add('hide');mask.removeEventListener('click',closeHandler);};
  mask.addEventListener('click',closeHandler);
}

function renderToday(){
  const displayQuote=getDisplayQuotes().length?getDisplayQuotes()[0]:'这是我的课题，那是别人的课题。';
  document.getElementById('todayContent').innerHTML=`
    <div class="quote-box">
      <div class="quote-txt" id="quoteEl">"${esc(displayQuote)}"</div>
      <button class="quote-edit-btn" onclick="openQuoteModal()">编辑</button>
    </div>
    <div class="task-section">
      <div class="section-divider"><div class="stl">📋 今日任务</div></div>
      <div id="taskList"></div>
      <button class="addbtn" id="addTaskBtn">+ 添加任务（最多3件）</button>
    </div>
    <div class="timer-section">
      <div class="section-divider"><div class="stl">🚀 专注启动</div></div>
      <div class="timer-btns">
        <button class="timer-btn timer-btn-1" onclick="selectTaskForTimer(60)">1 分钟</button>
        <button class="timer-btn timer-btn-3" onclick="selectTaskForTimer(180)">3 分钟</button>
        <button class="timer-btn timer-btn-5" onclick="selectTaskForTimer(300)">5 分钟</button>
      </div>
    </div>
    <div style="position:relative;margin-top:4px;">
      <div class="fortune-trigger">
        <div class="fortune-trigger-title">✨ 天意卡牌 ✨</div>
        <button class="fortune-trigger-btn" onclick="drawFortuneCard()">点击抽卡</button>
        <div class="fortune-edit-icon" onclick="editFortuneMessages()">✏️</div>
      </div>
    </div>`;
  document.getElementById('addTaskBtn').onclick=openAddTaskModal;
  renderTasks();
  if(getDisplayQuotes().length>=2)startQuoteRotate();
  // 显示安装引导和备份提醒
  setTimeout(()=>{showInstallBanner();checkBackupReminder();},300);
}

function openQuoteModal(){
  const renderQuoteBody=(container)=>{
    container.innerHTML=`
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <input type="text" id="newQuoteInput" placeholder="输入新语录" style="flex:1">
        <button class="pbtn" id="addQuoteBtn">添加</button>
      </div>
      <div style="font-size:10px;color:var(--ink3);margin-bottom:10px;">✨ 至少2条语录会自动切换</div>
      <div style="max-height:220px;overflow:auto" id="quoteListInner"></div>`;
    const listInner=container.querySelector('#quoteListInner');
    let html='';
    S.userQuotes.forEach((q,i)=>{html+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(61,139,94,.1);"><span style="font-size:13px">${esc(q)}</span><button class="delbtn" data-qi="${i}">🗑️</button></div>`;});
    if(S.defaultQuotes.length){html+=`<div style="padding:8px 0 4px;font-size:11px;color:var(--ink3);font-weight:600;">📌 默认语录</div>`;S.defaultQuotes.forEach(q=>{html+=`<div style="padding:6px 0;font-size:13px;color:var(--ink3);">${esc(q)}</div>`;});}
    listInner.innerHTML=html;
    listInner.querySelectorAll('[data-qi]').forEach(btn=>{btn.onclick=()=>{const i=parseInt(btn.dataset.qi);confirmDel(()=>{S.userQuotes.splice(i,1);save();if(getDisplayQuotes().length<2)clearInterval(quoteRotateInterval);openQuoteModal();});};});
    container.querySelector('#addQuoteBtn').onclick=()=>{const txt=container.querySelector('#newQuoteInput').value.trim();if(txt){S.userQuotes.push(txt);save();toast('已添加');if(getDisplayQuotes().length>=2)startQuoteRotate();openQuoteModal();}};
  };
  showModal('📝 自定义语录',renderQuoteBody,null,null,{hideConfirm:true,cancelText:'关闭'});
}

function renderTasks(){
  const today=td();const tasks=S.tasks.filter(t=>t.date===today);
  const container=document.getElementById('taskList');
  if(!tasks.length){container.innerHTML='<div class="empty" data-icon="✅">今天还没有任务<br>点击下方添加</div>';return;}
  container.innerHTML=tasks.map(t=>`
    <div class="ti ${t.done?'done':''}">
      <div class="chk ${t.done?'on':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</div>
      <div style="flex:1">
        <div class="tn" style="${t.done?'text-decoration:line-through':''}">${esc(t.name)}</div>
        ${t.taskType||t.note?`<div style="font-size:11px;color:var(--ink3);margin-top:2px">${t.taskType?`<span style="background:var(--g-light);color:var(--g);padding:1px 8px;border-radius:10px;margin-right:5px;font-weight:500">${t.taskType}</span>`:''}${t.note?esc(t.note):''}</div>`:''}
      </div>
      <div class="priority-${t.priority||'green'}"></div>
      <button class="sbtn" onclick="editTask('${t.id}')">编辑</button>
      <button class="delbtn" onclick="delTaskConfirm('${t.id}')">🗑️</button>
    </div>`).join('');
}

function toggleTask(id){const t=S.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();renderTasks();}}
function delTaskConfirm(id){confirmDel(()=>{S.tasks=S.tasks.filter(t=>t.id!==id);save();renderTasks();});}
function editTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const TASK_TYPES=['📚 学习','💼 工作','🎨 爱好','🏠 家务','💬 交际','💭 其他'];
  const body=(container)=>{
    container.innerHTML=`
      <div class="note-field-group"><div class="note-field-label">任务名称</div><input id="editTaskName" value="${esc(t.name)}"></div>
      <div class="note-field-group"><div class="note-field-label">类型</div><div style="display:flex;flex-wrap:wrap;gap:6px" id="editTaskTypeSelector">${TASK_TYPES.map(tp=>`<div class="sbtn edit-task-type-opt${t.taskType===tp?' selected':''}" data-type="${tp}" style="${t.taskType===tp?'background:var(--g);color:#fff':''}">${tp}</div>`).join('')}</div></div>

function selectTaskForTimer(secs){
  const tasks=S.tasks.filter(t=>t.date===td()&&!t.done);
  if(!tasks.length){toast('没有未完成任务');return;}
  const body=`<select id="timerTaskSelect">${tasks.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>`;
  showModal('选择要专注的任务',body,()=>{
    const tid=document.getElementById('timerTaskSelect').value;
    const task=tasks.find(t=>t.id===tid);closeModal();if(task)startTimer(secs,task.name);
  });
}

let timerInt=null;
function startTimer(secs,taskName){
  if(timerInt)clearInterval(timerInt);
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:linear-gradient(135deg,#f0f8f3,#e8f5ee);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;';
  let s=secs;
  const fmt=()=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  ov.innerHTML=`<div style="font-size:26px;">🍃 专注中</div><div style="font-size:16px;color:var(--ink2);font-weight:500;">${esc(taskName)}</div><div style="font-size:88px;font-weight:800;color:var(--g);letter-spacing:-4px;" id="timerDisp">${fmt()}</div><button class="pbtn" style="background:var(--red);" onclick="this.parentElement.remove();clearInterval(timerInt);">停止</button>`;
  document.body.appendChild(ov);
  timerInt=setInterval(()=>{s--;const d=document.getElementById('timerDisp');if(d)d.innerText=fmt();if(s<=0){clearInterval(timerInt);ov.remove();toast('时间到！');}},1000);
}

function renderPlanEditor(type){
  const el=document.getElementById('planEditor');
  el.innerHTML=`<button class="plan-add-btn" id="planAddBtn">+ 添加计划项</button><div id="planItemsList"></div>`;
  document.getElementById('planAddBtn').onclick=()=>addPlanItem(type);
  renderPlanItems(type);
}
function renderPlanItems(type){
  const items=S.plans[type]||[];const container=document.getElementById('planItemsList');if(!container)return;
  if(!items.length){container.innerHTML='<div class="empty" data-icon="🗓">暂无计划项</div>';return;}
  container.innerHTML=items.map((item,idx)=>`
    <div class="plan-check-item">
      <div class="plan-check ${item.done?'done':''}" onclick="togglePlanItem('${type}',${idx})">${item.done?'✓':''}</div>
      <span class="plan-text ${item.done?'done':''}">${esc(item.text)}</span>
      <button class="sbtn" onclick="moveToToday('${type}',${idx})" style="background:var(--sky);color:#fff;margin-right:6px">🌤 移至今日</button>
      <button class="plan-del" onclick="deletePlanItem('${type}',${idx})">🗑️</button>
    </div>`).join('');
}
function moveToToday(type,idx){
  const todayCount=S.tasks.filter(t=>t.date===td()&&!t.done).length;
  if(todayCount>=3){toast('今日页面最多允许3件未完成任务');return;}
  const item=S.plans[type][idx];if(!item)return;
  const typeNames={day:'日',week:'周',month:'月',year:'年'};
  S.tasks.push({id:uid(),date:td(),name:item.text,taskType:'💭 其他',priority:'orange',note:`💡 从${typeNames[type]}计划导入`,done:false});
  S.plans[type].splice(idx,1);save();renderPlanItems(type);renderTasks();toast('已移入"今日"页面 🌤');
}
function togglePlanItem(type,idx){
  const item=S.plans[type][idx];
  if(!item.done){item.done=true;S.planArchives.unshift({id:uid(),type,content:item.text,date:nowStr()});S.plans[type].splice(idx,1);save();renderPlanItems(type);renderPlanArchive();toast('已存档 ✓');}
}
function deletePlanItem(type,idx){confirmDel(()=>{S.plans[type].splice(idx,1);save();renderPlanItems(type);});}
function addPlanItem(type){
  if(!S.plans[type]||!Array.isArray(S.plans[type]))S.plans[type]=[];
  prompt1('添加计划项','输入计划内容','',(text)=>{S.plans[type].push({text,done:false});save();renderPlanItems(type);toast('已添加 ✓');});
}
function renderPlanArchive(){
  const el=document.getElementById('planArchive');if(!el)return;
  const archives=S.planArchives.slice(0,12);
  if(!archives.length){el.innerHTML='<div class="empty" data-icon="📁">暂无存档</div>';return;}
  el.innerHTML=archives.map(a=>`<div class="plan-archive-item"><div style="font-size:10px;color:var(--ink3);margin-bottom:2px">${a.date} · ${a.type}</div><div style="font-size:13px">${esc((a.content||'').length>40?(a.content||'').substring(0,40)+'…':(a.content||''))}</div></div>`).join('');
}

function toggleProjCollapse(id){if(collapsedProjs.has(id)){collapsedProjs.delete(id);}else{collapsedProjs.add(id);}renderProjTree();}
function renderProjTree(){
  const listDiv=document.getElementById('projTree');if(!listDiv)return;
  if(!S.projs.length){listDiv.innerHTML='<div class="empty" data-icon="📂">还没有项目</div>';return;}
  function renderNode(p,level){
    const percent=p.total?Math.min(100,Math.round(p.done/p.total*100)):0;
    const cardClass=level===0?'project-card-root':(level===1?'project-card-child':'project-card-grandchild');
    const hasChildren=p.children&&p.children.length>0;const isCollapsed=collapsedProjs.has(p.id);
    const toggleIcon=hasChildren?(isCollapsed?'▶':'▼'):'';
    return`<div class="${cardClass}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">${hasChildren?`<span onclick="toggleProjCollapse('${p.id}')" style="font-size:11px;color:var(--ink3);cursor:pointer;width:16px;flex-shrink:0;user-select:none">${toggleIcon}</span>`:'<span style="width:16px;flex-shrink:0"></span>'}<span style="flex:1;font-weight:${level===0?'700':'500'};font-size:${level===0?'15px':'14px'};cursor:${hasChildren?'pointer':'default'}" onclick="${hasChildren?`toggleProjCollapse('${p.id}')`:''}">${level===0?'📁 ':''}${esc(p.name)} <span style="font-size:12px;color:var(--ink3)">(${p.done}/${p.total||'∞'})</span></span><button class="sbtn" onclick="editProjItem('${p.id}')">✏️</button><button class="delbtn" onclick="delProjConfirm('${p.id}')">🗑️</button></div>${p.total?`<div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div><div style="font-size:11px;color:var(--ink3)">完成 ${percent}%</div>`:''}<div style="display:flex;gap:8px;margin:8px 0"><button class="sbtn" onclick="checkInProj('${p.id}')">✅ 打卡</button><button class="sbtn" onclick="openSubProj('${p.id}')">➕ 子项目</button></div>${!isCollapsed&&hasChildren?`<div>${p.children.map(c=>renderNode(c,level+1)).join('')}</div>`:(hasChildren?`<div style="font-size:11px;color:var(--ink3);padding:4px 0 2px">▶ ${p.children.length} 个子项目（已折叠）</div>`:'')}  </div>`;
  }
  listDiv.innerHTML=S.projs.map(p=>renderNode(p,0)).join('');
}
function openRootProj(){
  const body=(container)=>{container.innerHTML=`<div class="note-field-group"><div class="note-field-label">项目名称</div><input id="projName" placeholder="例如：学习Python"></div><div class="note-field-group"><div class="note-field-label">总目标数量</div><input id="projTotal" type="number" min="0" placeholder="例如：100"></div>`;};
  showModal('创建项目',body,()=>{
    const name=document.getElementById('projName').value.trim();if(!name){toast('请输入项目名称');return;}
    const total=parseInt(document.getElementById('projTotal').value)||0;
    S.projs.push({id:uid(),name,total,done:0,children:[],parentId:null,notes:[]});
    save();closeModal();renderProjects();toast('项目已创建 ✓');
  });
  setTimeout(()=>{const el=document.getElementById('projName');if(el)el.focus();},100);
}
function openSubProj(parentId){
  const body=(container)=>{container.innerHTML=`<div class="note-field-group"><div class="note-field-label">子项目名称</div><input id="subProjName" placeholder="例如：第1章"></div><div class="note-field-group"><div class="note-field-label">目标数量</div><input id="subProjTotal" type="number" min="1" value="1"></div>`;};
  showModal('添加子项目',body,()=>{
    const name=document.getElementById('subProjName').value.trim();if(!name){toast('请输入名称');return;}
    const total=parseInt(document.getElementById('subProjTotal').value)||1;
    const parent=findProj(parentId,S.projs);
    if(parent){if(!parent.children)parent.children=[];parent.children.push({id:uid(),name,total,done:0,children:[],parentId,notes:[]});save();closeModal();renderProjects();toast('子项目已添加 ✓');}
  });
  setTimeout(()=>{const el=document.getElementById('subProjName');if(el)el.focus();},100);
}
function findProj(id,list){for(const p of list){if(p.id===id)return p;if(p.children){const found=findProj(id,p.children);if(found)return found;}}return null;}
function checkInProj(id){
  const proj=findProj(id,S.projs);if(!proj)return;
  if(proj.total>0&&proj.done>=proj.total){toast('已完成全部目标！');return;}
  showModal('打卡记录',`<textarea id="projNoteTA" rows="3" placeholder="记录本次打卡内容（可选）"></textarea>`,
    ()=>{const note=document.getElementById('projNoteTA').value.trim();proj.done++;if(!proj.notes)proj.notes=[];proj.notes.push({date:nowStr(),note:note||'打卡'});updateParentProgress(proj.parentId);save();closeModal();renderProjects();toast(`+1 ${proj.name}`);},null,{confirmText:'打卡',cancelText:'取消'});
}
function updateParentProgress(parentId){
  if(!parentId)return;const parent=findProj(parentId,S.projs);
  if(parent&&parent.children){const totalDone=parent.children.reduce((s,c)=>s+c.done,0);const totalTarget=parent.children.reduce((s,c)=>s+(c.total||0),0);if(totalTarget>0)parent.done=Math.min(parent.total||totalTarget,totalDone);else parent.done=totalDone;updateParentProgress(parent.parentId);}
}
function editProjItem(id){const p=findProj(id,S.projs);if(!p)return;showModal('编辑项目',`<div class="note-field-group"><div class="note-field-label">项目名称</div><input id="editProjName" value="${esc(p.name)}"></div>`,()=>{const name=document.getElementById('editProjName').value.trim();if(name){p.name=name;save();closeModal();renderProjects();}});}
function delProjConfirm(id){confirmDel(()=>{function remove(list){for(let i=0;i<list.length;i++){if(list[i].id===id){list.splice(i,1);return true;}if(list[i].children&&remove(list[i].children))return true;}return false;}remove(S.projs);save();renderProjects();});}

// ==================== 笔记板块 ====================
const NOTE_TYPES=[{id:'all',name:'📋 全部'},{id:'collect',name:'📌 收藏'},{id:'media',name:'🎬 书影'},{id:'novel',name:'✍️ 素材'},{id:'general',name:'📝 通用'}];
let currentNoteType='all',noteSearchKeyword='';
function scrollNoteTabIntoCenter(activeBtn,tabBar){if(!activeBtn||!tabBar)return;const targetLeft=activeBtn.offsetLeft-(tabBar.clientWidth/2)+(activeBtn.offsetWidth/2);tabBar.scrollTo({left:Math.max(0,targetLeft),behavior:'smooth'});}
function renderNoteList(){
  const container=document.getElementById('noteListPage');if(!container)return;
  let filtered=S.notes.filter(n=>currentNoteType==='all'?true:n.type===currentNoteType);
  if(noteSearchKeyword){filtered=filtered.filter(n=>(n.title||'').toLowerCase().includes(noteSearchKeyword)||(n.fields&&Object.values(n.fields).some(v=>(v||'').toLowerCase().includes(noteSearchKeyword))));}
  filtered.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  container.innerHTML=`<div class="search-wrapper"><input id="noteSearch" class="search-bar" placeholder="搜索笔记…" value="${esc(noteSearchKeyword)}"><button class="search-btn" id="searchBtn">🔍</button></div><div class="note-tab-bar" id="noteTabBar">${NOTE_TYPES.map(t=>`<button class="note-tab-btn ${currentNoteType===t.id?'on':''}" data-type="${t.id}">${t.name}</button>`).join('')}</div><div class="list-header"><span class="list-count">${filtered.length} 条笔记</span><button class="new-note-btn" id="newNoteBtn">+ 新建</button></div><div id="noteItemsList"></div>`;
  const tabBar=document.getElementById('noteTabBar');
  document.getElementById('searchBtn').onclick=()=>{noteSearchKeyword=document.getElementById('noteSearch').value.toLowerCase();renderNoteList();};
  document.getElementById('noteSearch').onkeypress=e=>{if(e.key==='Enter'){noteSearchKeyword=e.target.value.toLowerCase();renderNoteList();}};
  document.querySelectorAll('.note-tab-btn').forEach(btn=>{btn.onclick=()=>{currentNoteType=btn.dataset.type;renderNoteList();setTimeout(()=>{const activeBtn=document.querySelector('.note-tab-btn.on');const bar=document.getElementById('noteTabBar');scrollNoteTabIntoCenter(activeBtn,bar);},30);};});
  setTimeout(()=>{const activeBtn=tabBar.querySelector('.note-tab-btn.on');scrollNoteTabIntoCenter(activeBtn,tabBar);},60);

  document.querySelectorAll('.note-card').forEach(c=>{c.onclick=(e)=>{if(!e.target.classList.contains('note-del-btn'))openNoteEditor(c.dataset.id);};});

function openNoteEditor(noteId=null){
  const note=noteId?S.notes.find(n=>n.id===noteId):null;const isEdit=!!note;
  let type=note?note.type:(currentNoteType==='all'?'general':currentNoteType);
  const editorPage=document.getElementById('note-editor-page');
  const editorContainer=document.getElementById('editorContent');
  document.getElementById('editorTitle').innerText=isEdit?'编辑笔记':'新建笔记';
  const fieldsMap={collect:['来源链接','原文摘要'],media:['名称','作者/导演'],novel:['素材内容'],general:['标题']};
  const buildEditorHTML=(currentType,currentNote)=>{
    const metaFields=fieldsMap[currentType]||[];
    let metaHtml=metaFields.map(f=>`<div class="note-field-group"><div class="note-field-label">${f}</div><input type="text" id="meta_${f.replace(/\s/g,'_').replace(/\//g,'_')}" class="note-input" value="${esc(currentNote?.fields?.[f]||'')}"></div>`).join('');
    let tagsHtml='';
    if(currentType==='novel'){tagsHtml=`<div class="note-field-group"><div class="note-field-label">自定义标签（逗号分隔）</div><input type="text" id="note_tags" class="note-input" value="${esc((currentNote?.tags||[]).join(', '))}"></div>`;}
    const bodyContent=currentNote?.fields?.['我的笔记']||currentNote?.fields?.['素材内容']||currentNote?.fields?.['原文摘要']||'';
    return`<div class="note-field-group"><div class="note-field-label">标题 <span style="color:var(--red)">*</span></div><input type="text" id="note_title" class="note-input" placeholder="给这篇笔记起个名字" value="${esc(currentNote?.title||'')}"></div><div class="note-field-group"><div class="note-field-label">类型</div><select id="note_type" class="note-select">${NOTE_TYPES.filter(t=>t.id!=='all').map(t=>`<option value="${t.id}" ${currentType===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div><div id="metaFields">${metaHtml}</div>${tagsHtml}<div class="note-field-group"><div class="note-field-label">📝 正文 / 笔记内容</div><textarea id="note_body" class="note-textarea" placeholder="写下你的详细笔记、感悟或摘录…">${esc(bodyContent)}</textarea></div>`;
  };
  editorContainer.innerHTML=buildEditorHTML(type,note);
  document.getElementById('note_type').onchange=()=>{
    const newType=document.getElementById('note_type').value;
    const bodyVal=document.getElementById('note_body').value;const titleVal=document.getElementById('note_title').value;
    const newMetaFields=fieldsMap[newType]||[];const metaDiv=document.getElementById('metaFields');
    metaDiv.innerHTML=newMetaFields.map(f=>`<div class="note-field-group"><div class="note-field-label">${f}</div><input type="text" id="meta_${f.replace(/\s/g,'_').replace(/\//g,'_')}" class="note-input" value=""></div>`).join('');
    const existingTagGroup=document.getElementById('note_tags')?.closest('.note-field-group');if(existingTagGroup)existingTagGroup.remove();
    if(newType==='novel'){const tagDiv=document.createElement('div');tagDiv.className='note-field-group';tagDiv.innerHTML='<div class="note-field-label">自定义标签（逗号分隔）</div><input type="text" id="note_tags" class="note-input">';metaDiv.insertAdjacentElement('afterend',tagDiv);}
    setTimeout(()=>{if(document.getElementById('note_body'))document.getElementById('note_body').value=bodyVal;if(document.getElementById('note_title'))document.getElementById('note_title').value=titleVal;},0);
  };
  editorPage.classList.add('active');
  document.getElementById('editorCloseBtn').onclick=()=>{editorPage.classList.remove('active');renderNoteList();};
  document.getElementById('editorSaveBtn').onclick=()=>{
    const title=document.getElementById('note_title').value.trim();if(!title){toast('请输入标题');return;}
    const newType=document.getElementById('note_type').value;const metaFieldsList=fieldsMap[newType]||[];const fields={};
    metaFieldsList.forEach(f=>{const el=document.getElementById(`meta_${f.replace(/\s/g,'_').replace(/\//g,'_')}`);if(el)fields[f]=el.value;});
    const bodyText=document.getElementById('note_body').value;fields['我的笔记']=bodyText;
    if(newType==='collect')fields['原文摘要']=fields['原文摘要']||'';
    if(newType==='novel')fields['素材内容']=bodyText;
    let tags=[];if(newType==='novel'){const tagsStr=document.getElementById('note_tags')?.value||'';tags=tagsStr.split(/[,，]/).map(t=>t.trim()).filter(t=>t);}
    const images=note?.images||[];const files=note?.files||[];
    if(isEdit){const idx=S.notes.findIndex(n=>n.id===noteId);if(idx!==-1)S.notes[idx]={...S.notes[idx],title,type:newType,fields,tags,images,files,updatedAt:Date.now()};toast('笔记已更新 ✓');}
    else{S.notes.push({id:uid(),title,type:newType,fields,tags,images,files,createdAt:Date.now(),updatedAt:Date.now()});toast('笔记已创建 ✓');}
    save();editorPage.classList.remove('active');renderNoteList();
  };
}

// ==================== 旧版迁移 ====================
function migrateOldData(){
  try{
    const raw=localStorage.getItem('myu6');if(!raw){toast('没有找到旧版数据');return;}
    const old=JSON.parse(raw);let count=0;
    if(Array.isArray(old.tasks))old.tasks.forEach(t=>{if(!S.tasks.find(x=>x.id===t.id)){S.tasks.push({id:t.id,date:t.date||td(),name:t.name||'',priority:'green',done:!!t.done});count++;}});
    if(Array.isArray(old.wishes))old.wishes.forEach(w=>{if(!S.wishes.find(x=>x.id===w.id)){S.wishes.push({id:w.id,t:w.t||'',date:w.date||''});count++;}});
    if(Array.isArray(old.diaries))old.diaries.forEach(d=>{if(!S.diaries.find(x=>x.id===d.id)){S.diaries.push({id:d.id,t:d.t||'',date:d.date||''});count++;}});
    if(Array.isArray(old.emotions))old.emotions.forEach(e=>{if(!S.emotions.find(x=>x.id===e.id)){S.emotions.push({id:e.id,t:e.t||'',date:e.date||''});count++;}});
    if(Array.isArray(old.goodH))old.goodH.forEach(h=>{if(!S.goodH.find(x=>x.id===h.id)){const r={};Object.keys(h.records||{}).forEach(dk=>{if(h.records[dk]==='on'){const day=parseInt((dk||'').split('-')[2]);if(day>=1&&day<=31)r[day]='on';}});S.goodH.push({id:h.id,name:h.name||'',emoji:h.emoji||'💪',records:r,notes:{}});count++;}});
    if(Array.isArray(old.projs))old.projs.forEach(p=>{if(!S.projs.find(x=>x.id===p.id)){S.projs.push({id:p.id,name:p.name||'',total:p.total||0,done:p.done||0,children:[],parentId:null,notes:[]});count++;}});
    if(Array.isArray(old.whois))old.whois.forEach(w=>{if(!S.whois.find(x=>x.id===w.id)){S.whois.push({id:w.id,t:w.t||'',date:w.date||''});count++;}});
    if(Array.isArray(old.selfNotes))old.selfNotes.forEach(n=>{if(!S.selfNotes.find(x=>x.id===n.id)){S.selfNotes.push({id:n.id,t:n.t||'',cat:n.cat||'其他',date:n.date||''});count++;}});
    if(Array.isArray(old.achievements))old.achievements.forEach(a=>{if(!S.achievements.find(x=>x.id===a.id)){S.achievements.push({id:a.id,title:a.title||'',type:a.type||'完成了',emoji:a.emoji||'🏆',note:a.note||'',date:a.date||''});count++;}});
    if(old.plans&&typeof old.plans==='object'){['day','week','month','year'].forEach(type=>{const txt=old.plans[type];if(txt&&typeof txt==='string'&&txt.trim()){if(!S.plans[type])S.plans[type]=[];txt.split('\n').filter(line=>line.trim()).forEach(line=>{S.plans[type].push({text:line.trim(),done:false});});count++;}});}
    if(Array.isArray(old.planArchives))old.planArchives.forEach(a=>{if(!S.planArchives.find(x=>x.id===a.id)){S.planArchives.push({id:a.id,type:a.type||'day',content:a.t||a.content||'',date:a.date||''});count++;}});
    if(Array.isArray(old.quotes))old.quotes.forEach(q=>{if(!S.userQuotes.includes(q))S.userQuotes.push(q);});
    if(Array.isArray(old.clarityQs))old.clarityQs.forEach(q=>{if(!S.userClarityQs.includes(q))S.userClarityQs.push(q);});
    save();toast(`迁移完成！共迁移 ${count} 条数据 ✅`);setTimeout(()=>location.reload(),1500);
  }catch(e){toast('迁移出错：'+e.message);}
}
