<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>我的宇宙</title>

<style>
*:focus { outline: none !important; }
* { -webkit-tap-highlight-color: transparent; }
:root{
  --bg:#f0f4f1;--white:#ffffff;--card:#ffffff;--ink:#1e2d22;--ink2:#4a6350;--ink3:#8baa94;
  --g:#3d8b5e;--g-light:#e8f5ee;--g-mid:#b8ddc8;--g-dark:#2a6642;
  --g-xlight:rgba(61,139,94,.07);--g-border:rgba(61,139,94,.18);
  --nb-bg:#fdf8ee;--nb-line:rgba(180,150,80,.18);--nb-ring:#b0a080;--nb-ink:#3a2808;--nb-ink2:#7a6040;--nb-ink3:#b0a070;
  --sky:#5b9fb8;--red:#d96b55;--orange:#d4904a;--green:#3d8b5e;
  --shadow-sm:0 1px 4px rgba(0,0,0,.05);--shadow-md:0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);--radius-sm:10px;--radius-md:16px;--radius-lg:22px;
  --base-font:15px;
}

/* ══ 渐变主题 ══ */
body.t-grad-spring{
  --g:#d4a843;--g-light:rgba(255,255,255,.5);--g-mid:rgba(255,255,255,.6);--g-dark:#a07820;
  --g-xlight:rgba(255,255,255,.3);--g-border:rgba(255,255,255,.4);
  --bg:#fefae9;--white:rgba(255,255,255,.75);--card:rgba(255,255,255,.7);
  --ink:#3a2d10;--ink2:#5a4820;--ink3:#8a7840;
  --nb-bg:rgba(255,255,255,.6);--nb-line:rgba(212,168,67,.2);--nb-ring:#d4a843;--nb-ink:#3a2d10;--nb-ink2:#5a4820;--nb-ink3:#8a7840;
}
body.t-grad-spring::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(160deg,#ffd1dc 0%,#f8e16c 50%,#c1e1c1 100%);
}
body.t-forest-wander{--g:#5C9D7F;--g-light:rgba(255,255,255,.5);--g-mid:rgba(255,255,255,.6);--g-dark:#45765f;--g-xlight:rgba(255,255,255,.3);--g-border:rgba(255,255,255,.4);--bg:#f9f1ea;--white:rgba(255,255,255,.75);--card:rgba(255,255,255,.7);--ink:#192a22;--ink2:#294739;--ink3:#406e59;--nb-bg:rgba(255,255,255,.6);--nb-line:rgba(92,157,127,0.2);--nb-ring:#5C9D7F;--nb-ink:#192a22;--nb-ink2:#294739;--nb-ink3:#406e59;}
body.t-forest-wander::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#5c9d7f 0%,#d4a373 50%,#f5e769 100%);}
body.t-tropic-venom{--g:#50C878;--g-light:rgba(255,255,255,.5);--g-mid:rgba(255,255,255,.6);--g-dark:#3c965a;--g-xlight:rgba(255,255,255,.3);--g-border:rgba(255,255,255,.4);--bg:#fffde5;--white:rgba(255,255,255,.75);--card:rgba(255,255,255,.7);--ink:#163620;--ink2:#245a36;--ink3:#388c54;--nb-bg:rgba(255,255,255,.6);--nb-line:rgba(80,200,120,0.2);--nb-ring:#50C878;--nb-ink:#163620;--nb-ink2:#245a36;--nb-ink3:#388c54;}
body.t-tropic-venom::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#50c878 0%,#fff44f 50%,#e32636 100%);}
body.t-midnight-garden{--g:#7851A9;--g-light:rgba(255,255,255,.5);--g-mid:rgba(255,255,255,.6);--g-dark:#5a3d7f;--g-xlight:rgba(255,255,255,.3);--g-border:rgba(255,255,255,.4);--bg:#faf4f3;--white:rgba(255,255,255,.75);--card:rgba(255,255,255,.7);--ink:#20162e;--ink2:#36244c;--ink3:#543976;--nb-bg:rgba(255,255,255,.6);--nb-line:rgba(120,81,169,0.2);--nb-ring:#7851A9;--nb-ink:#20162e;--nb-ink2:#36244c;--nb-ink3:#543976;}
body.t-midnight-garden::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#7851a9 0%,#dbb4ad 50%,#f5f3a5 100%);}
/* 渐变主题的 body 本身仍要透明，才能看见上面 ::before 的渐变背景；
   --bg 改成了实色是给输入框/格子等小元素用的，避免它们变隐形导致重叠看不清 */
body.t-grad-spring,body.t-forest-wander,body.t-tropic-venom,body.t-midnight-garden{background:transparent;}

*{box-sizing:border-box;margin:0;padding:0;}
/* 让页面内容跟随字体大小设置 */
.pg, .pg div, .pg span, .pg p, .pg button, .pg input, .pg textarea, .pg select, .pg label{font-size:inherit;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;max-width:500px;margin:0 auto;padding-bottom:84px;min-height:100vh;font-size:var(--base-font);line-height:1.55;}
.hdr{background:var(--white);padding:14px 18px 12px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--g-border);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm);}
.hdr h1{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.3px;}
.hdr-date{font-size:11px;color:var(--ink3);margin-top:1px;}
.export-btn{background:var(--g-light);border:none;border-radius:20px;padding:5px 14px;font-size:12px;color:var(--g);cursor:pointer;font-weight:500;transition:background .15s;}
.export-btn:active{background:var(--g-mid);}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--g-border);display:flex;z-index:200;padding:6px 0 max(12px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.05);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 0;position:relative;transition:transform .12s;}
.ni:active{transform:scale(.92);}
.ni .ico{font-size:21px;transition:transform .15s;}
.ni .lbl{font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.2px;}
.ni.on .lbl{color:var(--g);font-weight:700;}
.ni.on .ico{transform:scale(1.15);}
.ni.on::after{content:'';position:absolute;bottom:-5px;left:28%;right:28%;height:2.5px;background:var(--g);border-radius:3px;}
.pg{display:none;padding:16px;}
.pg.active{display:block;}
.top-tabs{display:flex;justify-content:flex-start;gap:6px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--g-border);overflow-x:auto;scrollbar-width:none;}
.top-tabs::-webkit-scrollbar{display:none;}
.tab-main{background:none;border:none;font-size:14px;font-family:inherit;cursor:pointer;padding:7px 14px;border-radius:30px;color:var(--ink3);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all .15s;font-weight:500;}
.tab-main.on{color:var(--g);font-weight:600;background:var(--g-light);}
.quote-box{background:linear-gradient(135deg,var(--nb-bg) 0%,var(--card) 100%);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-md);border:1px solid var(--nb-line);position:relative;overflow:hidden;}
.quote-box::before{content:'"';position:absolute;top:-10px;left:10px;font-size:72px;color:var(--nb-line);font-family:serif;line-height:1;pointer-events:none;}
.quote-txt{font-size:14px;color:var(--ink2);line-height:1.7;font-style:italic;padding-right:40px;}
.quote-edit-btn{position:absolute;bottom:10px;right:12px;background:var(--g-xlight);border:none;border-radius:16px;padding:3px 11px;font-size:11px;color:var(--g);cursor:pointer;}
.ti{background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid var(--g-border);box-shadow:var(--shadow-sm);transition:opacity .2s,background .2s;}
.ti.done{opacity:.55;background:var(--g-light);}
.chk{width:24px;height:24px;border:2px solid var(--g-mid);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all .15s;}
.chk.on{background:var(--g);border-color:var(--g);color:#fff;}
.tn{flex:1;font-size:14px;font-weight:500;}
.priority-red{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;}
.priority-orange{width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;}
.priority-green{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.si{background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--g-mid);box-shadow:var(--shadow-sm);}
.si-text{font-size:14px;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-all;}
.si-date{font-size:10px;color:var(--ink3);margin-top:4px;letter-spacing:.3px;}
.si-acts{display:flex;gap:8px;margin-top:7px;}
.habit-card{background:var(--card);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--g-border);}
.habit-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.habit-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.habit-day{width:34px;height:34px;border-radius:9px;background:var(--bg);border:1px solid var(--g-border);cursor:pointer;font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;color:var(--ink2);}
.habit-day.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 2px 6px var(--g-border);}
.project-card-root{background:var(--card);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;border-left:4px solid var(--g);box-shadow:var(--shadow-sm);}
.project-card-child{border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;margin-left:20px;border-left:2px solid;}
.project-card-grandchild{border-radius:8px;padding:8px 10px;margin-bottom:6px;margin-left:28px;border-left:1px dashed;}
/* 交替色——子项目/孙项目都用这组，JS里用 colorIdx % 5 决定用哪个 */
.pc-0{background:#fef9ec;border-color:#e8d48a;}
.pc-1{background:#eaf4fb;border-color:#90c8e8;}
.pc-2{background:#fdf0f5;border-color:#e8a8c0;}
.pc-3{background:#f0f8ee;border-color:#96d4a0;}
.pc-4{background:#f5f0fa;border-color:#c0a8e0;}
.progress-bar{height:5px;background:var(--g-light);border-radius:3px;margin:8px 0 4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--g),#5db87a);width:0%;border-radius:3px;transition:width .3s;}
.plan-tabs{display:flex;gap:0;justify-content:stretch;margin-bottom:18px;background:var(--g-light);border-radius:var(--radius-sm);padding:3px;}
.plan-tab{flex:1;background:none;border:none;font-size:13px;padding:8px 4px;color:var(--ink3);cursor:pointer;position:relative;font-weight:500;border-radius:8px;transition:all .15s;}
.plan-tab.on{color:var(--g-dark);font-weight:700;background:var(--white);box-shadow:var(--shadow-sm);}
.plan-add-btn{width:100%;padding:11px;margin-bottom:12px;background:transparent;border:1.5px dashed var(--g-mid);border-radius:var(--radius-sm);color:var(--g);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;}
.plan-add-btn:active{background:var(--g-light);}
.plan-check-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--g-border);}
.plan-check{width:22px;height:22px;border:2px solid var(--g-mid);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--white);flex-shrink:0;transition:all .15s;}
.plan-check.done{background:var(--g);border-color:var(--g);color:#fff;}
.plan-text{flex:1;font-size:14px;word-break:break-all;}
.plan-text.done{text-decoration:line-through;color:var(--ink3);}
.plan-del{background:transparent;border:none;color:#c97c5a;font-size:16px;cursor:pointer;padding:4px;}
.plan-archive-item{background:var(--card);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:7px;border-left:2px solid var(--g-mid);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:8px;}
.plan-archive-content{flex:1;}
.ach-header{text-align:center;padding:20px 16px 16px;background:linear-gradient(135deg,var(--g-light),var(--white));border-radius:var(--radius-md);margin-bottom:16px;box-shadow:var(--shadow-sm);}
.ach-icon{font-size:40px;}
.ach-slogan{font-size:14px;color:var(--g);font-weight:600;margin-top:6px;cursor:pointer;letter-spacing:.5px;}
.achi-card{background:linear-gradient(135deg,var(--white),var(--g-light));border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow-sm);}
.addbtn{width:100%;padding:10px;background:var(--g-mid);border:1px solid var(--g-border);border-radius:var(--radius-sm);color:var(--g-dark);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.addbtn:active{opacity:.8;}
.pbtn{padding:8px 16px;background:var(--g);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-size:13px;transition:background .15s;box-shadow:0 2px 8px var(--g-border);}
.pbtn:active{background:var(--g-dark);}
.gbtn{background:transparent;border:1px solid var(--g-border);border-radius:var(--radius-sm);padding:5px 12px;cursor:pointer;font-size:12px;}
.sbtn{padding:4px 11px;background:var(--g-light);color:var(--g);border:none;border-radius:10px;font-size:11px;cursor:pointer;font-weight:500;}
.delbtn{background:transparent;border:none;color:#c97c5a;font-size:17px;cursor:pointer;padding:4px;}
.empty{text-align:center;padding:28px 12px;color:var(--ink3);font-size:13px;line-height:1.8;}
.empty::before{display:block;font-size:28px;margin-bottom:8px;content:attr(data-icon);}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:7px 20px;border-radius:40px;font-size:12px;opacity:0;transition:opacity .2s;z-index:500;white-space:nowrap;backdrop-filter:blur(8px);}
.toast.on{opacity:1;}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:.2s;backdrop-filter:blur(4px);}
.modal-mask.on{visibility:visible;opacity:1;}
.modal-container{background:var(--white);border-radius:var(--radius-lg);width:88%;max-width:360px;padding:22px 20px 18px;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-title{font-weight:700;margin-bottom:14px;font-size:16px;color:var(--ink);letter-spacing:-.2px;}
.modal-buttons{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
.modal-buttons button{padding:9px 20px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;}
.modal-cancel{background:var(--bg);border:1px solid var(--g-border);color:var(--ink2);}
.modal-confirm{background:var(--g);border:none;color:#fff;box-shadow:0 2px 8px var(--g-border);}
.priority-selector{display:flex;gap:8px;margin-top:6px;}
.priority-option{flex:1;padding:9px 6px;border-radius:var(--radius-sm);border:2px solid transparent;cursor:pointer;text-align:center;font-size:12px;background:var(--bg);transition:all .15s;font-weight:500;}
.priority-option.selected{border-color:var(--g);background:var(--g-light);}
.priority-option.p-red.selected{border-color:var(--red);background:#fff3f1;}
.priority-option.p-orange.selected{border-color:var(--orange);background:#fff8f2;}
.priority-option.p-green.selected{border-color:var(--green);background:var(--g-light);}
input,textarea,select{background:var(--bg);border:1.5px solid var(--g-border);border-radius:var(--radius-sm);padding:10px 12px;width:100%;font-family:inherit;font-size:14px;color:var(--ink);transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--g);background:var(--white);}
.right-btn{display:flex;justify-content:flex-end;margin-top:8px;}
.task-section{margin-bottom:20px;}
.timer-section{margin-top:20px;}
.stl{font-weight:700;margin-bottom:10px;color:var(--ink2);font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
.fortune-trigger{background:linear-gradient(145deg,#1e1030,#120820);border-radius:var(--radius-md);padding:18px 16px;text-align:center;position:relative;margin:18px 0 4px;border:2px solid #e8c940;box-shadow:0 0 0 2px rgba(0,0,0,.2),0 0 0 3.5px #a07820,0 8px 24px rgba(0,0,0,.3),0 0 18px rgba(232,201,64,.4);}
.fortune-trigger-title{font-size:16px;font-weight:700;color:#e8c940;margin-bottom:12px;text-shadow:0 0 8px rgba(232,201,64,.5);letter-spacing:2px;}
.fortune-trigger-btn{background:linear-gradient(135deg,#e8c940,#f0a020);border:none;padding:9px 28px;border-radius:40px;font-size:13px;font-weight:700;color:#1e1030;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:transform .1s;}
.fortune-trigger-btn:active{transform:scale(.96);}
.fortune-edit-icon{position:absolute;top:-14px;right:-14px;background:var(--white);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);font-size:16px;z-index:10;border:1.5px solid #e8c940;}
.floating-card-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,5,20,.8);z-index:1000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity .3s;}
.floating-card-mask.active{visibility:visible;opacity:1;}
.floating-card{width:82%;max-width:360px;height:60%;max-height:460px;background:linear-gradient(145deg,#2a1a4a,#150a2a);border-radius:26px;border:2px solid #e8c940;box-shadow:0 0 0 3px rgba(0,0,0,.2),0 24px 48px rgba(0,0,0,.5),0 0 24px rgba(232,201,64,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;}
.floating-card.rotating{animation:card3DRotate 1.2s ease-in-out 2;}
@keyframes card3DRotate{0%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
.floating-card .card-back{font-size:52px;color:#e8c940;text-shadow:0 0 12px rgba(232,201,64,.6);}
.floating-card .card-front{font-size:18px;font-weight:500;color:#f5e8b0;line-height:1.7;word-break:break-word;}
.floating-card .card-front.hide,.floating-card .card-back.hide{display:none;}
/* ===== Oracle 魔法卡牌新样式 ===== */
.floating-card{background:linear-gradient(160deg,#1a0a2e 0%,#2d1155 40%,#1a0a2e 100%)!important;border:2px solid #e8c940!important;box-shadow:0 0 0 3px rgba(0,0,0,.3),0 0 40px rgba(232,201,64,.5),0 24px 48px rgba(0,0,0,.6)!important;position:relative;overflow:hidden;}
.oracle-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.oracle-star{position:absolute;color:#e8c940;animation:starTwinkle 2s ease-in-out infinite;}
@keyframes starTwinkle{0%,100%{opacity:.2;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
.oracle-moon{position:absolute;font-size:22px;color:rgba(232,201,64,.3);animation:moonFloat 4s ease-in-out infinite;}
@keyframes moonFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.oracle-title{font-size:16px;font-weight:900;color:#e8c940;letter-spacing:4px;text-shadow:0 0 12px rgba(232,201,64,.7),0 0 24px rgba(232,201,64,.3);margin-bottom:4px;}
.oracle-subtitle{font-size:10px;color:rgba(232,201,64,.5);letter-spacing:2px;margin-bottom:14px;}
.oracle-divider{width:80%;height:1px;background:linear-gradient(90deg,transparent,#e8c940,transparent);margin:10px auto;opacity:.5;}
.oracle-msg-text{font-size:19px;font-weight:700;color:#f5e8c0;line-height:1.6;letter-spacing:.5px;text-shadow:0 0 8px rgba(245,232,192,.3);padding:0 8px;position:relative;z-index:1;}
.oracle-record-btn{margin-top:14px;background:rgba(232,201,64,.15);border:1px solid rgba(232,201,64,.4);color:#e8c940;padding:6px 18px;border-radius:20px;font-size:12px;cursor:pointer;letter-spacing:1px;}
#note-editor-page{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:400;overflow-y:auto;display:none;padding:16px;max-width:500px;margin:0 auto;}
#note-editor-page.active{display:block;}
.note-editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(61,139,94,.12);position:sticky;top:0;background:var(--bg);z-index:5;}
.note-editor-title{font-size:17px;font-weight:700;}
.note-editor-close,.note-editor-save{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
.note-editor-close{background:var(--g-light);color:var(--g);border:none;}
.note-editor-save{background:var(--g);color:white;border:none;margin-left:8px;box-shadow:0 2px 8px var(--g-border);}
.note-field-group{margin-bottom:14px;}
.note-field-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.3px;}
.note-input,.note-select{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--g-border);border-radius:var(--radius-sm);font-size:14px;}
.note-textarea{width:100%;padding:12px;background:var(--white);border:1.5px solid var(--g-border);border-radius:var(--radius-md);font-size:14px;font-family:inherit;resize:vertical;min-height:200px;line-height:1.7;}
.attachment-area{background:var(--card);border-radius:var(--radius-md);padding:12px;margin-top:12px;border:1px dashed rgba(61,139,94,.2);}
.attachment-buttons{display:flex;gap:10px;margin-bottom:10px;}
.attach-btn{background:var(--g-light);border:none;padding:7px 16px;border-radius:24px;font-size:12px;cursor:pointer;color:var(--g);font-weight:500;display:inline-block;}
.image-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.image-item{position:relative;width:68px;height:68px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg);}
.image-item img{width:100%;height:100%;object-fit:cover;}
.image-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.file-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:6px;}
.file-name{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;}
.file-del{background:none;border:none;color:var(--red);cursor:pointer;}
.note-card{background:var(--card);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;border:1px solid var(--g-border);cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .1s;}
.note-card:active{transform:scale(.99);box-shadow:var(--shadow-md);}
.note-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.note-type-badge{background:var(--g-light);color:var(--g);font-size:10px;padding:2px 9px;border-radius:20px;margin-left:6px;font-weight:500;}
.note-tags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0;}
.note-tag{background:var(--g-light);padding:2px 9px;border-radius:16px;font-size:10px;color:var(--g);}
.note-preview{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.search-wrapper{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
.search-bar{flex:1;padding:10px 16px;background:var(--white);border:1.5px solid var(--g-border);border-radius:30px;font-size:14px;}
.search-btn{background:var(--g-mid);border:1px solid var(--g-border);border-radius:30px;padding:9px 16px;font-size:14px;cursor:pointer;color:var(--g-dark);}
.note-tab-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.note-tab-bar::-webkit-scrollbar{display:none;}
.note-tab-btn{padding:7px 16px;background:var(--bg);border:none;border-radius:30px;font-size:13px;color:var(--ink3);white-space:nowrap;cursor:pointer;font-weight:500;flex-shrink:0;transition:all .15s;}
.note-tab-btn.on{background:var(--g);color:white;box-shadow:0 2px 8px var(--g-border);}
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.list-count{font-size:12px;color:var(--ink3);}
.new-note-btn{background:var(--g-dark);border:none;padding:7px 16px;border-radius:24px;font-size:12px;color:white;cursor:pointer;font-weight:500;}
.section-divider{display:flex;align-items:center;gap:10px;margin:20px 0 12px;}
.section-divider .stl{margin:0;}
.section-divider::after{content:'';flex:1;height:1px;background:var(--g-border);}
.timer-btns{display:flex;gap:10px;}
.timer-btn{flex:1;padding:12px 8px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s,box-shadow .1s;}
.timer-btn:active{transform:scale(.96);}
.timer-btn-1{background:var(--g);color:#fff;box-shadow:0 3px 10px var(--g-border);}
.timer-btn-3{background:var(--g-mid);color:var(--g-dark);box-shadow:0 3px 10px var(--g-border);}
.timer-btn-5{background:var(--g-dark);color:#fff;box-shadow:0 3px 10px rgba(42,102,66,.3);}

.install-banner{background:linear-gradient(135deg,var(--g-light),var(--g-xlight));border:1.5px solid var(--g-mid);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:12px;}
.install-banner-icon{font-size:28px;flex-shrink:0;}
.install-banner-text{flex:1;}
.install-banner-title{font-size:14px;font-weight:700;color:var(--g-dark);margin-bottom:4px;}
.install-banner-desc{font-size:12px;color:var(--ink2);line-height:1.6;}
.install-banner-close{background:none;border:none;color:var(--ink3);font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}

.backup-reminder{background:linear-gradient(135deg,#fff8f0,#ffeedd);border:1.5px solid #f0c080;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.backup-reminder-text{flex:1;font-size:13px;color:#7a4a10;}
.backup-now-btn{background:#e8a030;border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap;}
/* ===== 番茄钟 ===== */
.pomodoro-trigger{background:linear-gradient(135deg,var(--g-light),var(--g-xlight));border-radius:var(--radius-md);padding:16px;margin-top:14px;border:1.5px solid var(--g-mid);box-shadow:var(--shadow-sm);}
.pomodoro-trigger-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.pomodoro-trigger-title{font-size:14px;font-weight:700;color:var(--g-dark);letter-spacing:1px;}
.pomodoro-settings-btn{background:var(--white);border:1px solid var(--g-mid);color:var(--g);padding:4px 12px;border-radius:16px;font-size:11px;cursor:pointer;}
.pomodoro-info{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.pomo-stat{flex:1;min-width:60px;background:var(--g-xlight);border-radius:10px;padding:8px;text-align:center;}
.pomo-stat-num{font-size:18px;font-weight:700;color:var(--g);}
.pomo-stat-lbl{font-size:10px;color:var(--ink2);margin-top:2px;}
.pomodoro-start-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--g),var(--g-dark));border:none;border-radius:var(--radius-sm);color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;box-shadow:0 3px 12px var(--g-border);}
.pomodoro-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(160deg,var(--bg),var(--g-light),var(--g-xlight));z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity .3s;}
.pomodoro-fullscreen.active{visibility:visible;opacity:1;}
.pomo-phase-label{font-size:13px;color:var(--g-dark);letter-spacing:4px;margin-bottom:16px;font-weight:700;opacity:.8;}
.pomo-time-display{font-size:80px;font-weight:900;color:var(--g-dark);letter-spacing:-4px;line-height:1;}
.pomo-cycle-info{font-size:13px;color:var(--ink3);margin-top:12px;letter-spacing:1px;}
.pomo-controls{display:flex;gap:16px;margin-top:32px;}
.pomo-ctrl-btn{padding:12px 28px;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:1px;border:none;transition:transform .1s;}
.pomo-ctrl-btn:active{transform:scale(.95);}
.pomo-btn-pause{background:linear-gradient(135deg,var(--g),var(--g-dark));color:#fff;}
.pomo-btn-stop{background:var(--g-xlight);color:var(--g-dark);border:1px solid var(--g-border)!important;}
.pomo-blink-toggle{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;}
.pomo-blink-label{font-size:12px;color:var(--ink3);letter-spacing:1px;}
.pomo-blink-icon{font-size:20px;transition:transform .15s;}
.pomo-blink-icon.blinking{animation:blinkPulse .3s ease;}
@keyframes blinkPulse{0%{transform:scale(1);}50%{transform:scale(1.4);}100%{transform:scale(1);}}

/* ===== 日记标签 ===== */
.diary-tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.diary-tag-chip{padding:4px 12px;border:1.5px solid var(--g-mid);border-radius:20px;font-size:12px;cursor:pointer;color:var(--ink3);transition:all .15s;background:var(--bg);}
.diary-tag-chip.on{background:var(--g);color:#fff;border-color:var(--g);}
.diary-tag-chip.manage{border-style:dashed;color:var(--g);}
.diary-entry-tag{display:inline-block;background:var(--g-light);color:var(--g);padding:1px 8px;border-radius:10px;font-size:10px;margin-right:4px;font-weight:500;}
.new-tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.new-tag-opt{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1.5px solid var(--g-mid);background:var(--bg);color:var(--ink2);transition:all .15s;}
.new-tag-opt.on{background:var(--g);color:#fff;border-color:var(--g);}
/* ══ 主题选择器 ══ */
.th-grid{display:flex;flex-wrap:wrap;gap:8px;}
.th-item{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;}
.th-dot{width:38px;height:38px;border-radius:50%;border:2.5px solid transparent;transition:transform .15s,border-color .15s;}
.th-dot:hover{transform:scale(1.1);}
.th-active{border-color:var(--ink)!important;transform:scale(1.08);box-shadow:0 0 0 2px var(--white),0 0 0 3px var(--ink);}
.th-name{font-size:9px;color:var(--ink3);text-align:center;width:40px;line-height:1.2;}
/* 设置面板指示点 */
.set-dot{width:8px;height:8px;border-radius:50%;background:var(--g-mid);cursor:pointer;transition:background .2s,transform .2s;}
.set-dot.on{background:var(--g);transform:scale(1.3);}
/* ══ 本子计划（颜色全部跟随主题的 --nb-* 变量） ══ */
.notebook-wrap{position:relative;background:var(--nb-bg);border-radius:var(--radius-md);box-shadow:3px 3px 0 rgba(0,0,0,.06),6px 6px 0 rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.12);margin:0 2px;overflow:hidden;}
.notebook-wrap::before{content:'';position:absolute;left:28px;top:0;bottom:0;width:1.5px;background:var(--nb-line);z-index:1;}
.notebook-rings{position:absolute;left:18px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;padding:24px 0;pointer-events:none;z-index:2;}
.notebook-ring{width:10px;height:10px;border-radius:50%;border:2px solid var(--nb-ink3);background:var(--nb-bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);}
.notebook-header{background:var(--nb-bg);padding:12px 14px 10px 38px;border-bottom:1.5px solid var(--nb-line);}
.notebook-title{font-size:15px;font-weight:700;color:var(--nb-ink2);letter-spacing:.5px;}
.notebook-date{font-size:10px;color:var(--nb-ink3);margin-top:2px;}
/* 32px格子：31px内容 + 1px线，所有文字行高都是32px */
.notebook-body{padding:0 14px 20px 38px;background:repeating-linear-gradient(180deg,transparent,transparent 31px,var(--nb-line) 31px,var(--nb-line) 32px);min-height:calc(100vh - 280px);}
.nb-tab-row{display:flex;gap:0;padding:0 0 0 28px;background:var(--nb-bg);border-bottom:1px solid var(--nb-line);overflow-x:auto;}
.nb-tab{padding:8px 12px;font-size:12px;font-weight:600;color:var(--nb-ink3);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.nb-tab.on{color:var(--nb-ink2);border-bottom-color:var(--nb-ring);}
.nb-item{padding:0;border:none;display:flex;align-items:flex-start;gap:8px;}
.nb-check{width:18px;height:18px;border:1.5px solid var(--nb-ring);border-radius:4px;flex-shrink:0;margin-top:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--nb-ink2);background:var(--white);}
.nb-check.done{background:var(--nb-ring);border-color:var(--nb-ring);color:#fff;}
.nb-content{flex:1;}
.nb-item-title{font-size:14px;color:var(--nb-ink);line-height:32px;min-height:32px;}
.nb-item-title.done{text-decoration:line-through;color:var(--nb-ink3);}
.nb-item-note{font-size:12px;color:var(--nb-ink3);line-height:32px;white-space:pre-wrap;margin:0;padding:0;}
.nb-item-meta{font-size:10px;color:var(--nb-ink3);line-height:32px;height:32px;}
.nb-add-btn{display:block;width:100%;height:32px;line-height:32px;background:transparent;border:none;color:var(--nb-ink3);font-size:13px;cursor:pointer;font-family:inherit;text-align:left;padding:0;margin:0;}
.nb-add-btn:active{color:var(--nb-ink2);}
.nb-empty{text-align:center;padding:96px 0 0;color:var(--nb-ink3);font-size:13px;line-height:32px;}
.nb-item-actions{display:flex;gap:6px;height:32px;align-items:center;}
/* tab在本子外面 */
.plan-outer-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.plan-outer-tab{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:var(--ink3);background:var(--card);border:1.5px solid var(--g-mid);cursor:pointer;transition:all .15s;}
.plan-outer-tab.on{background:var(--g);color:#fff;border-color:var(--g);}
/* 添加按钮居中在本子外面 */
.nb-add-outer-btn{display:block;margin:12px auto 0;padding:10px 32px;background:var(--g);border:none;border-radius:20px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
/* 日记本子内标签 */
.nb-diary-tag{display:inline-block;padding:0 10px;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;color:var(--nb-ink3);background:var(--nb-line);border:1px solid var(--nb-line);line-height:28px;margin-right:4px;}
.nb-diary-tag.on{background:var(--nb-ring);color:#fff;border-color:var(--nb-ring);}
</style>

function applyFontSize(size){
  const scale=size/15;
  document.body.style.fontSize=size+'px';
  document.documentElement.style.setProperty('--base-font', size+'px');
  document.documentElement.style.setProperty('--font-scale', scale);
  // 直接缩放整个页面内容区域
  const pages=document.querySelectorAll('.pg');
  pages.forEach(p=>{p.style.fontSize=size+'px';});
  localStorage.setItem('myu_font', size);
}
function loadFontSize(){
  const saved=localStorage.getItem('myu_font');
  if(saved) applyFontSize(parseFloat(saved));

function applyTheme(id){
  document.body.className=document.body.className.replace(/\bt-\S+/g,'').trim();
  if(id&&id!=='green') document.body.classList.add('t-'+id);
  localStorage.setItem('myu_theme',id||'green');
}
function loadTheme(){
  const t=localStorage.getItem('myu_theme')||'green';
  applyTheme(t);
}
function buildThemeSection(curId){
  const dot=(t)=>`<div class="th-item" data-tid="${t.id}" title="${t.name}">
    <div class="th-dot${t.id===curId?' th-active':''}" style="background:${t.mid?`linear-gradient(135deg,${t.a} 33%,${t.mid} 66%,${t.b} 100%)`:`linear-gradient(135deg,${t.a} 50%,${t.b} 50%)`}"></div>

function load(){
  try{let d=localStorage.getItem('myu_final_v10');if(d){let p=JSON.parse(d);Object.assign(S,p);}}catch(e){}
  if(!S.userQuotes)S.userQuotes=[];
  if(!S.userClarityQs)S.userClarityQs=[];
  if(!S.planArchives)S.planArchives=[];
  if(!S.notes)S.notes=[];
  if(!S.fortuneMessages)S.fortuneMessages=[];
  if(!S.fortuneRecords)S.fortuneRecords=[];
  if(!S.diaryTags||!Array.isArray(S.diaryTags))S.diaryTags=['心态','日常','干货'];
  if(!S.taskTypes||!Array.isArray(S.taskTypes)||!S.taskTypes.length)S.taskTypes=['📚 学习','💼 工作','🎨 爱好','🏠 家务','💬 交际','💭 其他'];
  if(!S.noteTypes||!Array.isArray(S.noteTypes)||!S.noteTypes.length)S.noteTypes=['📌 收藏','🎬 书影','✍️ 素材','📝 通用'];
  if(!S.selfNoteCats||!Array.isArray(S.selfNoteCats)||!S.selfNoteCats.length)S.selfNoteCats=['性格','情绪','习惯','价值观'];
  if(!S.pomodoroSettings)S.pomodoroSettings={work:25,rest:5,longRest:15,pomosBeforeLong:4,enabled:true,blinkEnabled:true,blinkInterval:5};
  if(!S.tasks)S.tasks=[];
  if(!S.plans||typeof S.plans!=='object'||Array.isArray(S.plans)){
    S.plans={day:[],week:[],month:[],year:[]};
  }else{
    if(!Array.isArray(S.plans.day))S.plans.day=[];
    if(!Array.isArray(S.plans.week))S.plans.week=[];
    if(!Array.isArray(S.plans.month))S.plans.month=[];
    if(!Array.isArray(S.plans.year))S.plans.year=[];
  }
  if(!S.lastBackupReminder)S.lastBackupReminder=0;
  if(S.installBannerDismissed===undefined)S.installBannerDismissed=false;
  if(!S.quoteIntervalMinutes)S.quoteIntervalMinutes=30;
}
function save(){localStorage.setItem('myu_final_v10',JSON.stringify(S));}
function uid(){return Date.now()+'-'+Math.random().toString(36).substr(2,6);}
function formatDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function td(){return formatDate(new Date());}
function nowStr(){let d=new Date();return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escHtml(s){return esc(s).replace(/\n/g,'<br>');}

// ==================== 自动备份提醒（每7天） ====================
function checkBackupReminder(){
  const now=Date.now();
  const sevenDays=7*24*60*60*1000;
  if(now-S.lastBackupReminder<sevenDays)return;
  const hasData=S.tasks.length||S.wishes.length||S.diaries.length||S.notes.length||S.achievements.length;
  if(!hasData)return;
  const reminder=document.createElement('div');
  reminder.className='backup-reminder';
  reminder.id='backupReminder';
  reminder.innerHTML=`
    <span style="font-size:22px">💾</span>
    <span class="backup-reminder-text">距上次备份已超过7天，建议导出一份备份保存到手机相册或文件夹</span>
    <button class="backup-now-btn" onclick="quickBackup()">立即备份</button>`;
  const todayContent=document.getElementById('todayContent');
  if(todayContent)todayContent.insertBefore(reminder,todayContent.firstChild);
}
function quickBackup(){
  const a=document.createElement('a');
  const dateStr=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download=`我的小宇宙备份_${dateStr}.json`;
  a.click();
  S.lastBackupReminder=Date.now();save();
  const r=document.getElementById('backupReminder');if(r)r.remove();
  toast('备份已保存 ✓ 请存到手机文件夹');
}

// ==================== 弹窗系统 ====================
let modalStack=[];
function openModal(){document.getElementById('globalModal').classList.add('on');}
function closeModal(){
  modalStack.pop();
  if(modalStack.length>0){
    let prev=modalStack[modalStack.length-1];
    _renderModal(prev.title,prev.body,prev.onConfirm,prev.onCancel,prev.confirmText,prev.cancelText,prev.hideConfirm,prev.showCancel);
    openModal();
  }else{document.getElementById('globalModal').classList.remove('on');}
}
function _renderModal(title,body,onConfirm,onCancel,confirmText,cancelText,hideConfirm,showCancel){
  document.getElementById('modalTitle').innerText=title;
  document.getElementById('modalBody').innerHTML=typeof body==='string'?body:'';
  if(typeof body==='function')body(document.getElementById('modalBody'));
  const btnsDiv=document.getElementById('modalButtons');btnsDiv.innerHTML='';
  if(showCancel){
    const cancelBtn=document.createElement('button');
    cancelBtn.innerText=cancelText||'取消';cancelBtn.className='modal-cancel';
    cancelBtn.onclick=()=>{if(onCancel)onCancel();closeModal();};
    btnsDiv.appendChild(cancelBtn);
  }
  if(!hideConfirm){
    const confirmBtn=document.createElement('button');
    confirmBtn.innerText=confirmText||'确认';confirmBtn.className='modal-confirm';
    confirmBtn.onclick=()=>{if(onConfirm)onConfirm();};
    btnsDiv.appendChild(confirmBtn);
  }
}
function showModal(title,body,onConfirm,onCancel,opts={}){
  const config={title,body,onConfirm,onCancel,confirmText:opts.confirmText,cancelText:opts.cancelText,hideConfirm:opts.hideConfirm,showCancel:opts.showCancel};
  modalStack.push(config);
  _renderModal(title,body,onConfirm,onCancel,opts.confirmText,opts.cancelText,opts.hideConfirm,opts.showCancel);
  openModal();
}
function prompt1(title,placeholder,defaultVal,callback){
  const body=`<input type="text" id="p1input" placeholder="${esc(placeholder)}" value="${esc(defaultVal||'')}" style="width:100%">`;
  showModal(title,body,()=>{
    const val=document.getElementById('p1input').value.trim();
    if(val){closeModal();callback(val);}else toast('内容不能为空');
  });
  setTimeout(()=>{const el=document.getElementById('p1input');if(el){el.focus();el.select();}},100);
}
function confirmDel(callback){
  showModal('确认删除','<p style="color:var(--ink2);font-size:14px;line-height:1.6">确定要删除吗？此操作不可撤销。</p>',
    ()=>{closeModal();callback();},null,{showCancel:true});
}
document.getElementById('globalModal').onclick=(e)=>{
  if(e.target===document.getElementById('globalModal')){
    e.stopPropagation();
    closeModal();
  }
};

function fixPlansData(){
  try{
    let raw=localStorage.getItem('myu_final_v10');let d=raw?JSON.parse(raw):{};
    if(!d.plans||typeof d.plans!=='object'||Array.isArray(d.plans)){d.plans={day:[],week:[],month:[],year:[]};}
    else{['day','week','month','year'].forEach(k=>{if(!Array.isArray(d.plans[k]))d.plans[k]=[];});}
    localStorage.setItem('myu_final_v10',JSON.stringify(d));Object.assign(S,d);
    closeModal();toast('修复完成！正在刷新…');setTimeout(()=>location.reload(),1500);
  }catch(e){toast('修复失败：'+e.message);}
}

    const dots=document.querySelectorAll('.set-dot');
    function goPanel(n){
      curPanel=n;
      panels.style.transform=`translateX(-${n*33.333}%)`;
      dots.forEach((d,i)=>d.classList.toggle('on',i===n));
    }
    dots.forEach(d=>{ d.onclick=()=>goPanel(parseInt(d.dataset.panel)); });

    // 触摸滑动
    let tx=0;
    panels.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
    panels.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-tx;
      if(Math.abs(dx)>40){
        if(dx<0&&curPanel<2)goPanel(curPanel+1);
        if(dx>0&&curPanel>0)goPanel(curPanel-1);
      }
    },{passive:true});

    if(migrateBtn)migrateBtn.onclick=()=>{if(confirm('将把旧版数据迁移到新版？')){migrateOldData();closeModal();}};
    const expBtn=document.getElementById('exportDataBtn');
    if(expBtn)expBtn.onclick=()=>{
      const dateStr=new Date().toISOString().slice(0,10);
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
      a.download=`我的小宇宙备份_${dateStr}.json`;a.click();
      S.lastBackupReminder=Date.now();save();
      toast('已导出，请保存到手机文件夹');closeModal();
    };
    const importInput=document.getElementById('importFileInput');
    if(importInput)importInput.onchange=(e)=>{
      const file=e.target.files[0];if(!file)return;
      const r=new FileReader();
      r.onload=ev=>{
        try{
          const d=JSON.parse(ev.target.result);
          if(confirm('导入会覆盖当前数据，确定吗？')){Object.assign(S,d);save();toast('导入成功');location.reload();}
        }catch(err){toast('文件错误');}
      };
      r.readAsText(file);importInput.value='';closeModal();
    };
  },50);
};

let quoteRotateInterval=null;
function getDisplayQuotes(){return[...S.defaultQuotes,...S.userQuotes];}
function getQuoteInterval(){
  // 单位：毫秒，默认30分钟
  return (S.quoteIntervalMinutes||30)*60*1000;
}
function startQuoteRotate(){
  if(quoteRotateInterval)clearInterval(quoteRotateInterval);
  const interval=getQuoteInterval();
  quoteRotateInterval=setInterval(()=>{
    const qs=getDisplayQuotes();
    if(qs.length>=2){
      const idx=Math.floor(Date.now()/interval)%qs.length;
      const q=document.getElementById('quoteEl');
      if(q)q.innerHTML=`"${esc(qs[idx])}"`;
    }
  },Math.min(interval,60000)); // 最多每分钟检查一次
}

function generateOracleStars(){
  const container=document.getElementById('oracleStars');if(!container)return;
  container.innerHTML='';
  const starPositions=[
    {top:'8%',left:'12%',delay:'0s',size:'12px'},{top:'15%',left:'80%',delay:'.5s',size:'10px'},
    {top:'25%',left:'5%',delay:'1s',size:'8px'},{top:'70%',left:'88%',delay:'.3s',size:'12px'},
    {top:'80%',left:'10%',delay:'.8s',size:'9px'},{top:'40%',left:'92%',delay:'1.5s',size:'10px'},
    {top:'55%',left:'3%',delay:'.2s',size:'8px'},{top:'90%',left:'75%',delay:'1.2s',size:'11px'},
    {top:'5%',left:'50%',delay:'.7s',size:'9px'},{top:'35%',left:'15%',delay:'1.8s',size:'7px'}
  ];
  starPositions.forEach(pos=>{
    const star=document.createElement('span');
    star.className='oracle-star';
    star.style.cssText=`top:${pos.top};left:${pos.left};font-size:${pos.size};animation-delay:${pos.delay};`;
    star.innerText=Math.random()>0.5?'✦':'✧';
    container.appendChild(star);
  });
  const moon=document.createElement('span');
  moon.className='oracle-moon';
  moon.style.cssText='top:10%;right:15%;';
  moon.innerText='🌙';
  container.appendChild(moon);
}
function drawFortuneCard(){
  const messages=S.fortuneMessages||[];
  if(messages.length===0){toast('请先编辑天意卡牌内容 ✨');return;}
  const randomMsg=messages[Math.floor(Math.random()*messages.length)];
  const today=td();
  const existing=S.fortuneRecords.find(r=>r.msg===randomMsg&&r.date===today);
  if(existing){existing.drawCount=(existing.drawCount||1)+1;}
  else{S.fortuneRecords.push({id:uid(),msg:randomMsg,date:today,drawCount:1,done:false});}
  save();
  const mask=document.getElementById('floatingCardMask');
  const card=document.getElementById('floatingCard');
  const backDiv=card.querySelector('.card-back');
  const frontDiv=card.querySelector('.card-front');
  document.getElementById('oracleMsgText').innerHTML=esc(randomMsg);
  frontDiv.classList.add('hide');backDiv.classList.remove('hide');
  card.classList.remove('rotating');mask.classList.add('active');
  generateOracleStars();
  setTimeout(()=>{card.classList.add('rotating');},10);
  const timer=setTimeout(()=>{card.classList.remove('rotating');backDiv.classList.add('hide');frontDiv.classList.remove('hide');},1200);
  const closeHandler=()=>{clearTimeout(timer);mask.classList.remove('active');card.classList.remove('rotating');backDiv.classList.remove('hide');frontDiv.classList.add('hide');mask.removeEventListener('click',closeHandler);};
  mask.addEventListener('click',closeHandler);
}
function showOracleRecords(){
  const body=(container)=>{
    if(!S.fortuneRecords.length){container.innerHTML='<div class="empty" data-icon="🔮">还没有抽卡记录</div>';return;}
    const allMsgs={};
    S.fortuneRecords.forEach(r=>{
      if(!allMsgs[r.msg])allMsgs[r.msg]={drawCount:0,doneCount:0};
      allMsgs[r.msg].drawCount+=r.drawCount||1;
      if(r.done)allMsgs[r.msg].doneCount++;
    });
    let html=`<div style="font-size:12px;color:var(--ink3);margin-bottom:12px;">共抽了 ${S.fortuneRecords.length} 次</div>`;
    const todayRecs=S.fortuneRecords.filter(r=>r.date===td());
    if(todayRecs.length){
      html+=`<div style="font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:8px;">📅 今日抽到</div>`;
      todayRecs.forEach(r=>{
        html+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--g-border);">
          <span style="flex:1;font-size:13px">${esc(r.msg)}</span>
          <span style="font-size:11px;color:var(--ink3)">x${r.drawCount||1}</span>
          <label style="display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;"><input type="checkbox" ${r.done?'checked':''} data-rid="${r.id}" style="width:auto">做了</label>
        </div>`;
      });
    }
    html+=`<div style="font-weight:700;font-size:13px;color:var(--ink2);margin:14px 0 8px;">📊 累计统计</div>`;
    Object.entries(allMsgs).forEach(([msg,stat])=>{
      html+=`<div style="padding:6px 0;border-bottom:1px solid rgba(61,139,94,.06);font-size:12px;display:flex;gap:8px;align-items:center;"><span style="flex:1">${esc(msg)}</span><span style="color:var(--ink3)">抽${stat.drawCount}次</span><span style="color:var(--g)">做${stat.doneCount}次</span></div>`;
    });
    container.innerHTML=html;
    container.querySelectorAll('input[data-rid]').forEach(cb=>{
      cb.onclick=()=>{const r=S.fortuneRecords.find(x=>x.id===cb.dataset.rid);if(r){r.done=cb.checked;save();}};
    });
  };
  showModal('📜 抽卡记录',body,null,null,{hideConfirm:true});
}

function renderTasks(){

  if(!tasks.length){container.innerHTML='<div class="empty" data-icon="✅">今天还没有任务<br>点击下方添加</div>';return;}
  container.innerHTML=tasks.map(t=>`
    <div class="ti ${t.done?'done':''}">
      <div class="chk ${t.done?'on':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</div>
      <div style="flex:1">
        <div class="tn" style="${t.done?'text-decoration:line-through':''}">${esc(t.name)}</div>
        ${t.taskType||t.note?`<div style="font-size:11px;color:var(--ink3);margin-top:2px">${t.taskType?`<span style="background:var(--g-light);color:var(--g);padding:1px 8px;border-radius:10px;margin-right:5px;font-weight:500">${t.taskType}</span>`:''}${t.note?esc(t.note):''}</div>`:''}

  const body=(container)=>{

let timerInt=null;
function startTimer(secs,taskName,taskId){
  if(timerInt)clearInterval(timerInt);
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:linear-gradient(135deg,#f0f8f3,#e8f5ee);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;';
  let s=secs;
  const fmt=()=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  ov.innerHTML=`<div style="font-size:26px;">🍃 专注中</div><div style="font-size:16px;color:var(--ink2);font-weight:500;">${esc(taskName)}</div><div style="font-size:88px;font-weight:800;color:var(--g);letter-spacing:-4px;" id="timerDisp">${fmt()}</div><button class="pbtn" style="background:var(--red);" onclick="this.parentElement.remove();clearInterval(timerInt);">停止</button>`;
  document.body.appendChild(ov);
  timerInt=setInterval(()=>{
    s--;const d=document.getElementById('timerDisp');if(d)d.innerText=fmt();
    if(s<=0){
      clearInterval(timerInt);ov.remove();toast('时间到！');
      if(taskId){
        showModal('🎉 专注完成！', `<p style="font-size:14px;color:var(--ink2);">恭喜你成功专注了！是否现在就将任务【<b>${esc(taskName)}</b>】标记为完成？</p>`,()=>{
          const t=S.tasks.find(x=>x.id===taskId);if(t){t.done=true;save();renderTasks();toast('任务完成，小宇宙爆发！');}
          closeModal();
        },null,{confirmText:'标记完成',cancelText:'暂不'});
      }
    }
  },1000);
}

function playBell(type){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    if(type==='end'){
      osc.frequency.setValueAtTime(523,ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(392,ctx.currentTime+.5);
      gain.gain.setValueAtTime(.4,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.5);
      osc.start();osc.stop(ctx.currentTime+1.5);
    }else{
      osc.frequency.setValueAtTime(784,ctx.currentTime);
      osc.frequency.setValueAtTime(880,ctx.currentTime+.15);
      osc.frequency.setValueAtTime(988,ctx.currentTime+.3);
      gain.gain.setValueAtTime(.35,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1);
      osc.start();osc.stop(ctx.currentTime+1);
    }
  }catch(e){}
}

function startPomodoro(){
  const ps=S.pomodoroSettings;
  pomoState={running:true,paused:false,phase:'work',workLeft:ps.work*60,restLeft:ps.rest*60,longRestLeft:ps.longRest*60,currentPomo:1,currentRound:1,interval:null,blinkInterval:null};
  document.getElementById('pomodoroFullscreen').classList.add('active');
  updatePomodoroDisplay();
  updateBlinkLabel();
  pomoState.interval=setInterval(pomoTick,1000);
  startBlinkReminder();
}

function updateBlinkLabel(){
  const lbl=document.getElementById('pomoBlinkLabel');
  if(lbl)lbl.innerText=`护眼提醒：${S.pomodoroSettings.blinkEnabled?'开':'关'}`;
}

function startBlinkReminder(){
  if(pomoState.blinkInterval)clearInterval(pomoState.blinkInterval);
  const ps=S.pomodoroSettings;
  if(!ps.blinkEnabled)return;
  pomoState.blinkInterval=setInterval(()=>{
    if(pomoState.paused)return;
    if(pomoState.phase!=='work')return;
    triggerBlinkPulse();
  },(ps.blinkInterval||5)*1000);
}

function triggerBlinkPulse(){
  if(navigator.vibrate)navigator.vibrate(150);
  playBlinkSound();
  const icon=document.getElementById('pomoBlinkIcon');
  if(icon){icon.classList.remove('blinking');void icon.offsetWidth;icon.classList.add('blinking');}
}

function playBlinkSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(1200,ctx.currentTime);
    gain.gain.setValueAtTime(.25,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);
    osc.start();osc.stop(ctx.currentTime+.25);
  }catch(e){}
}

function pomoTick(){
  if(pomoState.paused)return;
  const ps=S.pomodoroSettings;
  if(pomoState.phase==='work'){
    pomoState.workLeft--;
    if(pomoState.workLeft<=0){
      playBell('end');
      const isLongBreak=ps.enabled&&(pomoState.currentPomo%ps.pomosBeforeLong===0);
      if(isLongBreak){pomoState.phase='longrest';pomoState.longRestLeft=ps.longRest*60;}
      else{pomoState.phase='rest';pomoState.restLeft=ps.rest*60;}
    }
  }else if(pomoState.phase==='rest'){
    pomoState.restLeft--;
    if(pomoState.restLeft<=0){
      playBell('start');
      pomoState.currentPomo++;pomoState.phase='work';pomoState.workLeft=ps.work*60;
    }
  }else if(pomoState.phase==='longrest'){
    pomoState.longRestLeft--;
    if(pomoState.longRestLeft<=0){
      playBell('start');
      pomoState.currentPomo++;pomoState.currentRound++;pomoState.phase='work';pomoState.workLeft=ps.work*60;
    }
  }
  updatePomodoroDisplay();
}

function updatePomodoroDisplay(){
  const phaseMap={work:'✦ FOCUS ✦',rest:'✦ REST ✦',longrest:'✦ LONG BREAK ✦'};
  const phaseZh={work:'专注中',rest:'休息中',longrest:'大课间'};
  let secs=pomoState.phase==='work'?pomoState.workLeft:(pomoState.phase==='rest'?pomoState.restLeft:pomoState.longRestLeft);
  const label=document.getElementById('pomoPhaseLabel');
  const disp=document.getElementById('pomoTimeDisplay');
  const info=document.getElementById('pomoCycleInfo');
  if(label)label.innerText=phaseMap[pomoState.phase]||'FOCUS';
  if(disp)disp.innerText=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
  if(info)info.innerText=`第 ${pomoState.currentRound} 轮 · 第 ${pomoState.currentPomo} 个番茄 · ${phaseZh[pomoState.phase]}`;
}

function togglePomoPause(){
  pomoState.paused=!pomoState.paused;
  const btn=document.getElementById('pomoPauseBtn');
  if(btn)btn.innerText=pomoState.paused?'继续':'暂停';
}

function stopPomodoro(){
  if(pomoState.interval)clearInterval(pomoState.interval);
  if(pomoState.blinkInterval)clearInterval(pomoState.blinkInterval);
  pomoState.running=false;
  document.getElementById('pomodoroFullscreen').classList.remove('active');
}

          <span id="diaryPageNum" style="font-size:11px;color:#a08040;min-width:40px;text-align:center;"></span>
          <button id="diaryNextBtn" style="background:none;border:none;font-size:18px;cursor:pointer;color:#a08040;padding:4px 8px;" title="下一篇">›</button>
        </div>
      </div>
      <div class="notebook-body" id="diaryNbBody"></div>
    </div>
    <div id="diaryActionArea"></div>`;

  // 筛选标签点击
  el.querySelectorAll('[data-dtag]').forEach(chip=>{
    chip.onclick=()=>{
      diaryTagFilter=chip.dataset.dtag;
      _diaryPage=0;
      renderDiaries();
    };
  });
  // 新日记标签选择
  el.querySelectorAll('[data-ntag]').forEach(chip=>{
    chip.onclick=()=>{
      diaryNewTag=chip.dataset.ntag;
      el.querySelectorAll('[data-ntag]').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
    };
  });

  document.getElementById('diaryPrevBtn').onclick=()=>{
    const diaries=getFilteredDiaries();
    // page 0=写新日记, 1=第1篇(最新), 2=第2篇...
    if(_diaryPage>0){_diaryPage--;renderDiaryNbPage();}
  };
  document.getElementById('diaryNextBtn').onclick=()=>{
    const diaries=getFilteredDiaries();
    if(_diaryPage<diaries.length){_diaryPage++;renderDiaryNbPage();}
  };

  renderDiaryNbPage();
}

function renderDiaryNbPage(){
  const body=document.getElementById('diaryNbBody');if(!body)return;
  const actionArea=document.getElementById('diaryActionArea');
  const diaries=getFilteredDiaries();
  const allTags=getDiaryAllTags();
  const now=new Date();

  // 更新翻页状态
  const prevBtn=document.getElementById('diaryPrevBtn');
  const nextBtn=document.getElementById('diaryNextBtn');
  const pageNum=document.getElementById('diaryPageNum');
  const title=document.getElementById('diaryNbTitle');
  const date=document.getElementById('diaryNbDate');

  if(_diaryPage===0){
    // 写新日记
    const tagArea=document.getElementById('diaryNewTagArea');
    if(tagArea)tagArea.style.display='flex';
    prevBtn.style.opacity='0.3';prevBtn.style.pointerEvents='none';
    nextBtn.style.opacity=diaries.length?'1':'0.3';
    nextBtn.style.pointerEvents=diaries.length?'auto':'none';
    pageNum.textContent=diaries.length?`0/${diaries.length}`:'';
    title.textContent='📝 新日记';
    date.textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

    // 写入区——本子里只有纯粹的内容
    body.innerHTML=`<textarea id="diaryInput" placeholder="今天的故事…" style="width:100%;border:none;background:transparent;resize:none;font-family:inherit;font-size:14px;color:#3a2808;outline:none;line-height:32px;padding:0;min-height:224px;" rows="7"></textarea>`;
    if(actionArea)actionArea.innerHTML=`<button class="nb-add-outer-btn" onclick="saveDiaryNb()">保存日记</button>`;
  } else {
    // 查看历史日记
    const tagArea=document.getElementById('diaryNewTagArea');
    if(tagArea)tagArea.style.display='none';
    const d=diaries[_diaryPage-1];
    if(!d){_diaryPage=0;renderDiaryNbPage();return;}
    prevBtn.style.opacity=_diaryPage>0?'1':'0.3';
    prevBtn.style.pointerEvents=_diaryPage>0?'auto':'none';
    nextBtn.style.opacity=_diaryPage<diaries.length?'1':'0.3';
    nextBtn.style.pointerEvents=_diaryPage<diaries.length?'auto':'none';
    pageNum.textContent=`${_diaryPage}/${diaries.length}`;
    title.textContent=`📔 ${d.tag||'日记'}`;
    date.textContent=d.date;

    body.innerHTML=`<div style="line-height:32px;font-size:14px;color:#3a2808;white-space:pre-wrap;word-break:break-all;">${esc(d.t)}</div>`;
    if(actionArea)actionArea.innerHTML=`
      <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;">
        <button class="nb-add-outer-btn" style="padding:8px 20px;" onclick="editDiaryNb('${d.id}')">✏️ 编辑</button>
        <button class="nb-add-outer-btn" style="padding:8px 20px;border-color:#d96b55;color:#d96b55;" onclick="delDiaryConfirm('${d.id}')">🗑️ 删除</button>
      </div>`;
  }
}

function saveDiaryNb(){
  const t=document.getElementById('diaryInput').value.trim();
  if(!t){toast('还没写任何内容');return;}
  S.diaries.unshift({id:uid(),t,date:nowStr(),tag:diaryNewTag||'未分类'});
  save();_diaryPage=1;renderDiaries();toast('日记已存 ✓');
}

function editDiaryNb(id){
  const d=S.diaries.find(x=>x.id===id);if(!d)return;
  const allTags=getDiaryAllTags();
  const tagHtml=allTags.map(t=>`<div class="new-tag-opt${(d.tag||'未分类')===t?' on':''}" data-etag="${esc(t)}">${esc(t)}</div>`).join('');
  const body=`
    <div style="margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px">标签</div>
      <div class="new-tag-row" id="editDiaryTagRow">${tagHtml}</div>
    </div>
    <textarea id="editDiaryTA" rows="8">${esc(d.t)}</textarea>`;
  showModal('编辑日记',body,()=>{
    const val=document.getElementById('editDiaryTA').value.trim();if(!val)return;
    const sel=document.querySelector('#editDiaryTagRow .new-tag-opt.on');
    d.t=val;d.tag=sel?sel.dataset.etag:(d.tag||'未分类');
    save();closeModal();renderDiaryNbPage();toast('已保存 ✓');
  });
  setTimeout(()=>{
    document.querySelectorAll('#editDiaryTagRow .new-tag-opt').forEach(opt=>{
      opt.onclick=()=>{document.querySelectorAll('#editDiaryTagRow .new-tag-opt').forEach(o=>o.classList.remove('on'));opt.classList.add('on');};
    });
  },50);
}

// 兼容旧函数
function editDiary(id){editDiaryNb(id);}
function renderDiaryList(){renderDiaryNbPage();}
function delDiaryConfirm(id){confirmDel(()=>{S.diaries=S.diaries.filter(d=>d.id!==id);save();_diaryPage=Math.max(0,_diaryPage-1);renderDiaries();});}

function manageDiaryTags(){
  const body=(container)=>{
    const render=()=>{
      container.innerHTML=`
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input id="newDiaryTagInput" placeholder="新标签名称" style="flex:1">
          <button class="pbtn" id="addDiaryTagBtn">添加</button>
        </div>
        <div style="font-size:11px;color:var(--ink3);margin-bottom:8px">全部标签</div>
        <div id="customDiaryTagList"></div>`;
      let cHtml='';
      getDiaryAllTags().forEach((t,i)=>{
        cHtml+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(61,139,94,.06)">
          <span style="font-size:13px">${esc(t)}</span>
          <div style="display:flex;gap:6px"><button class="sbtn" data-edti="${i}">✏️</button><button class="delbtn" data-dti="${i}">🗑️</button></div>
        </div>`;
      });
      if(!cHtml)cHtml='<div style="color:var(--ink3);font-size:12px;padding:4px 0">还没有标签</div>';
      container.querySelector('#customDiaryTagList').innerHTML=cHtml;
      container.querySelector('#addDiaryTagBtn').onclick=()=>{
        const v=container.querySelector('#newDiaryTagInput').value.trim();
        if(!v)return;
        if(!S.diaryTags)S.diaryTags=[];
        if(S.diaryTags.includes(v)){toast('该标签已存在');return;}
        S.diaryTags.push(v);save();toast('已添加');render();
      };
      container.querySelectorAll('[data-dti]').forEach(btn=>{
        btn.onclick=()=>{const i=parseInt(btn.dataset.dti);confirmDel(()=>{S.diaryTags.splice(i,1);save();render();});};
      });
      container.querySelectorAll('[data-edti]').forEach(btn=>{
        btn.onclick=()=>{
          const i=parseInt(btn.dataset.edti);
          prompt1('编辑标签','标签名称',S.diaryTags[i],(val)=>{
            const oldTag=S.diaryTags[i];S.diaryTags[i]=val;
            S.diaries.forEach(d=>{if(d.tag===oldTag)d.tag=val;});
            save();render();
          });
        };
      });
    };
    render();
  };
  showModal('管理日记标签',body,null,null,{hideConfirm:true});
}

function getDisplayClarityQs(){return[...S.defaultClarityQs,...S.userClarityQs];}
let clarityRotate=null;
function startClarityRotate(){
  if(clarityRotate)clearInterval(clarityRotate);
  clarityRotate=setInterval(()=>{const qs=getDisplayClarityQs();if(qs.length){const idx=Math.floor(Date.now()/1800000)%qs.length;const q=document.getElementById('clarityQuestion');if(q)q.innerText=qs[idx];}},30000);
}

function renderDump(){
  const el=document.getElementById('recDump');
  el.innerHTML=`<textarea id="dumpInput" rows="4" placeholder="有什么不开心的都扔进来吧" style="margin-bottom:8px"></textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span id="clarityQuestion" style="font-size:12px;color:var(--g);cursor:pointer;text-decoration:underline;flex:1" onclick="openClarityModal()">加载中...</span><button class="pbtn" id="clearDumpBtn" style="margin-left:12px">🗑️ 清空</button></div><div class="section-divider"><div class="stl">📜 过往记录</div></div><div id="dumpHistory"></div>`;
  document.getElementById('clearDumpBtn').onclick=()=>{const t=document.getElementById('dumpInput').value.trim();if(t){S.emotions.unshift({id:uid(),t,date:nowStr()});save();renderDumpHistory();document.getElementById('dumpInput').value='';toast('已扔进垃圾桶');}};
  renderDumpHistory();
  const qs=getDisplayClarityQs();const qEl=document.getElementById('clarityQuestion');if(qEl&&qs.length)qEl.innerText=qs[0];
  startClarityRotate();
}
function renderDumpHistory(){
  const el=document.getElementById('dumpHistory');if(!el)return;
  if(!S.emotions.length){el.innerHTML='<div class="empty" data-icon="🌿">垃圾桶是空的</div>';return;}
  el.innerHTML=S.emotions.slice(0,8).map(e=>`<div class="si"><div class="si-date">${e.date}</div><div class="si-text">${esc(e.t)}</div><div class="si-acts"><button class="sbtn" onclick="editDump('${e.id}')">编辑</button><button class="delbtn" onclick="delDumpConfirm('${e.id}')">🗑️</button></div></div>`).join('');
}
function editDump(id){const e=S.emotions.find(x=>x.id===id);if(!e)return;showModal('编辑记录',`<textarea id="editDumpTA" rows="4">${esc(e.t)}</textarea>`,()=>{const val=document.getElementById('editDumpTA').value.trim();if(val){e.t=val;save();closeModal();renderDumpHistory();}});}
function delDumpConfirm(id){confirmDel(()=>{S.emotions=S.emotions.filter(e=>e.id!==id);save();renderDumpHistory();});}

function openClarityModal(){
  const renderBody=(container)=>{
    const render=()=>{
      container.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="newClarityInput" placeholder="新句子" style="flex:1"><button class="pbtn" id="addClarityBtn">添加</button></div><div id="clarityListInner"></div>`;
      let html='';
      S.userClarityQs.forEach((q,i)=>{html+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(61,139,94,.1)"><span style="font-size:13px">${esc(q)}</span><button class="delbtn" data-ci="${i}">🗑️</button></div>`;});
      if(S.defaultClarityQs.length){html+=`<div style="padding:8px 0 4px;font-size:11px;color:var(--ink3);font-weight:600">📌 默认提示句</div>`;S.defaultClarityQs.forEach(q=>{html+=`<div style="padding:6px 0;font-size:13px;color:var(--ink3)">${esc(q)}</div>`;});}
      container.querySelector('#clarityListInner').innerHTML=html;
      container.querySelectorAll('[data-ci]').forEach(btn=>{btn.onclick=()=>{const i=parseInt(btn.dataset.ci);confirmDel(()=>{S.userClarityQs.splice(i,1);save();render();});};});
      container.querySelector('#addClarityBtn').onclick=()=>{const txt=container.querySelector('#newClarityInput').value.trim();if(txt){S.userClarityQs.push(txt);save();toast('已添加');render();}};
    };
    render();
  };
  showModal('✏️ 编辑提示句',renderBody,null,null,{hideConfirm:true});
}

// ==================== 计划页面（本子版） ====================
let _planType='day';
const PLAN_TABS=[
  {key:'day',label:'今日',icon:'☀️'},
  {key:'week',label:'本周',icon:'📅'},
  {key:'month',label:'本月',icon:'🗓'},
  {key:'year',label:'今年',icon:'🎯'},
  {key:'archive',label:'存档',icon:'📁'},
];

function renderPlan(){
  _planType='day';
  const pc=document.getElementById('planContent');
  const now=new Date();
  pc.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;">
      ${PLAN_TABS.map(t=>`<div class="plan-outer-tab${t.key==='day'?' on':''}" data-pt="${t.key}" style="text-align:center;">${t.icon} ${t.label}</div>`).join('')}
      <button id="planFixedAddBtn" class="plan-outer-tab" style="text-align:center;background:var(--g);color:#fff;border-color:var(--g);cursor:pointer;">＋ 添加</button>
    </div>
    <div class="notebook-wrap" id="planNotebook">
      <div class="notebook-rings">${Array(6).fill('<div class="notebook-ring"></div>').join('')}</div>
      <div class="notebook-header">
        <div class="notebook-title" id="planNbTitle">☀️ 今日计划</div>
        <div class="notebook-date" id="planNbDate">${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日</div>
      </div>
      <div class="notebook-body" id="planNbBody"></div>
    </div>`;

  document.getElementById('planFixedAddBtn').addEventListener('click',()=>addNbPlanItem());

  pc.querySelectorAll('[data-pt]').forEach(tab=>{
    tab.addEventListener('click',()=>{
      pc.querySelectorAll('[data-pt]').forEach(t=>t.classList.remove('on'));
      tab.classList.add('on');
      _planType=tab.dataset.pt;
      const found=PLAN_TABS.find(t=>t.key===_planType);
      document.getElementById('planNbTitle').textContent=`${found.icon} ${found.label}`;
      const addBtn=document.getElementById('planFixedAddBtn');
      if(addBtn)addBtn.style.opacity=_planType==='archive'?'0.4':'1';
      if(_planType==='archive')renderPlanArchive();
      else renderPlanNbItems();
    });
  });

  renderPlanNbItems();
}

function renderPlanNbItems(){
  const body=document.getElementById('planNbBody');if(!body)return;
  const items=(S.plans[_planType]||[]);
  const done=items.filter(i=>i.done).length;
  body.innerHTML=`
    <div style="font-size:11px;color:var(--nb-ink3);line-height:32px;text-align:right;">完成 ${done}/${items.length}</div>
    ${items.length?items.map((item,idx)=>renderNbItem(item,idx)).join(''):'<div class="nb-empty">还没有计划，点右上角＋添加</div>'}`;
}

function renderNbItem(item,idx){
  const hasNote=item.note&&item.note.trim();
  const hasDue=item.due;
  const hasDate=item.planDate&&item.planDate!==td();
  return`<div class="nb-item${item.done?' done-nb':''}">
    <div class="nb-check${item.done?' done':''}" onclick="toggleNbPlan(${idx})">${item.done?'✓':''}</div>
    <div class="nb-content">
      <div class="nb-item-title${item.done?' done':''}">${esc(item.title||item.text||'')}</div>
      ${hasNote?`<div class="nb-item-note">${esc(item.note)}</div>`:''}
      ${hasDue?`<div class="nb-item-meta">⏰ 截止 ${item.due}</div>`:''}
      ${hasDate?`<div class="nb-item-meta">📅 计划于 ${item.planDate}</div>`:''}
    </div>
    <div class="nb-item-btns">
      <button onclick="moveNbToTask(${idx})" title="移到今日任务" style="color:var(--g);">→任务</button>
      <button onclick="editNbPlan(${idx})" title="编辑">✏️</button>
      <button onclick="deleteNbPlan(${idx})" title="删除" style="color:#c04040;">×</button>
    </div>
  </div>`;
}

function openNbPlanModal(existingIdx){
  const isEdit=existingIdx!==undefined;
  const item=isEdit?(S.plans[_planType][existingIdx]||{}):{};
  const body=(container)=>{
    container.innerHTML=`
      <div style="margin-bottom:10px;">
        <div style="font-size:12px;color:var(--ink3);margin-bottom:4px;">标题 *</div>
        <input id="nbPlanTitle" placeholder="计划标题" value="${esc(item.title||item.text||'')}">
      </div>
      <div style="margin-bottom:10px;">
        <div style="font-size:12px;color:var(--ink3);margin-bottom:4px;">详细内容 / 备注</div>
        <textarea id="nbPlanNote" rows="5" placeholder="可以写很具体的内容，比如：\n- 第一步做什么\n- 需要准备什么\n- 注意事项…" style="resize:vertical;">${esc(item.note||'')}</textarea>
      </div>
      <div>
        <div style="font-size:12px;color:var(--ink3);margin-bottom:4px;">截止日期（可选）</div>
        <input id="nbPlanDue" type="date" value="${item.due||''}">
      </div>`;
  };
  showModal(isEdit?'编辑计划':'新建计划',body,()=>{
    const title=document.getElementById('nbPlanTitle').value.trim();
    if(!title){toast('请填写标题');return;}
    const note=document.getElementById('nbPlanNote').value.trim();
    const due=document.getElementById('nbPlanDue').value;
    if(!S.plans[_planType])S.plans[_planType]=[];
    if(isEdit){
      S.plans[_planType][existingIdx]={...S.plans[_planType][existingIdx],title,note,due,text:title};
    }else{
      S.plans[_planType].push({id:uid(),title,note,due,text:title,done:false});
    }
    save();closeModal();renderPlanNbItems();toast(isEdit?'已更新 ✓':'已添加 ✓');
  });
}

function addNbPlanItem(){openNbPlanModal();}
function editNbPlan(idx){openNbPlanModal(idx);}

function moveNbToTask(idx){
  const item=S.plans[_planType][idx];if(!item)return;
  const title=item.title||item.text||'';
  showModal('移到今日任务',`
    <div style="font-size:13px;color:var(--ink2);margin-bottom:12px;">「${esc(title)}」</div>
    <div style="font-size:12px;color:var(--ink3);margin-bottom:8px;">选择优先级</div>
    <div class="priority-selector">
      <div class="priority-option p-red" data-p="red">🔴 重要</div>
      <div class="priority-option p-orange selected" data-p="orange">🟠 一般</div>
      <div class="priority-option p-green" data-p="green">🟢 随意</div>
    </div>`,
  ()=>{
    const sel=document.querySelector('.priority-option.selected[data-p]');
    const priority=sel?sel.dataset.p:'orange';
    S.tasks.push({id:uid(),date:td(),name:title,taskType:'💭 其他',priority,note:item.note||'',done:false});
    S.plans[_planType].splice(idx,1);
    save();closeModal();renderPlanNbItems();
    if(typeof renderTasks==='function')renderTasks();
    toast('已加入今日任务 ✓');
  });
  setTimeout(()=>{
    document.querySelectorAll('.priority-option[data-p]').forEach(opt=>{
      opt.onclick=()=>{
        document.querySelectorAll('.priority-option[data-p]').forEach(o=>o.classList.remove('selected'));
        opt.classList.add('selected');
      };
    });
  },50);
}

function toggleNbPlan(idx){
  const item=S.plans[_planType][idx];if(!item)return;
  if(!item.done){
    item.done=true;
    S.planArchives.unshift({id:uid(),type:_planType,content:item.title||item.text||'',note:item.note||'',date:nowStr()});
    S.plans[_planType].splice(idx,1);
    save();renderPlanNbItems();toast('✓ 已存档');
  }
}

function deleteNbPlan(idx){
  confirmDel(()=>{S.plans[_planType].splice(idx,1);save();renderPlanNbItems();});
}

function moveNbToToday(idx){
  const item=S.plans[_planType][idx];if(!item)return;
  if(!S.plans.day)S.plans.day=[];
  S.plans.day.push({id:uid(),title:item.title||item.text||'',note:item.note||'',due:item.due||'',text:item.title||item.text||'',done:false});
  S.plans[_planType].splice(idx,1);
  save();renderPlanNbItems();toast('已移至今日 ✓');
}

function renderPlanArchive(){
  const el=document.getElementById('planNbBody');if(!el)return;
  const archives=S.planArchives.slice(0,50);
  if(!archives.length){el.innerHTML='<div class="nb-empty">📭 还没有完成记录</div>';return;}
  el.innerHTML=`<div style="font-size:11px;color:#b0a070;margin-bottom:10px;">共 ${archives.length} 条完成记录</div>`+
    archives.map((a,i)=>`
    <div class="nb-item">
      <div style="font-size:16px;margin-top:2px;">✅</div>
      <div class="nb-content">
        <div class="nb-item-title">${esc((a.content||''))}</div>
        ${a.note?`<div class="nb-item-note">${esc(a.note)}</div>`:''}
        <div class="nb-item-meta">${a.date} · ${{day:'今日',week:'本周',month:'本月',year:'今年'}[a.type]||a.type}</div>
        <div class="nb-item-actions">
          <button class="sbtn" style="font-size:10px;padding:2px 8px;background:rgba(200,80,80,.1);color:#c04040;" onclick="delPlanArchive(${i})">删除</button>
        </div>
      </div>
    </div>`).join('');
}

function delPlanArchive(idx){
  confirmDel(()=>{S.planArchives.splice(idx,1);save();renderPlanArchive();});
}

// 兼容旧函数名
function addPlanItem(type){_planType=type;addNbPlanItem();}
function togglePlanItem(type,idx){_planType=type;toggleNbPlan(idx);}
function deletePlanItem(type,idx){_planType=type;deleteNbPlan(idx);}
function moveToToday(type,idx){_planType=type;moveNbToToday(idx);}

function showGrowTab(tab){
  const tabs=['habit','proj','self','ach'];
  tabs.forEach(t=>{const el=document.getElementById('grow'+t.charAt(0).toUpperCase()+t.slice(1));if(el)el.style.display=t===tab?'':'none';});

// ==================== 项目完成度计算（新规则） ====================
// 规则：有子项目 → 取所有子项目进度的平均值（递归到最底层）；无子项目 → 设了次数看是否达标，无限则打卡1次即100%
function getProjPercent(p){
  if(p.children&&p.children.length){
    const sum=p.children.reduce((s,c)=>s+getProjPercent(c),0);
    return Math.round(sum/p.children.length);
  }
  if(p.total>0){
    return Math.min(100,Math.round((p.done/p.total)*100));
  }
  // 无限次数：只要打卡过一次就算完成
  return p.done>0?100:0;
}
function isProjDone(p){return getProjPercent(p)>=100;}

// 项目树
function renderProjects(){
  const el=document.getElementById('growProj');if(!el)return;
  el.innerHTML=`<div id="projTree"></div><button class="addbtn" id="addRootProjBtn">+ 创建顶级项目</button>`;
  document.getElementById('addRootProjBtn').onclick=openRootProj;renderProjTree();
}
function toggleProjCollapse(id){if(collapsedProjs.has(id)){collapsedProjs.delete(id);}else{collapsedProjs.add(id);}renderProjTree();}
function renderProjTree(){
  const listDiv=document.getElementById('projTree');if(!listDiv)return;
  if(!S.projs.length){listDiv.innerHTML='<div class="empty" data-icon="📂">还没有项目</div>';return;}
  // 默认收起所有有子项目的节点
  function autoCollapse(nodes){
    nodes.forEach(p=>{
      if(p.children&&p.children.length>0){
        if(!collapsedProjs.has(p.id))collapsedProjs.add(p.id);
        autoCollapse(p.children);
      }
    });
  }
  // 只在第一次渲染时自动收起（之后用户手动展开的不再重置）
  if(!renderProjTree._inited){autoCollapse(S.projs);renderProjTree._inited=true;}

  let _colorIdx=0;
  function renderNode(p,level,idx,siblings){
    const hasChildren=p.children&&p.children.length>0;
    const percent=getProjPercent(p);
    const isCollapsed=collapsedProjs.has(p.id);
    const toggleIcon=hasChildren?(isCollapsed?'▶':'▼'):'';
    const hasNotes=p.notes && p.notes.length > 0;
    const countLabel=hasChildren
      ?`(${p.children.filter(c=>getProjPercent(c)>=100).length}/${p.children.length})`
      :`(${p.done}/${p.total||'∞'})`;

    let cardClass, colorClass='';
    if(level===0){
      cardClass='project-card-root';
    } else {
      cardClass=level===1?'project-card-child':'project-card-grandchild';
      colorClass='pc-'+(_colorIdx%5);
      _colorIdx++;
    }

    const movebtns=level===0?`
      <button class="sbtn" style="padding:2px 6px;font-size:12px;" onclick="moveProjUp(${idx})" ${idx===0?'disabled style="opacity:.3;padding:2px 6px;font-size:12px;"':''}>↑</button>
      <button class="sbtn" style="padding:2px 6px;font-size:12px;" onclick="moveProjDown(${idx})" ${idx===siblings-1?'disabled style="opacity:.3;padding:2px 6px;font-size:12px;"':''}>↓</button>`:'';

    return`<div class="${cardClass} ${colorClass}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        ${hasChildren?`<span onclick="toggleProjCollapse('${p.id}')" style="font-size:11px;color:var(--ink3);cursor:pointer;width:16px;flex-shrink:0;user-select:none">${toggleIcon}</span>`:'<span style="width:16px;flex-shrink:0"></span>'}
        <span style="flex:1;font-weight:${level===0?'700':'500'};font-size:${level===0?'15px':'14px'};cursor:${hasChildren?'pointer':'default'}" onclick="${hasChildren?`toggleProjCollapse('${p.id}')`:''}">${level===0?'📁 ':''}${esc(p.name)} <span style="font-size:12px;color:var(--ink3)">${countLabel}</span></span>
        ${movebtns}
        <button class="sbtn" onclick="editProjItem('${p.id}')">✏️</button>
        <button class="delbtn" onclick="delProjConfirm('${p.id}')">🗑️</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div><div style="font-size:11px;color:var(--ink3)">完成 ${percent}%</div>
      <div style="display:flex;gap:8px;margin:8px 0">
        ${hasChildren?'':`<button class="sbtn" onclick="checkInProj('${p.id}')">✅ 打卡</button>`}
        <button class="sbtn" onclick="openSubProj('${p.id}')">➕ 子项目</button>
        ${hasNotes?`<button class="sbtn" onclick="viewProjHistory('${p.id}')">📜 历史</button>`:''}
      </div>
      ${!isCollapsed&&hasChildren?`<div>${p.children.map((c,ci)=>renderNode(c,level+1,ci,p.children.length)).join('')}</div>`:(hasChildren?`<div style="font-size:11px;color:var(--ink3);padding:4px 0 2px">▶ ${p.children.length} 个子项目（已折叠）</div>`:'')}
    </div>`;
  }
  listDiv.innerHTML=S.projs.map((p,i)=>renderNode(p,0,i,S.projs.length)).join('');
}
function moveProjUp(idx){if(idx<=0)return;[S.projs[idx-1],S.projs[idx]]=[S.projs[idx],S.projs[idx-1]];save();renderProjTree();}
function moveProjDown(idx){if(idx>=S.projs.length-1)return;[S.projs[idx],S.projs[idx+1]]=[S.projs[idx+1],S.projs[idx]];save();renderProjTree();}
