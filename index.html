*{box-sizing:border-box;margin:0;padding:0;}
/* 让页面内容跟随字体大小设置 */
.pg, .pg div, .pg span, .pg p, .pg button, .pg input, .pg textarea, .pg select, .pg label{font-size:inherit;}
html{overscroll-behavior:none;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;max-width:500px;margin:0 auto;padding-bottom:84px;min-height:100vh;font-size:var(--base-font);line-height:1.55;overscroll-behavior:none;}
.hdr{background:var(--white);padding:14px 18px 12px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--g-border);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm);}
.hdr h1{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.3px;}
.hdr-date{font-size:11px;color:var(--ink3);margin-top:1px;}
.export-btn{background:var(--g-light);border:none;border-radius:20px;padding:5px 14px;font-size:12px;color:var(--g);cursor:pointer;font-weight:500;transition:background .15s;}
.export-btn:active{background:var(--g-mid);}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--g-border);display:flex;z-index:200;padding:6px 10px max(12px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.05);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 0;position:relative;transition:transform .12s;}
.ni:active{transform:scale(.92);}
.ni .ico{font-size:21px;transition:transform .15s;}
.ni .lbl{font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.2px;}
.ni.on .lbl{color:var(--g);font-weight:700;}
.ni.on .ico{transform:scale(1.15);}
.ni.on::after{content:'';position:absolute;bottom:-5px;left:28%;right:28%;height:2.5px;background:var(--g);border-radius:3px;}
.pg{display:none;padding:16px;}
.pg.active{display:block;}
.top-tabs{display:flex;justify-content:flex-start;gap:6px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--g-border);overflow-x:auto;scrollbar-width:none;}
.countdown-carousel{display:flex;align-items:center;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 42vw;margin:0 -20px 4px;scrollbar-width:none;}
.countdown-card{flex-shrink:0;scroll-snap-align:center;background:var(--card);border:1px solid var(--g-border);border-radius:var(--radius-md);padding:14px 18px;text-align:center;width:140px;transition:transform .25s,opacity .25s;opacity:.55;transform:scale(.8);cursor:pointer;}
.countdown-card.active{opacity:1;transform:scale(1.08);background:linear-gradient(135deg,var(--g),var(--g-dark));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(0,0,0,.18);}
.countdown-card .cd-title{font-size:13px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.countdown-card .cd-days{font-size:13px;}
.countdown-card .cd-days small{font-size:11px;opacity:.85;font-weight:400;}
.countdown-card .cd-num{font-size:26px;font-weight:800;margin:0 2px;}
.countdown-card.active .cd-num{font-size:32px;}
.lifebuoy-btn{display:block;margin:0 auto 16px;background:none;border:1px dashed var(--g-mid);color:var(--g-dark);border-radius:20px;padding:6px 16px;font-size:12px;cursor:pointer;}
.top-tabs::-webkit-scrollbar{display:none;}
.tab-main{background:rgba(255,255,255,.65);border:none;font-size:14px;font-family:inherit;cursor:pointer;padding:7px 14px;border-radius:30px;color:var(--ink2);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all .15s;font-weight:500;}
.tab-main.on{color:var(--g);font-weight:600;background:var(--g-light);}
.quote-box{background:linear-gradient(135deg,var(--nb-bg) 0%,var(--card) 100%);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-md);border:1px solid var(--nb-line);position:relative;overflow:hidden;}
.quote-box::before{content:'"';position:absolute;top:-10px;left:10px;font-size:72px;color:var(--nb-line);font-family:serif;line-height:1;pointer-events:none;}
.quote-txt{font-size:14px;color:var(--ink2);line-height:1.7;font-style:italic;padding-right:40px;}
.quote-edit-btn{position:absolute;bottom:10px;right:12px;background:var(--g-xlight);border:none;border-radius:16px;padding:3px 11px;font-size:11px;color:var(--g);cursor:pointer;}
.ti{background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid var(--g-border);box-shadow:var(--shadow-sm);transition:opacity .2s,background .2s;}
.ti.done{opacity:.55;background:var(--g-light);}
.chk{width:24px;height:24px;border:2px solid var(--g-mid);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:all .15s;}

.tn{flex:1;font-size:15px;font-weight:600;}
.priority-red{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;}
.priority-orange{width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;}
.priority-green{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.habit-card{background:var(--card);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--g-border);}

/* 交替色——子项目/孙项目都用这组，JS里用 colorIdx % 5 决定用哪个 */
.progress-bar{height:5px;background:var(--g-light);border-radius:3px;margin:8px 0 4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--g),#5db87a);width:0%;border-radius:3px;transition:width .3s;}
.ach-header{text-align:center;padding:20px 16px 16px;background:linear-gradient(135deg,var(--g-light),var(--white));border-radius:var(--radius-md);margin-bottom:16px;box-shadow:var(--shadow-sm);}

.ach-slogan{font-size:14px;color:var(--g);font-weight:600;margin-top:6px;cursor:pointer;letter-spacing:.5px;}

.addbtn{width:100%;padding:10px;background:var(--g-mid);border:1px solid var(--g-border);border-radius:var(--radius-sm);color:var(--g-dark);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.fab-btn{position:fixed;right:18px;bottom:96px;z-index:150;background:var(--g);color:#fff;border:none;border-radius:28px;padding:13px 20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22);display:flex;align-items:center;gap:6px;}
.fab-btn:active{opacity:.85;}
#growHabit,#growProj,#growAch{padding-bottom:70px;}
.addbtn:active{opacity:.8;}
.pbtn{padding:8px 16px;background:var(--g);color:#fff;border:none;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;font-size:13px;transition:background .15s;box-shadow:0 2px 8px var(--g-border);}
.pbtn:active{background:var(--g-dark);}
.sbtn{padding:4px 11px;background:var(--g-light);color:var(--g);border:none;border-radius:10px;font-size:11px;cursor:pointer;font-weight:500;}
.delbtn{background:transparent;border:none;color:#c97c5a;font-size:17px;cursor:pointer;padding:4px;}
/* 树形结构（计划/项目/今日任务）里"加子项/编辑/删除"这类次要操作，
   刻意做得比正文标题更轻、更淡，视觉重心留给真正重要的条目内容本身 */
.tree-action-btn{background:transparent;border:none;color:var(--ink3);font-size:11.5px;padding:3px 7px;cursor:pointer;font-weight:400;border-radius:8px;}
.plan-type-choice-btn{width:100%;background:var(--card);border:1.5px solid var(--g-mid);border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;color:var(--ink);}
.plan-type-choice-btn:active{background:var(--g-xlight);}
.tree-action-btn:active{background:var(--g-light);}
.tree-action-btn.danger{color:#c97c5a;}
.tree-action-btn.accent{color:var(--g);font-weight:500;}
.empty{text-align:center;padding:28px 12px;color:var(--ink2);font-size:13px;line-height:1.8;text-shadow:0 1px 3px rgba(255,255,255,.5);}
.empty::before{display:block;font-size:28px;margin-bottom:8px;content:attr(data-icon);}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:7px 20px;border-radius:40px;font-size:12px;opacity:0;transition:opacity .2s;z-index:500;white-space:nowrap;backdrop-filter:blur(8px);}
.toast.on{opacity:1;}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:.2s;backdrop-filter:blur(4px);}
.modal-mask.on{visibility:visible;opacity:1;}
.modal-container{background:var(--white);border-radius:var(--radius-lg);width:88%;max-width:360px;padding:22px 20px 18px;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-title{font-weight:700;margin-bottom:14px;font-size:16px;color:var(--ink);letter-spacing:-.2px;}
.modal-buttons{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
.modal-buttons button{padding:9px 20px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;}
.modal-cancel{background:var(--bg);border:1px solid var(--g-border);color:var(--ink2);}
.modal-confirm{background:var(--g);border:none;color:#fff;box-shadow:0 2px 8px var(--g-border);}
.priority-selector{display:flex;gap:8px;margin-top:6px;}
.priority-option{flex:1;padding:9px 6px;border-radius:var(--radius-sm);border:2px solid transparent;cursor:pointer;text-align:center;font-size:12px;background:var(--bg);transition:all .15s;font-weight:500;}
.priority-option.selected{border-color:var(--g);background:var(--g-light);}
.priority-option.p-red.selected{border-color:var(--red);background:#fff3f1;}
.priority-option.p-orange.selected{border-color:var(--orange);background:#fff8f2;}
.priority-option.p-green.selected{border-color:var(--green);background:var(--g-light);}
input,textarea,select{background:var(--bg);border:1.5px solid var(--g-border);border-radius:var(--radius-sm);padding:10px 12px;width:100%;font-family:inherit;font-size:14px;color:var(--ink);transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--g);background:var(--white);}
.task-section{margin-bottom:20px;}
.stl{font-weight:700;margin-bottom:10px;color:var(--ink2);font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
.fortune-trigger{background:linear-gradient(145deg,#1e1030,#120820);border-radius:var(--radius-md);padding:18px 16px;text-align:center;position:relative;margin:18px 0 4px;border:2px solid #e8c940;box-shadow:0 0 0 2px rgba(0,0,0,.2),0 0 0 3.5px #a07820,0 8px 24px rgba(0,0,0,.3),0 0 18px rgba(232,201,64,.4);}
.fortune-trigger-title{font-size:16px;font-weight:700;color:#e8c940;margin-bottom:12px;text-shadow:0 0 8px rgba(232,201,64,.5);letter-spacing:2px;}
.fortune-trigger-btn{background:linear-gradient(135deg,#e8c940,#f0a020);border:none;padding:9px 28px;border-radius:40px;font-size:13px;font-weight:700;color:#1e1030;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:transform .1s;}
.fortune-trigger-btn:active{transform:scale(.96);}
.fortune-edit-icon{position:absolute;top:-14px;right:-14px;background:var(--white);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-md);font-size:16px;z-index:10;border:1.5px solid #e8c940;}
.floating-card-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,5,20,.8);z-index:1000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity .3s;}
.floating-card-mask.active{visibility:visible;opacity:1;}
.floating-card{width:82%;max-width:360px;height:60%;max-height:460px;background:linear-gradient(145deg,#2a1a4a,#150a2a);border-radius:26px;border:2px solid #e8c940;box-shadow:0 0 0 3px rgba(0,0,0,.2),0 24px 48px rgba(0,0,0,.5),0 0 24px rgba(232,201,64,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;}
.floating-card.rotating{animation:card3DRotate 1.2s ease-in-out 2;}
@keyframes card3DRotate{0%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.floating-card .card-back{font-size:52px;color:#e8c940;text-shadow:0 0 12px rgba(232,201,64,.6);}
.floating-card .card-front{font-size:18px;font-weight:500;color:#f5e8b0;line-height:1.7;word-break:break-word;}
.floating-card .card-front.hide,.floating-card .card-back.hide{display:none;}
/* ===== Oracle 魔法卡牌新样式 ===== */
.floating-card{background:linear-gradient(160deg,#1a0a2e 0%,#2d1155 40%,#1a0a2e 100%)!important;border:2px solid #e8c940!important;box-shadow:0 0 0 3px rgba(0,0,0,.3),0 0 40px rgba(232,201,64,.5),0 24px 48px rgba(0,0,0,.6)!important;position:relative;overflow:hidden;}
.oracle-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.oracle-star{position:absolute;color:#e8c940;animation:starTwinkle 2s ease-in-out infinite;}
@keyframes starTwinkle{0%,100%{opacity:.2;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
.oracle-moon{position:absolute;font-size:22px;color:rgba(232,201,64,.3);animation:moonFloat 4s ease-in-out infinite;}
@keyframes moonFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.oracle-title{font-size:16px;font-weight:900;color:#e8c940;letter-spacing:4px;text-shadow:0 0 12px rgba(232,201,64,.7),0 0 24px rgba(232,201,64,.3);margin-bottom:4px;}
.oracle-subtitle{font-size:10px;color:rgba(232,201,64,.5);letter-spacing:2px;margin-bottom:14px;}
.oracle-divider{width:80%;height:1px;background:linear-gradient(90deg,transparent,#e8c940,transparent);margin:10px auto;opacity:.5;}
.oracle-msg-text{font-size:19px;font-weight:700;color:#f5e8c0;line-height:1.6;letter-spacing:.5px;text-shadow:0 0 8px rgba(245,232,192,.3);padding:0 8px;position:relative;z-index:1;}
#note-editor-page{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:400;overflow-y:auto;display:none;padding:16px;max-width:500px;margin:0 auto;}
#note-editor-page.active{display:block;}
.note-editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(61,139,94,.12);position:sticky;top:0;background:var(--bg);z-index:5;}
.note-editor-title{font-size:17px;font-weight:700;}
.note-editor-close,.note-editor-save{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;}
.note-editor-close{background:var(--g-light);color:var(--g);border:none;}
.note-editor-save{background:var(--g);color:white;border:none;margin-left:8px;box-shadow:0 2px 8px var(--g-border);}
.note-field-group{margin-bottom:14px;}
.note-field-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.3px;}
.note-input,.note-select{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--g-border);border-radius:var(--radius-sm);font-size:14px;}
.diary-style-textarea{width:100%;border:none;background:transparent;resize:none;font-family:inherit;font-size:14px;color:var(--nb-ink);outline:none;line-height:32px;padding:0;min-height:224px;overflow:hidden;}
.diary-style-textarea:focus{background:transparent;border:none;}
.note-basic-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--g-light);border:1px solid var(--g-border);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:14px;}
.note-basic-summary-text{font-size:13px;color:var(--ink2);line-height:1.5;}
.note-basic-summary-text b{color:var(--ink);}
.note-basic-edit-btn{background:var(--white);border:1px solid var(--g-border);border-radius:16px;padding:5px 12px;font-size:12px;color:var(--g-dark);cursor:pointer;flex-shrink:0;}
.attachment-area{background:var(--card);border-radius:var(--radius-md);padding:12px;margin-top:12px;border:1px dashed var(--g-border);}
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.quad-cell{background:var(--card);border-radius:var(--radius-md);padding:10px;min-height:150px;border:1.5px solid var(--g-border);}
.quad-cell-title{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:8px;}
.quad-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;border-bottom:1px solid var(--g-xlight);}
.quad-item.done .qi-text{opacity:.5;text-decoration:line-through;}
.quad-item input[type=checkbox]{flex-shrink:0;}
.quad-item .qi-text{flex:1;word-break:break-all;}
.quad-item .qi-del{color:var(--ink3);cursor:pointer;flex-shrink:0;font-size:12px;padding:0 2px;}
.quad-add-row{display:flex;gap:4px;margin-top:6px;}
.quad-add-row input{flex:1;min-width:0;border:1px solid var(--g-border);border-radius:8px;padding:4px 6px;font-size:12px;background:var(--white);}
.quad-add-row button{background:var(--g);color:#fff;border:none;border-radius:8px;padding:4px 8px;font-size:12px;flex-shrink:0;}
.checklist-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--g-xlight);}
.checklist-item.done .ci-text{opacity:.5;text-decoration:line-through;}
.checklist-item input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--g);}
.checklist-item .ci-text{flex:1;font-size:14px;word-break:break-all;}
.checklist-item .ci-del{color:var(--ink3);cursor:pointer;flex-shrink:0;font-size:16px;padding:0 4px;}
.checklist-add-row{display:flex;gap:8px;margin-top:12px;}
.checklist-add-row input{flex:1;min-width:0;border:1.5px solid var(--g-border);border-radius:8px;padding:9px 12px;font-size:14px;background:var(--white);}
.checklist-add-row button{background:var(--g);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;flex-shrink:0;}
.numlist-style-row{display:flex;gap:8px;margin-bottom:12px;}
.numlist-style-opt{flex:1;text-align:center;padding:7px 4px;border-radius:8px;border:1.5px solid var(--g-border);font-size:13px;color:var(--ink3);cursor:pointer;background:var(--card);}
.numlist-style-opt.on{background:var(--g);color:#fff;border-color:var(--g);}
.numlist-row{display:flex;gap:8px;align-items:flex-start;padding:5px 0;}
.numlist-marker{flex-shrink:0;min-width:24px;text-align:right;font-size:14px;color:var(--ink2);font-weight:700;padding-top:3px;user-select:none;}
.numlist-input{flex:1;min-width:0;border:none;background:transparent;resize:none;font-family:inherit;font-size:14px;color:var(--nb-ink);outline:none;line-height:1.6;padding:2px 0;overflow:hidden;}
.numlist-input:focus{background:transparent;border:none;padding:2px 0;}
.numlist-del{flex-shrink:0;color:var(--ink3);cursor:pointer;font-size:13px;padding:3px 4px;}
.attachment-buttons{display:flex;gap:10px;margin-bottom:10px;}
.attach-btn{background:var(--g-light);border:none;padding:7px 16px;border-radius:24px;font-size:12px;cursor:pointer;color:var(--g);font-weight:500;display:inline-block;}
.image-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.image-item{position:relative;width:68px;height:68px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg);}
.image-item img{width:100%;height:100%;object-fit:cover;}
.image-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.file-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:6px;}
.file-name{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;}
.file-del{background:none;border:none;color:var(--red);cursor:pointer;}
.note-card{background:var(--card);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;border:1px solid var(--g-border);cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .1s;}
.note-card:active{transform:scale(.99);box-shadow:var(--shadow-md);}
.note-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.note-type-badge{background:var(--g-light);color:var(--g);font-size:10px;padding:2px 9px;border-radius:20px;margin-left:6px;font-weight:500;}
.note-tags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0;}
.note-tag{background:var(--g-light);padding:2px 9px;border-radius:16px;font-size:10px;color:var(--g);}
.note-preview{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.search-wrapper{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
.search-bar{flex:1;padding:10px 16px;background:var(--white);border:1.5px solid var(--g-border);border-radius:30px;font-size:14px;}
.search-btn{background:var(--g-mid);border:1px solid var(--g-border);border-radius:30px;padding:9px 16px;font-size:14px;cursor:pointer;color:var(--g-dark);}
.note-tab-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.note-tab-bar::-webkit-scrollbar{display:none;}
.note-tab-btn{padding:7px 16px;background:var(--bg);border:none;border-radius:30px;font-size:13px;color:var(--ink3);white-space:nowrap;cursor:pointer;font-weight:500;flex-shrink:0;transition:all .15s;}
.note-tab-btn.on{background:var(--g);color:white;box-shadow:0 2px 8px var(--g-border);}
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.list-count{font-size:12px;color:var(--ink2);font-weight:600;background:var(--card);padding:5px 11px;border-radius:12px;box-shadow:var(--shadow-sm);}
.new-note-btn{background:var(--g-dark);border:none;padding:7px 16px;border-radius:24px;font-size:12px;color:white;cursor:pointer;font-weight:500;}
.section-divider{display:flex;align-items:center;gap:10px;margin:20px 0 12px;}
.section-divider .stl{margin:0;}
.section-divider::after{content:'';flex:1;height:1px;background:var(--g-border);}


.backup-reminder{background:linear-gradient(135deg,#fff8f0,#ffeedd);border:1.5px solid #f0c080;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.backup-reminder-text{flex:1;font-size:13px;color:#7a4a10;}
.backup-now-btn{background:#e8a030;border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap;}
/* ===== 日记条目样式 ===== */
/* ══ 主题选择器 ══ */
.th-grid{display:flex;flex-wrap:wrap;gap:16px 12px;}
.th-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;width:52px;}
.th-dot{width:38px;height:38px;border-radius:50%;border:2.5px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0;}
.th-dot:hover{transform:scale(1.1);}
.th-active{border-color:var(--ink)!important;transform:scale(1.08);box-shadow:0 0 0 2px var(--white),0 0 0 3px var(--ink);}
.th-name{font-size:10px;color:var(--ink3);text-align:center;width:52px;line-height:1.3;word-break:break-all;}
/* 设置面板指示点 */
.set-dot{width:8px;height:8px;border-radius:50%;background:var(--g-mid);cursor:pointer;transition:background .2s,transform .2s;}
.set-dot.on{background:var(--g);transform:scale(1.3);}
/* ══ 本子计划（颜色全部跟随主题的 --nb-* 变量） ══ */
.notebook-wrap{position:relative;background:var(--nb-bg);border-radius:var(--radius-md);box-shadow:3px 3px 0 rgba(0,0,0,.06),6px 6px 0 rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.12);margin:0 2px;overflow:hidden;}
/* 给内含"自动增高textarea"的场景用：不裁切，避免高度计算稍有偏差时把底部文字和横线一起藏起来 */
.notebook-wrap-grow{position:relative;background:var(--nb-bg);border-radius:var(--radius-md);box-shadow:3px 3px 0 rgba(0,0,0,.06),6px 6px 0 rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.12);margin:0 2px;overflow:visible;}
.notebook-wrap::before{content:'';position:absolute;left:28px;top:0;bottom:0;width:1.5px;background:var(--nb-line);z-index:1;}
.notebook-rings{position:absolute;left:18px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;padding:24px 0;pointer-events:none;z-index:2;}
.notebook-ring{width:10px;height:10px;border-radius:50%;border:2px solid var(--nb-ink3);background:var(--nb-bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);}
.notebook-header{background:var(--nb-bg);padding:12px 14px 10px 38px;border-bottom:1.5px solid var(--nb-line);}
.notebook-title{font-size:15px;font-weight:700;color:var(--nb-ink2);letter-spacing:.5px;}
.notebook-date{font-size:10px;color:var(--nb-ink3);margin-top:2px;}
/* 32px格子：31px内容 + 1px线，所有文字行高都是32px */
.notebook-body{padding:0 14px 20px 38px;background:repeating-linear-gradient(180deg,transparent,transparent 31px,var(--nb-line) 31px,var(--nb-line) 32px);min-height:calc(100vh - 280px);}
.nb-item{padding:0;border:none;display:flex;align-items:flex-start;gap:8px;margin-bottom:2px;}
.nb-item-child{margin-left:13px;padding-left:11px;border-left:2px solid var(--nb-line);margin-top:2px;}
.nb-check{width:18px;height:18px;border:1.5px solid var(--nb-ring);border-radius:4px;flex-shrink:0;margin-top:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--nb-ink2);background:var(--white);}
.nb-check.done{background:var(--nb-ring);border-color:var(--nb-ring);color:#fff;}
.nb-content{flex:1;min-width:0;}
.nb-item-title{font-size:15px;font-weight:600;color:var(--nb-ink);line-height:1.5;min-height:auto;padding:4px 0;}
.nb-item-title.done{text-decoration:line-through;color:var(--nb-ink3);}
.nb-item-note{font-size:12px;color:var(--nb-ink3);line-height:32px;white-space:pre-wrap;margin:0;padding:0;}
.nb-item-meta{font-size:10px;color:var(--nb-ink3);line-height:32px;height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-empty{text-align:center;padding:96px 0 0;color:var(--nb-ink3);font-size:13px;line-height:32px;}
.nb-item-actions{display:flex;gap:6px;height:32px;align-items:center;}
/* tab在本子外面 */
.plan-outer-tab{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:var(--ink3);background:var(--card);border:1.5px solid var(--g-mid);cursor:pointer;transition:all .15s;}

function applyTheme(id){
  document.body.className=document.body.className.replace(/\bt-\S+/g,'').trim();
  if(id&&id!=='green') document.body.classList.add('t-'+id);
  localStorage.setItem('myu_theme',id||'green');
}
function loadTheme(){
  const removedThemes=['datang2','xia','summer-bite','cinnabar-sky','lotus-mist'];
  let t=localStorage.getItem('myu_theme')||'green';
  if(removedThemes.includes(t)){t='green';localStorage.setItem('myu_theme','green');}
  applyTheme(t);
}

function load(){
  try{let d=localStorage.getItem('myu_final_v10');if(d){let p=JSON.parse(d);Object.assign(S,p);}}catch(e){}
  if(!S.userQuotes)S.userQuotes=[];
  if(!S.userClarityQs)S.userClarityQs=[];
  if(!S.planArchives)S.planArchives=[];
  if(!S.notes)S.notes=[];
  if(!S.fortuneMessages)S.fortuneMessages=[];
  if(!S.fortuneRecords)S.fortuneRecords=[];
  if(!S.diaryTags||!Array.isArray(S.diaryTags))S.diaryTags=['心态','日常','干货'];
  if(!S.taskTypes||!Array.isArray(S.taskTypes)||!S.taskTypes.length)S.taskTypes=['📚 学习','💼 工作','🎨 爱好','🏠 家务','💬 交际','💭 其他'];
  if(!S.noteTypes||!Array.isArray(S.noteTypes)||!S.noteTypes.length)S.noteTypes=['📌 收藏','🎬 书影','✍️ 素材','📝 通用'];
  if(!S.selfNoteCats||!Array.isArray(S.selfNoteCats)||!S.selfNoteCats.length)S.selfNoteCats=['性格','情绪','习惯','价值观'];
  if(!S.tasks)S.tasks=[];
  if(!S.plans||typeof S.plans!=='object'||Array.isArray(S.plans)){
    S.plans={day:[],week:[],month:[],year:[]};
  }else{
    if(!Array.isArray(S.plans.day))S.plans.day=[];
    if(!Array.isArray(S.plans.week))S.plans.week=[];
    if(!Array.isArray(S.plans.month))S.plans.month=[];
    if(!Array.isArray(S.plans.year))S.plans.year=[];
  }
  // 日计划恢复为独立计划类型，不再自动搬进"今日任务"
  if(!S.lastBackupReminder)S.lastBackupReminder=0;
  if(!S.quoteIntervalMinutes)S.quoteIntervalMinutes=30;
  // ==== 第一批新功能：数据初始化 ====
  if(!S.memos)S.memos=[]; // 快速备忘（已废弃，仅保留兼容旧备份）：[{id,text,createdAt}]
  if(S.diaryDraft===undefined)S.diaryDraft='';
  if(S.noteEditDraft===undefined)S.noteEditDraft=null;
  if(!S.countdowns)S.countdowns=[]; // 倒数日：[{id,title,date,isMain}]
  // ==== 阶段日程：数据迁移 ====
  if(!S.phases)S.phases=[];
  if(!S.lastPhaseReminderShown)S.lastPhaseReminderShown='';
  (S.goodH||[]).forEach(h=>{
    // 老习惯（21格打卡）自动升级成"每天型"，从今天开始重新记连续天数；
    // 老的 records 数据保留在存储里不会丢，只是新版不再显示那种格子
    if(!h.repeatType)h.repeatType='daily';
    if(!h.everyN)h.everyN=3;
    if(typeof h.defaultWeekday!=='number')h.defaultWeekday=1;
    if(h.phaseId===undefined)h.phaseId=null;
    if(!h.log)h.log={};
    if(!h.weekOverrides)h.weekOverrides={};
    if(!h.restRanges)h.restRanges=[];
  });
  rolloverPlanPeriods();
  pruneExpiredPlans();
}
// 周/月/年计划：截止日期一过，自动清除（不再需要手动删除）
function pruneExpiredPlans(){
  if(!S.plans)return;
  const t=td();
  let changed=false;
  const prune=(list)=>{
    return list.filter(item=>{
      if(item.children&&item.children.length){
        const before=item.children.length;
        item.children=prune(item.children);
        if(item.children.length!==before)changed=true;
      }
      if(item.due&&item.due<t){changed=true;return false;}
      return true;
    });
  };
  ['week','month','year'].forEach(type=>{
    if(Array.isArray(S.plans[type]))S.plans[type]=prune(S.plans[type]);
  });
  if(changed)save();
}
function save(){
  try{
    localStorage.setItem('myu_final_v10',JSON.stringify(S));
  }catch(e){
    alert('⚠️ 保存失败！可能是本地存储空间已满（通常是附件图片太大/太多导致）。\n\n请立刻用「设置→导出备份」把当前内容导出保存一份，再清理一些图片附件后重试。\n\n错误详情：'+e.message);
  }
  pushToCloud();
}
function uid(){return Date.now()+'-'+Math.random().toString(36).substr(2,6);}

// ==================== 云同步 ====================
const FIREBASE_CONFIG={
  apiKey:"AIzaSyD9rVQ7yJmx80WQjH_ISNt_mX9dTAktT_0",
  authDomain:"my-universe-b9ae7.firebaseapp.com",
  projectId:"my-universe-b9ae7",
  storageBucket:"my-universe-b9ae7.firebasestorage.app",
  messagingSenderId:"498187009094",
  appId:"1:498187009094:web:aa3456ad75da4158e01e47",
  measurementId:"G-Y9B63D9D5T"
};
let _fbApp=null,_fbDb=null,_syncUnsub=null,_syncPushTimer=null,_applyingRemoteUpdate=false,_lastPushedAt=0;
function getSyncCode(){return localStorage.getItem('myu_sync_code')||'';}
function setSyncCode(code){if(code)localStorage.setItem('myu_sync_code',code);else localStorage.removeItem('myu_sync_code');}
function isFirebaseAvailable(){return typeof firebase!=='undefined';}
function initFirebase(){
  if(_fbApp)return true;
  if(!isFirebaseAvailable())return false;
  try{_fbApp=firebase.initializeApp(FIREBASE_CONFIG);_fbDb=firebase.firestore();return true;}
  catch(e){console.error('Firebase 初始化失败',e);return false;}
}
function generateRandomSyncCode(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // 去掉容易看混的 0/O/1/I/L
  let s='';for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function updateSyncStatusUI(text){const el=document.getElementById('syncStatusText');if(el)el.innerText=text;}
function refreshAllVisibleContent(){
  try{renderToday();}catch(e){}
  try{renderRecord();}catch(e){}
  try{renderPlan();}catch(e){}
  try{renderGrow();}catch(e){}
  try{renderNoteList();}catch(e){}
}
function pushToCloud(){
  if(!getSyncCode()||_applyingRemoteUpdate)return;
  clearTimeout(_syncPushTimer);
  _syncPushTimer=setTimeout(()=>{
    if(!initFirebase()){updateSyncStatusUI('☁️ 云同步暂时连不上（网络问题）');return;}
    const code=getSyncCode();if(!code||!_fbDb)return;
    const now=Date.now();_lastPushedAt=now;
    _fbDb.collection('syncData').doc(code).set({data:JSON.stringify(S),updatedAt:now}).then(()=>{
      updateSyncStatusUI('已同步 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
    }).catch(e=>{updateSyncStatusUI('同步失败：'+e.message);});
  },1500); // 防抖：1.5秒内的多次改动合并成一次上传，不用每敲一个字就传一次
}
// 每次要用云端/对方数据覆盖本地之前，先把"覆盖前"的本地数据存一份快照，防止覆盖错了没法回头
function backupBeforeOverwrite(){
  try{
    localStorage.setItem('myu_pre_overwrite_backup',JSON.stringify({data:S,savedAt:Date.now()}));
  }catch(e){console.error('覆盖前备份失败',e);}
}
function getPreOverwriteBackupInfo(){
  try{
    const raw=localStorage.getItem('myu_pre_overwrite_backup');
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    return{savedAt:parsed.savedAt};
  }catch(e){return null;}
}
function restorePreOverwriteBackup(){
  const raw=localStorage.getItem('myu_pre_overwrite_backup');
  if(!raw){toast('没有可恢复的备份');return;}
  showModal('恢复到覆盖前的状态',`<p style="color:var(--ink2);font-size:14px;line-height:1.7;">会把数据恢复到"上一次同步覆盖之前"的状态。这台设备现在的内容会被替换掉，确定吗？</p>`,()=>{
    try{
      const parsed=JSON.parse(raw);
      Object.keys(S).forEach(k=>delete S[k]);
      Object.assign(S,parsed.data);
      localStorage.setItem('myu_final_v10',JSON.stringify(S));
      closeModal();refreshAllVisibleContent();toast('已恢复到覆盖前的状态 ✓');renderSyncPanel();
    }catch(e){toast('恢复失败：'+e.message);}
  },null,{showCancel:true});
}
function startSyncListener(code){
  if(!initFirebase()){updateSyncStatusUI('☁️ 云同步暂时连不上（网络问题），本地数据不受影响');return;}
  if(_syncUnsub){_syncUnsub();_syncUnsub=null;}
  _syncUnsub=_fbDb.collection('syncData').doc(code).onSnapshot(docSnap=>{
    if(!docSnap.exists)return;
    const remote=docSnap.data();
    if(!remote||!remote.data)return;
    if(remote.updatedAt&&remote.updatedAt<=_lastPushedAt)return; // 这是自己刚推上去的，不用理会
    // 不再自动覆盖本地数据！只做提醒，由你自己决定要不要拉取——
    // 之前"自动判断谁更新"的做法被证明不可靠（哪怕只是打开App看看，也可能被误判成"这台设备更新"）
    _cloudHasUnpulledUpdate=true;
    updateSyncStatusUI('☁️ 云端有新的更新，点"⬇️ 从云端拉取"同步过来');
    showCloudUpdateBanner();
  },err=>{updateSyncStatusUI('监听失败：'+err.message);});
}
let _cloudHasUnpulledUpdate=false;
function showCloudUpdateBanner(){
  if(document.getElementById('cloudUpdateBanner'))return; // 已经显示了，不重复弹
  const el=document.createElement('div');
  el.id='cloudUpdateBanner';
  el.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:600;background:var(--g-dark);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;max-width:90%;';
  el.innerHTML=`<span>☁️ 云端有新更新</span><button style="background:#fff;color:var(--g-dark);border:none;border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;" onclick="pullFromCloudExplicit();this.parentElement.remove();">拉取</button><span style="cursor:pointer;opacity:.8;" onclick="this.parentElement.remove()">✕</span>`;
  document.body.appendChild(el);
}
function connectNewSyncCode(){
  if(!initFirebase()){toast('云同步暂时连不上，检查一下网络（国内可能需要能访问 Google 服务的网络环境）');return;}
  const code=generateRandomSyncCode();
  const now=Date.now();_lastPushedAt=now;
  _fbDb.collection('syncData').doc(code).set({data:JSON.stringify(S),updatedAt:now}).then(()=>{
    setSyncCode(code);
    startSyncListener(code);
    toast('同步码已生成 ✓');
    renderSyncPanel();
  }).catch(e=>{toast('创建失败：'+e.message);});
}
function joinSyncCode(inputCode){
  const code=(inputCode||'').trim().toUpperCase();
  if(!code){toast('请输入同步码');return;}
  if(!initFirebase()){toast('云同步暂时连不上，检查一下网络（国内可能需要能访问 Google 服务的网络环境）');return;}
  _fbDb.collection('syncData').doc(code).get().then(docSnap=>{

function formatDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function formatNoteTime(ts){
  const d=new Date(ts);
  const cur=new Date().getFullYear();
  const y=d.getFullYear()===cur?'':d.getFullYear()+'/';
  return `${y}${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDateShort(s){if(!s)return s;const cur=String(new Date().getFullYear());return s.startsWith(cur+'-')?s.slice(5):s;}
// 解析 nowStr() 格式的字符串，如"2026/8/8 21:24"，用于统计页面按日期归类日记/项目打卡
function parseNowStr(s){
  if(!s)return null;
  const m=String(s).match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(!m)return null;
  const dateKey=`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  return{dateKey};
}
function td(){return formatDate(new Date());}
function nowStr(){let d=new Date();return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function autoGrow(el){if(!el)return;el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function bindAutoGrow(el){
  if(!el)return;
  // 用 requestAnimationFrame 延后到下一帧再量高度：
  // 如果这时候页面还是 display:none（刚从隐藏切到显示的过渡瞬间），量出来的高度会是 0，
  // 之前的写法在这种情况下会把输入框错误地"锁"成一个偏矮的高度，
  // 打字打到后面文字/横线超出这个高度就会被裁掉、看起来像"消失了"。
  requestAnimationFrame(()=>requestAnimationFrame(()=>autoGrow(el)));
  el.oninput=()=>autoGrow(el);
}

// 通用：给输入框绑定"停止输入约1.2秒后自动保存草稿"，避免误退出导致内容丢失。
// 会叠加在已有的 oninput 处理上（比如自动增高），不会把原有的覆盖掉。
function bindDraftAutosave(el,onSave,delay){
  if(!el)return;
  delay=delay||1200;
  let timer=null;
  const existing=el.oninput;
  el.oninput=(e)=>{
    if(typeof existing==='function')existing(e);
    if(timer)clearTimeout(timer);
    timer=setTimeout(()=>onSave(el.value),delay);
  };
}

let modalStack=[];
function openModal(){document.getElementById('globalModal').classList.add('on');}
function closeModal(){
  modalStack.pop();
  if(modalStack.length>0){
    let prev=modalStack[modalStack.length-1];
    _renderModal(prev.title,prev.body,prev.onConfirm,prev.onCancel,prev.confirmText,prev.cancelText,prev.hideConfirm,prev.showCancel);
    openModal();
  }else{document.getElementById('globalModal').classList.remove('on');}
}
function _renderModal(title,body,onConfirm,onCancel,confirmText,cancelText,hideConfirm,showCancel){
  document.getElementById('modalTitle').innerText=title;
  document.getElementById('modalBody').innerHTML=typeof body==='string'?body:'';
  if(typeof body==='function')body(document.getElementById('modalBody'));
  const btnsDiv=document.getElementById('modalButtons');btnsDiv.innerHTML='';
  if(showCancel){
    const cancelBtn=document.createElement('button');
    cancelBtn.innerText=cancelText||'取消';cancelBtn.className='modal-cancel';
    cancelBtn.onclick=()=>{if(onCancel)onCancel();closeModal();};
    btnsDiv.appendChild(cancelBtn);
  }
  if(!hideConfirm){
    const confirmBtn=document.createElement('button');
    confirmBtn.innerText=confirmText||'确认';confirmBtn.className='modal-confirm';
    confirmBtn.onclick=()=>{if(onConfirm)onConfirm();};
    btnsDiv.appendChild(confirmBtn);
  }
}
function showModal(title,body,onConfirm,onCancel,opts={}){
  const config={title,body,onConfirm,onCancel,confirmText:opts.confirmText,cancelText:opts.cancelText,hideConfirm:opts.hideConfirm,showCancel:opts.showCancel};
  modalStack.push(config);
  _renderModal(title,body,onConfirm,onCancel,opts.confirmText,opts.cancelText,opts.hideConfirm,opts.showCancel);
  openModal();
}

const _pageInited={};
let _touchStartY=0;
document.addEventListener('touchstart',e=>{_touchStartY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchmove',e=>{
  const atTop=(window.scrollY||document.documentElement.scrollTop)<=0;
  const movingDown=e.touches[0].clientY-_touchStartY>0;
  if(!atTop||!movingDown)return;
  // 手指如果是在一个自己能滚动的小区域里（弹窗内的长列表、设置面板等），不要拦截，
  // 否则会连带把这些地方原本正常的滚动也一起挡住
  let el=e.target;
  while(el&&el!==document.body){
    if(el.scrollHeight>el.clientHeight+2){const cs=getComputedStyle(el);if(cs.overflowY==='auto'||cs.overflowY==='scroll')return;}
    el=el.parentElement;
  }
  e.preventDefault();
},{passive:false});
function switchPage(pageId){

let quoteRotateInterval=null;
function getDisplayQuotes(){return[...S.userQuotes,...S.defaultQuotes];}
function getQuoteInterval(){
  // 单位：毫秒，默认30分钟
  return (S.quoteIntervalMinutes||30)*60*1000;
}
function startQuoteRotate(){
  if(quoteRotateInterval)clearInterval(quoteRotateInterval);
  const interval=getQuoteInterval();
  let lastIdx=-1;
  let lastSwitchAt=Date.now();
  quoteRotateInterval=setInterval(()=>{
    if(Date.now()-lastSwitchAt<interval)return; // 还没到设定的切换间隔，先不换
    lastSwitchAt=Date.now();
    const qs=getDisplayQuotes();
    if(qs.length>=2){
      let idx=Math.floor(Math.random()*qs.length);
      if(idx===lastIdx)idx=(idx+1)%qs.length; // 避免连续两次抽到同一条
      lastIdx=idx;
      const q=document.getElementById('quoteEl');
      if(q)q.innerHTML=`"${esc(qs[idx])}"`;
    }
  },Math.min(interval,60000)); // 最多每分钟检查一次是否到点该换了
}

function daysUntil(dateStr){
  const target=new Date(dateStr+'T00:00:00');
  const today=new Date(td()+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function renderCountdownSection(){
  const el=document.getElementById('countdownSection');if(!el)return;
  if(!S.countdowns.length){
    el.innerHTML=`<button class="addbtn" style="margin-bottom:16px;" onclick="openAddCountdownModal()">+ 添加倒数日</button>`;
    return;
  }
  const main=S.countdowns.find(c=>c.isMain)||S.countdowns[0];
  const others=S.countdowns.filter(c=>c.id!==main.id);
  const half=Math.ceil(others.length/2);
  const ordered=[...others.slice(0,half).reverse(),main,...others.slice(half)];
  const dayText=(d)=>{
    if(d>0)return `<small>还有</small><span class="cd-num">${d}</span><small>天</small>`;
    if(d===0)return `<span class="cd-num">就是今天！</span>`;
    return `<small>已过</small><span class="cd-num">${-d}</span><small>天</small>`;
  };
  el.innerHTML=`
    <div class="countdown-carousel" id="countdownCarousel">
      ${ordered.map(c=>`
        <div class="countdown-card${c.id===main.id?' active':''}" data-cdid="${c.id}" onclick="openCountdownManage()">
          <div class="cd-title">${esc(c.title)}</div>
          <div class="cd-days">${dayText(daysUntil(c.date))}</div>
        </div>`).join('')}
    </div>`;
  bindCountdownCarousel();
}
function bindCountdownCarousel(){
  const carousel=document.getElementById('countdownCarousel');if(!carousel)return;
  const cards=Array.from(carousel.querySelectorAll('.countdown-card'));
  const activeCard=carousel.querySelector('.countdown-card.active');
  if(activeCard)setTimeout(()=>activeCard.scrollIntoView({inline:'center',block:'nearest'}),50);
  let ticking=false;
  const updateActive=()=>{
    const carouselRect=carousel.getBoundingClientRect();
    const centerX=carouselRect.left+carouselRect.width/2;
    let closest=null,closestDist=Infinity;
    cards.forEach(c=>{
      const r=c.getBoundingClientRect();
      const dist=Math.abs((r.left+r.width/2)-centerX);
      if(dist<closestDist){closestDist=dist;closest=c;}
    });
    cards.forEach(c=>c.classList.toggle('active',c===closest));
    ticking=false;
  };
  carousel.addEventListener('scroll',()=>{
    if(!ticking){requestAnimationFrame(updateActive);ticking=true;}
  },{passive:true});
}

function renderTasks(){
  const today=td();const tasks=S.tasks.filter(t=>t.date===today);

  container.innerHTML=tasks.map(t=>renderTaskItem(t,0)).join('');
}
function isTaskDone(t){
  if(t.children&&t.children.length)return t.children.every(isTaskDone);
  if(t.total>0)return (t.doneCount||0)>=t.total;
  return !!t.done;
}
let collapsedTasks=new Set();
function toggleTaskCollapse(id){if(collapsedTasks.has(id))collapsedTasks.delete(id);else collapsedTasks.add(id);renderTasks();}
function renderTaskItem(t,level){
  level=level||0;
  const hasChildren=t.children&&t.children.length>0;
  const isCollapsed=collapsedTasks.has(t.id);
  const childDone=hasChildren?t.children.filter(isTaskDone).length:0;
  const isCounter=!hasChildren&&t.total>0;
  const done=hasChildren?(childDone===t.children.length):(isCounter?(t.doneCount||0)>=t.total:t.done);
  return`<div class="ti ${done?'done':''}" style="display:flex;flex-direction:column;align-items:stretch;gap:6px;${level>0?'margin-left:'+Math.min(level,4)*14+'px;':''}">
    <div style="display:flex;align-items:center;gap:8px;">
      ${hasChildren?
        `<span onclick="toggleTaskCollapse('${t.id}')" style="cursor:pointer;font-size:11px;color:var(--ink3);width:14px;flex-shrink:0;user-select:none;">${isCollapsed?'▶':'▼'}</span><div class="chk" style="font-size:9px;">${childDone}/${t.children.length}</div>`
        :isCounter?
        `<span style="width:14px;flex-shrink:0;"></span><div class="chk" style="font-size:9px;${done?'background:var(--g);color:#fff;':''}">${t.doneCount||0}/${t.total}</div>`
        :`<span style="width:14px;flex-shrink:0;"></span><div class="chk ${t.done?'on':''}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</div>`}
      <div style="flex:1">
        <div class="tn" style="${done?'text-decoration:line-through':''}">${esc(t.name)}</div>
        ${t.taskType||t.note?`<div style="font-size:11px;color:var(--ink3);margin-top:2px">${t.taskType?`<span style="background:var(--g-light);color:var(--g);padding:1px 8px;border-radius:10px;margin-right:5px;font-weight:500">${t.taskType}</span>`:''}${t.note?esc(t.note):''}</div>`:''}
        ${hasChildren?`<div style="background:var(--g-xlight);border-radius:6px;height:5px;margin-top:6px;overflow:hidden;"><div style="background:var(--g);height:100%;width:${Math.round(childDone/t.children.length*100)}%;"></div></div>`:''}
        ${isCounter?`<div style="background:var(--g-xlight);border-radius:6px;height:5px;margin-top:6px;overflow:hidden;"><div style="background:var(--g);height:100%;width:${Math.min(100,Math.round((t.doneCount||0)/t.total*100))}%;"></div></div>`:''}
      </div>
      <div class="priority-${t.priority||'green'}"></div>
    </div>
    <div style="display:flex;gap:2px;justify-content:flex-end;flex-wrap:wrap;">
      ${isCounter?`<button class="tree-action-btn accent" onclick="checkInTask('${t.id}')" ${done?'style="opacity:.4;pointer-events:none;"':''}>✅ 打卡 +1</button>${(t.doneCount||0)>0?`<button class="tree-action-btn" onclick="undoCheckInTask('${t.id}')">↩️ 撤销</button>`:''}`:''}
      <button class="tree-action-btn" onclick="openAddChildTaskModal('${t.id}')">➕ 子任务</button>
      <button class="tree-action-btn" onclick="editTask('${t.id}')">✏️ 编辑</button>
      <button class="tree-action-btn danger" onclick="delTaskConfirm('${t.id}')">🗑️</button>
    </div>
    ${!isCollapsed&&hasChildren?`<div>${t.children.map(c=>renderTaskItem(c,level+1)).join('')}</div>`:(hasChildren?`<div style="font-size:11px;color:var(--ink3);padding:2px 0 2px 22px;">▶ ${t.children.length} 项子任务（已折叠）</div>`:'')}
  </div>`;
}
function checkInTask(id){
  const t=findTaskItem(id);if(!t)return;
  if(t.children&&t.children.length)return;
  if(t.total>0&&(t.doneCount||0)>=t.total){toast('已完成全部目标！');return;}
  t.doneCount=(t.doneCount||0)+1;
  save();renderTasks();toast(`+1 ${t.name}`);
}
function undoCheckInTask(id){
  const t=findTaskItem(id);if(!t)return;
  if(!t.doneCount||t.doneCount<=0)return;
  t.doneCount--;
  save();renderTasks();toast('已撤销');
}
function findTaskItem(id,list){
  list=list||S.tasks;
  for(const t of list){
    if(t.id===id)return t;
    if(t.children&&t.children.length){
      const found=findTaskItem(id,t.children);
      if(found)return found;
    }
  }
  return null;
}
function findTaskParentArray(id,list){
  list=list||S.tasks;
  for(let i=0;i<list.length;i++){
    if(list[i].id===id)return list;
    if(list[i].children&&list[i].children.length){
      const found=findTaskParentArray(id,list[i].children);
      if(found)return found;
    }
  }
  return null;
}
function openAddChildTaskModal(parentId){
  const body=`<div class="note-field-group"><div class="note-field-label">子任务名称</div><input id="childTaskName" placeholder="例如：第一步"></div>
    <div class="note-field-group"><div class="note-field-label">目标次数（0表示普通打勾任务，不填数量）</div><input id="childTaskTotal" type="number" min="0" placeholder="例如：10"></div>
    <div class="note-field-group"><div class="note-field-label">备注（可选）</div><textarea id="childTaskNote" rows="2"></textarea></div>`;

function toggleTask(id){const t=findTaskItem(id);if(t){if(t.children&&t.children.length)return;t.done=!t.done;t.completedAt=t.done?Date.now():null;save();renderTasks();}}
function delTaskConfirm(id){confirmDel(()=>{const arr=findTaskParentArray(id);if(arr){const idx=arr.findIndex(t=>t.id===id);if(idx>-1)arr.splice(idx,1);}save();renderTasks();});}

function selectTaskForTimer(secs){
  const tasks=S.tasks.filter(t=>t.date===td()&&!t.done);
  const chipsHtml=tasks.length?`
    <div style="font-size:12px;color:var(--ink3);margin-bottom:6px;">今天的任务，点一下快速带入 ↓</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;" id="timerTaskChips">
      ${tasks.map(t=>`<div class="plan-outer-tab" data-ttid="${t.id}" style="font-size:12px;padding:5px 12px;cursor:pointer;">${esc(t.name)}</div>`).join('')}
    </div>`:'';
  const body=`
    ${chipsHtml}
    <div class="note-field-group"><div class="note-field-label">要启动做什么？（不填也能开始）</div><input type="text" id="timerTaskInput" placeholder="随便写，或者留空直接启动"></div>`;
  showModal('🚀 启动',body,()=>{
    const name=document.getElementById('timerTaskInput').value.trim();
    const linked=document.getElementById('timerTaskInput').dataset.linkedId||null;
    closeModal();
    startTimer(secs,name,linked);
  },null,{confirmText:'启动'});
  setTimeout(()=>{
    document.querySelectorAll('#timerTaskChips [data-ttid]').forEach(chip=>{
      chip.onclick=()=>{
        const t=tasks.find(x=>x.id===chip.dataset.ttid);if(!t)return;
        const inp=document.getElementById('timerTaskInput');
        inp.value=t.name;inp.dataset.linkedId=t.id;
        document.querySelectorAll('#timerTaskChips [data-ttid]').forEach(c=>c.classList.remove('on'));
        chip.classList.add('on');
      };
    });
    document.getElementById('timerTaskInput')?.focus();
  },80);
}

let timerInt=null;
function startTimer(secs,taskName,taskId){
  if(timerInt)clearInterval(timerInt);
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:linear-gradient(135deg,var(--bg),var(--g-light));z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;';
  let s=secs;
  const fmt=()=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  ov.innerHTML=`<div style="font-size:26px;">🚀 启动中</div>${taskName?`<div style="font-size:16px;color:var(--ink2);font-weight:500;">${esc(taskName)}</div>`:''}<div style="font-size:88px;font-weight:800;color:var(--g);letter-spacing:-4px;" id="timerDisp">${fmt()}</div><button class="pbtn" style="background:var(--red);" onclick="this.parentElement.remove();clearInterval(timerInt);">停止</button>`;
  document.body.appendChild(ov);
  timerInt=setInterval(()=>{
    s--;const d=document.getElementById('timerDisp');if(d)d.innerText=fmt();
    if(s<=0){
      clearInterval(timerInt);ov.remove();toast('时间到！');
      if(taskId){
        showModal('🎉 启动完成！', `<p style="font-size:14px;color:var(--ink2);">迈出第一步了！是否现在就将任务【<b>${esc(taskName)}</b>】标记为完成？</p>`,()=>{
          const t=S.tasks.find(x=>x.id===taskId);if(t){t.done=true;t.completedAt=Date.now();save();renderTasks();toast('任务完成，小宇宙爆发！');}
          closeModal();
        },null,{confirmText:'标记完成',cancelText:'暂不'});
      }else{
        toast('迈出第一步了，要不要趁热再启动一轮？');
      }
    }
  },1000);
}

// ==================== 日记（本子版） ====================
let _diaryPage=0; // 0=写新日记, 1=最新一篇, 2=更早...

let diarySearchKeyword='';
function getFilteredDiaries(){
  if(!diarySearchKeyword)return S.diaries;
  const kw=diarySearchKeyword;
  return S.diaries.filter(d=>(d.t||'').toLowerCase().includes(kw));
}

function renderDiaries(){
  const el=document.getElementById('recDiary');if(!el)return;

  el.innerHTML=`
    <div class="search-wrapper" style="margin-bottom:10px;"><input id="diarySearch" class="search-bar" placeholder="搜索日记内容…" value="${esc(diarySearchKeyword)}"><button class="search-btn" id="diarySearchBtn">🔍</button></div>
    <div class="notebook-wrap-grow" id="diaryNotebook">
      <div class="notebook-rings">${Array(7).fill('<div class="notebook-ring"></div>').join('')}</div>
      <div class="notebook-header" style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div class="notebook-title" id="diaryNbTitle">📝 新日记</div>
          <div class="notebook-date" id="diaryNbDate"></div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <button id="diaryPrevBtn" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--nb-ink2);padding:4px 8px;" title="上一篇">‹</button>
          <span id="diaryPageNum" style="font-size:11px;color:var(--nb-ink3);min-width:40px;text-align:center;"></span>
          <button id="diaryNextBtn" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--nb-ink2);padding:4px 8px;" title="下一篇">›</button>
        </div>
      </div>
      <div class="notebook-body" id="diaryNbBody"></div>
    </div>
    <div id="diaryActionArea"></div>`;

  const doSearch=()=>{
    diarySearchKeyword=document.getElementById('diarySearch').value.trim().toLowerCase();
    const results=getFilteredDiaries();
    if(diarySearchKeyword){
      if(!results.length){toast('没有找到匹配的日记');_diaryPage=0;}
      else{_diaryPage=1;} // 跳到第一条匹配结果
    }
    renderDiaryNbPage();
  };
  document.getElementById('diarySearchBtn').onclick=doSearch;
  document.getElementById('diarySearch').onkeypress=e=>{if(e.key==='Enter')doSearch();};

  document.getElementById('diaryPrevBtn').onclick=()=>{
    const diaries=getFilteredDiaries();
    // page 0=写新日记, 1=第1篇(最新), 2=第2篇...
    if(_diaryPage>0){_diaryPage--;renderDiaryNbPage();}
  };
  document.getElementById('diaryNextBtn').onclick=()=>{
    const diaries=getFilteredDiaries();
    if(_diaryPage<diaries.length){_diaryPage++;renderDiaryNbPage();}
  };

  renderDiaryNbPage();
}

function renderDiaryNbPage(){
  const body=document.getElementById('diaryNbBody');if(!body)return;
  const actionArea=document.getElementById('diaryActionArea');
  const diaries=getFilteredDiaries();
  const now=new Date();

  // 更新翻页状态
  const prevBtn=document.getElementById('diaryPrevBtn');
  const nextBtn=document.getElementById('diaryNextBtn');
  const pageNum=document.getElementById('diaryPageNum');
  const title=document.getElementById('diaryNbTitle');
  const date=document.getElementById('diaryNbDate');

  if(_diaryPage===0){
    // 写新日记
    prevBtn.style.opacity='0.3';prevBtn.style.pointerEvents='none';
    nextBtn.style.opacity=diaries.length?'1':'0.3';
    nextBtn.style.pointerEvents=diaries.length?'auto':'none';
    pageNum.textContent=diaries.length?`0/${diaries.length}`:'';
    title.textContent='📝 新日记';
    date.textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

    // 写入区——本子里只有纯粹的内容
    body.innerHTML=`<textarea id="diaryInput" class="diary-style-textarea" placeholder="今天的故事…" rows="7">${esc(S.diaryDraft||'')}</textarea>`;
    bindAutoGrow(document.getElementById('diaryInput'));
    bindDraftAutosave(document.getElementById('diaryInput'),(val)=>{S.diaryDraft=val;save();});
    if(actionArea)actionArea.innerHTML=`<button class="nb-add-outer-btn" onclick="saveDiaryNb()">保存日记</button>`;
  } else {
    // 查看历史日记
    const d=diaries[_diaryPage-1];
    if(!d){_diaryPage=0;renderDiaryNbPage();return;}
    prevBtn.style.opacity=_diaryPage>0?'1':'0.3';
    prevBtn.style.pointerEvents=_diaryPage>0?'auto':'none';
    nextBtn.style.opacity=_diaryPage<diaries.length?'1':'0.3';
    nextBtn.style.pointerEvents=_diaryPage<diaries.length?'auto':'none';
    pageNum.textContent=`${_diaryPage}/${diaries.length}`;
    title.textContent='📔 日记';
    date.textContent=d.date;

    body.innerHTML=`<div style="line-height:32px;font-size:14px;color:var(--nb-ink);white-space:pre-wrap;word-break:break-all;">${esc(d.t)}</div>`;

// ==================== 计划页面 ====================
// ==================== 计划页面（本子版） ====================
let _planType='day';
const PLAN_TABS=[
  {key:'day',label:'日计划',icon:'📝'},
  {key:'week',label:'本周',icon:'📅'},
  {key:'month',label:'本月',icon:'🗓'},
  {key:'year',label:'今年',icon:'🎯'},
];
const ARCHIVE_TAB={key:'archive',label:'存档',icon:'🗄️'};
const ALL_PLAN_TABS=[...PLAN_TABS,ARCHIVE_TAB];

// 日/周/月/年计划：过了那个周期就自动把当前内容（不管做完没做完）整体存进"存档"，再清空开始新的一期
function getPlanPeriodKey(type,dateStr){
  if(type==='week')return getISOWeekKey(dateStr);
  if(type==='month')return dateStr.slice(0,7);
  if(type==='year')return dateStr.slice(0,4);
  return dateStr; // day
}
function formatPlanPeriodLabel(type,key){
  if(type==='week'){const m=key.match(/^(\d+)-W(\d+)$/);return m?`${m[1]}年 第${parseInt(m[2])}周`:key;}
  if(type==='month'){const m=key.match(/^(\d+)-(\d+)$/);return m?`${m[1]}年${parseInt(m[2])}月`:key;}
  if(type==='year')return `${key}年`;
  return key;
}
function rolloverPlanPeriods(){
  if(!S.planPeriodKeys)S.planPeriodKeys={};
  const t=td();
  let changed=false;
  ['day','week','month','year'].forEach(type=>{
    const curKey=getPlanPeriodKey(type,t);
    const lastKey=S.planPeriodKeys[type];
    if(lastKey===undefined){
      S.planPeriodKeys[type]=curKey;changed=true;return;
    }
    if(lastKey!==curKey){
      const items=S.plans[type]||[];
      if(items.length){
        if(!S.planArchives)S.planArchives=[];
        S.planArchives.unshift({id:uid(),type,periodLabel:formatPlanPeriodLabel(type,lastKey),archivedAt:Date.now(),items:JSON.parse(JSON.stringify(items))});
      }
      S.plans[type]=[];
      S.planPeriodKeys[type]=curKey;
      changed=true;
    }
  });
  if(changed)save();
}

function renderPlan(){
  rolloverPlanPeriods();
  pruneExpiredPlans();
  _planType='day';
  const pc=document.getElementById('planContent');
  const now=new Date();
  pc.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px;">
      ${PLAN_TABS.map(t=>`<div class="plan-outer-tab${t.key==='day'?' on':''}" data-pt="${t.key}" style="text-align:center;">${t.icon} ${t.label}</div>`).join('')}
    </div>
    <div class="plan-outer-tab" data-pt="archive" style="width:100%;text-align:center;margin-bottom:8px;">${ARCHIVE_TAB.icon} ${ARCHIVE_TAB.label}</div>
    <button id="planFixedAddBtn" class="plan-outer-tab" style="width:100%;text-align:center;background:var(--g);color:#fff;border-color:var(--g);cursor:pointer;margin-bottom:12px;">＋ 添加</button>
    <div class="notebook-wrap" id="planNotebook">
      <div class="notebook-rings">${Array(6).fill('<div class="notebook-ring"></div>').join('')}</div>
      <div class="notebook-header">
        <div class="notebook-title" id="planNbTitle">📝 日计划</div>
        <div class="notebook-date" id="planNbDate">${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日</div>

// 递归统计完成进度，精确到最底层子项/数量打卡，而不是笼统按顶层条目算
function calcPlanProgress(items){
  let total=0,done=0;
  const walk=(list)=>{
    (list||[]).forEach(item=>{
      if(item.kind==='note')return; // 笔记式条目不参与完成度统计
      if(item.children&&item.children.length){
        walk(item.children);
      }else if(item.total>0){
        total+=1;
        done+=Math.min(1,(item.doneCount||0)/item.total);
      }else{
        total+=1;
        if(item.done)done+=1;
      }
    });
  };
  walk(items);
  return{total,done,percent:total?Math.round(done/total*100):100};
}
function renderPlanNbItems(){
  const body=document.getElementById('planNbBody');if(!body)return;
  if(_planType==='archive'){renderPlanArchiveList(body);return;}
  const items=(S.plans[_planType]||[]);
  const checkableItems=items.filter(i=>i.kind!=='note');
  const topDone=checkableItems.filter(isPlanItemDone).length;
  const progress=calcPlanProgress(items);
  body.innerHTML=`
    <div style="padding:8px 0 6px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--nb-ink3);margin-bottom:5px;">
        <span>完成 ${topDone}/${checkableItems.length} 项</span>
        <span style="font-weight:700;color:var(--g);font-size:15px;">${progress.percent}%</span>
      </div>
      <div style="background:var(--g-xlight);border-radius:6px;height:7px;overflow:hidden;">
        <div style="background:var(--g);height:100%;width:${progress.percent}%;transition:width .2s;"></div>
      </div>
    </div>
    ${items.length?items.map((item)=>renderNbItem(item,0)).join(''):'<div class="nb-empty">还没有计划，点右上角＋添加</div>'}`;
}

// ---- 存档（每期计划到期后自动整体存进来，不管做完没做完） ----
let expandedArchiveIds=new Set();
function togglePlanArchiveExpand(id){if(expandedArchiveIds.has(id))expandedArchiveIds.delete(id);else expandedArchiveIds.add(id);renderPlanNbItems();}
function renderPlanArchiveList(body){
  const list=(S.planArchives||[]).filter(a=>a.items);
  if(!list.length){body.innerHTML='<div class="nb-empty">还没有存档，日/周/月/年计划到期后会自动整体归档在这里</div>';return;}
  const typeLabel={day:'📝 日计划',week:'📅 周计划',month:'🗓 月计划',year:'🎯 年计划'};
  body.innerHTML=list.map(a=>{
    const progress=calcPlanProgress(a.items);
    const isOpen=expandedArchiveIds.has(a.id);
    return`<div class="nb-item" style="align-items:flex-start;">
      <div class="nb-check" style="border-color:var(--g-mid);color:var(--nb-ink3);font-size:9px;cursor:pointer;" onclick="togglePlanArchiveExpand('${a.id}')">${isOpen?'▼':'▶'}</div>
      <div class="nb-content">
        <div class="nb-item-title" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <span>${typeLabel[a.type]||a.type} · ${esc(a.periodLabel||'')}</span>
          <button class="tree-action-btn danger" onclick="deletePlanArchive('${a.id}')">🗑️</button>
        </div>
        <div class="nb-item-meta">完成度 ${progress.percent}%（${new Date(a.archivedAt).toLocaleDateString('zh-CN')} 存档）</div>
        ${isOpen?`<div style="margin-top:6px;">${a.items.map(it=>renderArchiveItemReadonly(it,0)).join('')}</div>`:''}
      </div>
    </div>`;
  }).join('');
}
function renderArchiveItemReadonly(item,level){
  if(item.kind==='note'){
    const isChild=level>0;
    return`<div class="nb-item${isChild?' nb-item-child':''}">
      <div class="nb-check" style="border-color:var(--g-mid);color:var(--nb-ink3);font-size:11px;pointer-events:none;">📝</div>
      <div class="nb-content">
        ${item.title?`<div class="nb-item-title" style="font-size:${isChild?12:14}px;">${isChild?'· ':''}${esc(item.title)}</div>`:''}
        <div style="margin:4px 0;border:1px solid var(--g-mid);border-radius:8px;overflow:hidden;max-width:180px;cursor:pointer;" onclick="viewPlanSketchImage(this.querySelector('img').src)"><img src="${item.image}" style="width:100%;display:block;"></div>
      </div>
    </div>`;
  }
  const hasChildren=item.children&&item.children.length>0;
  const done=isPlanItemDone(item);
  const isChild=level>0;
  const checkStyle=isChild?'width:14px;height:14px;margin-top:5px;':'';
  return`<div class="nb-item${isChild?' nb-item-child':''}">
    <div class="nb-check${done?' done':''}" style="${checkStyle}pointer-events:none;">${done?'✓':''}</div>
    <div class="nb-content">
      <div class="nb-item-title${done?' done':''}" style="font-size:${isChild?'12px':'14px'};${isChild?'font-weight:500;color:var(--nb-ink2);':''}">${isChild?'· ':''}${esc(item.title||item.text||'')}${item.total>0?` (${item.doneCount||0}/${item.total})`:''}</div>
      ${hasChildren?item.children.map(c=>renderArchiveItemReadonly(c,level+1)).join(''):''}
    </div>
  </div>`;
}
function deletePlanArchive(id){confirmDel(()=>{S.planArchives=(S.planArchives||[]).filter(a=>a.id!==id);save();renderPlanNbItems();});}

function isPlanItemDone(item){
  if(item.kind==='note')return true; // 笔记式条目视为中性，不影响完成度计算
  if(item.children&&item.children.length)return item.children.every(isPlanItemDone);
  if(item.total>0)return (item.doneCount||0)>=item.total;
  return !!item.done;
}

// 子项默认收起（东西一多就很乱），点了才展开；操作按钮也收进"⋯"里，平时只留打卡按钮，画面清爽点
let collapsedPlanIds=new Set();
function togglePlanCollapse(id){if(collapsedPlanIds.has(id))collapsedPlanIds.delete(id);else collapsedPlanIds.add(id);renderPlanNbItems();}
let openPlanActionIds=new Set();
function togglePlanActions(id){if(openPlanActionIds.has(id))openPlanActionIds.delete(id);else openPlanActionIds.add(id);renderPlanNbItems();}

function renderNbItem(item,level){
  level=level||0;
  if(item.kind==='note')return renderNbNoteItem(item,level);
  const hasChildren=item.children&&item.children.length>0;
  const hasNote=item.note&&item.note.trim();
  const hasDue=item.due;
  const hasDate=item.planDate&&item.planDate!==td();
  const isCollapsed=hasChildren&&collapsedPlanIds.has(item.id);
  const childDone=hasChildren?item.children.filter(isPlanItemDone).length:0;
  const allChildDone=hasChildren&&childDone===item.children.length;
  const isCounter=!hasChildren&&item.total>0;
  const itemDone=hasChildren?allChildDone:(isCounter?(item.doneCount||0)>=item.total:item.done);
  const isChild=level>0;
  const titleSize=isChild?(level===1?13:12):15;
  const checkSize=isChild?14:18;
  const checkStyle=`width:${checkSize}px;height:${checkSize}px;${isChild?'margin-top:5px;':''}`;
  const showActions=openPlanActionIds.has(item.id);
  return`<div class="nb-item${itemDone?' done-nb':''}${isChild?' nb-item-child':''}">
    ${hasChildren?
      `<div class="nb-check" style="${checkStyle}border-color:var(--g-mid);color:var(--nb-ink3);font-size:9px;cursor:pointer;" onclick="togglePlanCollapse('${item.id}')" title="${isCollapsed?'展开':'收起'}子项">${isCollapsed?childDone+'/'+item.children.length:'▼'}</div>`
      :isCounter?
      `<div class="nb-check" style="${checkStyle}border-color:var(--g-mid);color:var(--nb-ink3);font-size:9px;">${item.doneCount||0}/${item.total}</div>`
      :`<div class="nb-check${item.done?' done':''}" style="${checkStyle}" onclick="toggleNbPlan('${item.id}')">${item.done?'✓':''}</div>`}
    <div class="nb-content">
      <div class="nb-item-title${itemDone?' done':''}" style="font-size:${titleSize}px;${isChild?'font-weight:500;color:var(--nb-ink2);':''}">${isChild?'· ':''}${esc(item.title||item.text||'')}</div>
      ${hasNote?`<div class="nb-item-note">${esc(item.note)}</div>`:''}
      ${hasDue?`<div class="nb-item-meta">⏰ 截止 ${fmtDateShort(item.due)}</div>`:''}
      ${hasDate?`<div class="nb-item-meta">📅 计划于 ${fmtDateShort(item.planDate)}</div>`:''}
      ${hasChildren?`
        <div style="background:var(--g-xlight);border-radius:6px;height:6px;margin:4px 0;overflow:hidden;">
          <div style="background:var(--g);height:100%;width:${Math.round(childDone/item.children.length*100)}%;"></div>
        </div>`:''}
      ${isCounter?`
        <div style="background:var(--g-xlight);border-radius:6px;height:5px;margin:6px 0;overflow:hidden;"><div style="background:var(--g);height:100%;width:${Math.min(100,Math.round((item.doneCount||0)/item.total*100))}%;"></div></div>`:''}
      <div style="display:flex;align-items:center;gap:6px;margin:2px 0;">
        ${isCounter?`<button class="tree-action-btn accent" onclick="checkInPlanItem('${item.id}')" ${itemDone?'style="opacity:.4;pointer-events:none;"':''}>✅ +1</button>`:''}
        <button class="tree-action-btn" onclick="togglePlanActions('${item.id}')" style="color:var(--nb-ink3);${isCounter?'':'margin-left:0;'}margin-left:auto;padding:3px 9px;">⋯</button>
      </div>
      ${showActions?`<div class="nb-item-actions" style="margin:0 0 4px;flex-wrap:wrap;height:auto;">
        ${isCounter&&(item.doneCount||0)>0?`<button class="tree-action-btn" onclick="undoCheckInPlanItem('${item.id}')">↩️ 撤销</button>`:''}
        <button class="tree-action-btn" onclick="openAddChildPlanModal('${item.id}')">➕ 子项</button>
        ${_planType==='day'?`<button class="tree-action-btn" onclick="movePlanItemToToday('${item.id}')" title="挪到今日任务">↗️ 今日</button>`:''}
        <button class="tree-action-btn" onclick="editNbPlan('${item.id}')">✏️ 编辑</button>
        ${hasChildren&&allChildDone?`<button class="tree-action-btn accent" onclick="archiveWholePlan('${item.id}')">✓ 全部完成</button>`:''}
        <button class="tree-action-btn danger" onclick="deleteNbPlan('${item.id}')">🗑️ 删除</button>
      </div>`:''}
      ${!isCollapsed&&hasChildren?item.children.map(c=>renderNbItem(c,level+1)).join(''):(hasChildren?`<div style="font-size:11px;color:var(--nb-ink3);padding:2px 0;">▶ ${item.children.length} 项子任务（已折叠，点左边圆圈展开）</div>`:'')}
    </div>
  </div>`;
}

function renderNbNoteItem(item,level){
  const isChild=level>0;
  const showActions=openPlanActionIds.has(item.id);
  return`<div class="nb-item${isChild?' nb-item-child':''}">
    <div class="nb-check" style="border-color:var(--g-mid);color:var(--nb-ink3);font-size:11px;${isChild?'width:14px;height:14px;margin-top:5px;':''}">📝</div>
    <div class="nb-content">
      ${item.title?`<div class="nb-item-title" style="font-size:${isChild?13:15}px;${isChild?'font-weight:500;color:var(--nb-ink2);':''}">${isChild?'· ':''}${esc(item.title)}</div>`:''}
      <div style="margin:6px 0;border:1px solid var(--g-mid);border-radius:8px;overflow:hidden;max-width:220px;cursor:pointer;" onclick="viewPlanSketchImage('${item.id}')">
        <img src="${item.image}" style="width:100%;display:block;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin:2px 0;">
        <button class="tree-action-btn" onclick="togglePlanActions('${item.id}')" style="color:var(--nb-ink3);margin-left:auto;padding:3px 9px;">⋯</button>
      </div>
      ${showActions?`<div class="nb-item-actions" style="margin:0 0 4px;flex-wrap:wrap;height:auto;">
        <button class="tree-action-btn" onclick="editNbPlan('${item.id}')">✏️ 编辑</button>
        <button class="tree-action-btn danger" onclick="deleteNbPlan('${item.id}')">🗑️ 删除</button>
      </div>`:''}
    </div>
  </div>`;
}
function viewPlanSketchImage(idOrImage){
  let image=idOrImage;
  if(idOrImage&&!idOrImage.startsWith('data:')&&!idOrImage.startsWith('http')&&!idOrImage.startsWith('blob:')){
    const item=findPlanItem(idOrImage);
    if(!item||!item.image)return;
    image=item.image;
  }
  if(!image)return;
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML=`<img src="${image}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;">`;
  overlay.onclick=()=>overlay.remove();
  document.body.appendChild(overlay);
}

function findPlanItem(id,list){
  list=list||S.plans[_planType]||[];
  for(const item of list){
    if(item.id===id)return item;
    if(item.children&&item.children.length){
      const found=findPlanItem(id,item.children);
      if(found)return found;
    }
  }
  return null;
}
function findPlanParentArray(id,list){
  list=list||S.plans[_planType]||[];
  for(let i=0;i<list.length;i++){
    if(list[i].id===id)return list;
    if(list[i].children&&list[i].children.length){
      const found=findPlanParentArray(id,list[i].children);
      if(found)return found;
    }
  }
  return null;
}

function openNbPlanModal(existingId,parentId){

  const body=(container)=>{
    container.innerHTML=`

      </div>

        <input id="nbPlanDue" type="date" value="${item.due||''}">
      </div>`;
  };
  showModal(isEdit?'编辑计划':(parentId?'添加子项':'新建计划'),body,()=>{
    const title=document.getElementById('nbPlanTitle').value.trim();
    if(!title){toast('请填写标题');return;}
    const note=document.getElementById('nbPlanNote').value.trim();
    const due=document.getElementById('nbPlanDue').value;
    const total=parseInt(document.getElementById('nbPlanTotal').value)||0;
    if(isEdit){
      Object.assign(item,{title,note,due,text:title,total});
      if(item.doneCount===undefined)item.doneCount=0;
    }else if(parentId){
      const parent=findPlanItem(parentId);if(!parent)return;
      if(!parent.children)parent.children=[];
      parent.children.push({id:uid(),title,note,due,text:title,done:false,children:[],total,doneCount:0});
      collapsedPlanIds.delete(parentId);

function initSketchCanvas(existingImage){
  const canvas=document.getElementById('sketchCanvas');if(!canvas)return;
  const wrap=document.getElementById('sketchCanvasWrap');
  const imgWrap=document.getElementById('sketchImgWrap');
  const imgPreview=document.getElementById('sketchImgPreview');
  const fileInput=document.getElementById('sketchFileInput');
  const drawBtn=document.getElementById('sketchModeDrawBtn');
  const uploadBtn=document.getElementById('sketchModeUploadBtn');
  const clearBtn=document.getElementById('sketchClearBtn');

  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,rect.width,rect.height);
  ctx.strokeStyle='#222';
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.lineJoin='round';

  let drawing=false,lastX=0,lastY=0;
  function pos(e){
    const r=canvas.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    return{x:cx,y:cy};
  }
  function start(e){e.preventDefault();drawing=true;const p=pos(e);lastX=p.x;lastY=p.y;}
  function move(e){
    if(!drawing)return;e.preventDefault();
    const p=pos(e);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();
    lastX=p.x;lastY=p.y;
  }
  function end(){drawing=false;}
  canvas.addEventListener('pointerdown',start);
  canvas.addEventListener('pointermove',move);
  window.addEventListener('pointerup',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);

  drawBtn.onclick=()=>{wrap.style.display='';imgWrap.style.display='none';};
  uploadBtn.onclick=()=>{fileInput.click();};
  fileInput.onchange=()=>{
    const f=fileInput.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      imgPreview.src=reader.result;
      wrap.style.display='none';imgWrap.style.display='';
    };
    reader.readAsDataURL(f);
  };
  clearBtn.onclick=()=>{
    imgWrap.style.display='none';wrap.style.display='';
    imgPreview.src='';
    ctx.fillStyle='#fff';ctx.fillRect(0,0,rect.width,rect.height);
  };

  if(existingImage){
    imgPreview.src=existingImage;
    wrap.style.display='none';imgWrap.style.display='';
  }
}

function checkInPlanItem(id){

  if((item.doneCount||0)>=item.total){toast('已完成全部目标！');return;}

}
function undoCheckInPlanItem(id){

const STAGE_BADGES=[
  {min:0,emoji:'✨'},
  {min:1,emoji:'🔥'},
  {min:8,emoji:'🌾'},
  {min:21,emoji:'💎'},

  {min:2001,emoji:'🌅'}
];
function getBadgeForCount(n){let b=STAGE_BADGES[0];STAGE_BADGES.forEach(item=>{if(n>=item.min)b=item;});return b.emoji;}
// 累计打卡次数（不看是否连续，断了也不清零）
function getHabitTotalCount(h){
  return Object.keys(h.log||{}).filter(dt=>h.log[dt].status==='done').length;
}
function getISOWeekKey(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day+3);
  const firstThu=new Date(d.getFullYear(),0,4);
  const diff=(d-firstThu)/86400000;
  const week=1+Math.round((diff-3+((firstThu.getDay()+6)%7))/7);
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}
function addDaysStr(dateStr,n){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+n);return formatDate(d);}
function isDateRestForHabit(h,dateStr){
  if(h.log?.[dateStr]?.status==='skip')return true;
  return (h.restRanges||[]).some(r=>dateStr>=r.start&&dateStr<=r.end);
}
function isDateDoneForHabit(h,dateStr){return h.log?.[dateStr]?.status==='done';}
function getActivePhase(){return (S.phases||[]).find(p=>p.status==='active')||null;}
function isHabitDueToday(h){
  const t=td();
  if(isDateDoneForHabit(h,t))return false;
  if(isDateRestForHabit(h,t))return false;
  const phase=getActivePhase();
  if(h.phaseId&&(!phase||phase.id!==h.phaseId))return false;
  if(h.repeatType==='everyNDays'){
    const doneDates=Object.keys(h.log||{}).filter(dt=>h.log[dt].status==='done').sort();
    if(!doneDates.length)return true;
    let nextDue=addDaysStr(doneDates[doneDates.length-1],h.everyN||3);
    let guard=0;while(isDateRestForHabit(h,nextDue)&&guard<30){nextDue=addDaysStr(nextDue,1);guard++;}
    return t>=nextDue;
  }
  if(h.repeatType==='weeklyRotation'){
    const wk=getISOWeekKey(t);
    const doneThisWeek=Object.keys(h.log||{}).some(dt=>h.log[dt].status==='done'&&getISOWeekKey(dt)===wk);
    if(doneThisWeek)return false;
    const assignedWd=(h.weekOverrides&&h.weekOverrides[wk]!==undefined)?h.weekOverrides[wk]:h.defaultWeekday;
    const todayWd=(new Date(t+'T00:00:00').getDay()+6)%7;
    return todayWd>=assignedWd;
  }
  return true; // daily
}
